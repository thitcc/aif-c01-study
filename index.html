        var cls = s.submitted ? (si === k ? 'correct' : 'wrong') : '';
        return '<li class="' + cls + '"><span class="otext">' + esc(q.sequence[si]) + '</span>' + (s.submitted ? '' :
          '<span class="updown"><button class="btn icon" data-act="up" data-k="' + k + '"' + (k === 0 ? ' disabled' : '') + ' aria-label="Move up">▲</button>' +
          '<button class="btn icon" data-act="down" data-k="' + k + '"' + (k === s.orderState.length - 1 ? ' disabled' : '') + ' aria-label="Move down">▼</button></span>') + '</li>';
      }).join('') + '</ol>';
      if (s.submitted) h += '<div class="sec"><div class="lbl">Correct order</div><ol>' + q.sequence.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>';
    } else if (q.format === 'match') {
      h += '<div class="match">' + q.pairs.map(function (p, li) {
        var chosen = s.matchSel[li], ok = chosen === li;
        return '<div class="mrow' + (s.submitted ? (ok ? ' correct' : ' wrong') : '') + '"><div class="mleft">' + esc(p.left) + '</div>' +
          '<select data-act="match" data-li="' + li + '"' + (s.submitted ? ' disabled' : '') + '><option value="-1">Choose…</option>' +
          s.rightOrder.map(function (ri) { return '<option value="' + ri + '"' + (chosen === ri ? ' selected' : '') + '>' + esc(q.pairs[ri].right) + '</option>'; }).join('') +
          '</select>' + (s.submitted && !ok ? '<div class="mfix">Correct: <b>' + esc(p.right) + '</b></div>' : '') + '</div>';
      }).join('') + '</div>';
    }
    if (s.submitted) {
      var r = s.results[s.results.length - 1];
      h += '<div class="verdict ' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '✔ Correct' : '✘ Not quite') + '</div>' +
        '<div class="sec"><div class="lbl">Takeaway</div><p>' + esc(q.explain) + '</p></div>' + refsHTML(q.refs);
    }
    h += '</article>';
    $('view').innerHTML = h;
    if (s.submitted) {
      setActions('<button class="btn" data-act="qz-quit">End quiz</button><button class="btn primary" data-act="qz-next">' +
        (s.i + 1 < s.ids.length ? 'Next question' : 'See results') + '<kbd>Enter</kbd></button>');
    } else {
      setActions('<button class="btn" data-act="qz-quit">End quiz</button><button class="btn primary" data-act="qz-submit"' + (canSubmit(q) ? '' : ' disabled') + '>Check answer<kbd>Enter</kbd></button>');
    }
  }
  function canSubmit(q) {
    var s = state.qz;
    if (q.format === 'single') return s.sel.length === 1;
    if (q.format === 'multi') return s.sel.length === q.pick;
    if (q.format === 'match') return s.matchSel.every(function (v) { return v >= 0; });
    return true;
  }
  function submitQuiz() {
    var s = state.qz; if (!s || s.submitted) return;
    var q = QUIZ_BY[s.ids[s.i]]; if (!canSubmit(q)) return;
    var ok;
    if (q.format === 'single' || q.format === 'multi') {
      var correct = q.options.map(function (o, i) { return o.correct ? i : -1; }).filter(function (i) { return i >= 0; });
      ok = correct.length === s.sel.length && correct.every(function (i) { return s.sel.indexOf(i) >= 0; });
    } else if (q.format === 'order') ok = s.orderState.every(function (si, k) { return si === k; });
    else ok = s.matchSel.every(function (ri, li) { return ri === li; });
    s.submitted = true; s.results.push({ id: q.id, ok: ok, domain: q.domain });
    setQuiz(q.id, ok); renderQuiz();
  }
  function nextQuiz() {
    var s = state.qz; if (!s || !s.submitted) return;
    s.i++; if (s.i < s.ids.length) prepQuestion();
    renderQuiz(); window.scrollTo(0, 0);
  }
  function renderQuizEnd() {
    var s = state.qz, right = s.results.filter(function (r) { return r.ok; }).length, byD = {};
    s.results.forEach(function (r) { byD[r.domain] = byD[r.domain] || [0, 0]; byD[r.domain][1]++; if (r.ok) byD[r.domain][0]++; });
    var h = '<div class="panel"><div class="lbl">Result</div><div class="big">' + pct(right, s.results.length) + '%</div><p>' + right + ' of ' + s.results.length + ' correct.</p>';
    h += '<table class="stats"><tr><th>Domain</th><th>Score</th></tr>' + Object.keys(byD).sort().map(function (d) {
      return '<tr><td>D' + d + ' · ' + esc(DOMAINS[d].name) + '</td><td class="n">' + byD[d][0] + '/' + byD[d][1] + '</td></tr>';
    }).join('') + '</table>';
    var missed = s.results.filter(function (r) { return !r.ok; });
    h += '<div class="row"><button class="btn primary" data-act="qz-retry"' + (missed.length ? '' : ' disabled') + '>Retry the ' + missed.length + ' missed</button>' +
      '<button class="btn" data-act="qz-new">New quiz</button></div></div>';
    if (missed.length) {
      h += '<div class="panel mini"><div class="lbl">Missed</div><ul>' + missed.map(function (r) {
        var q = QUIZ_BY[r.id]; return '<li>' + esc(q.stem.length > 180 ? q.stem.slice(0, 177) + '…' : q.stem) + '<div class="a">' + esc(q.explain) + '</div></li>';
      }).join('') + '</ul></div>';
    }
    $('view').innerHTML = h; setActions('');
  }

  // ---------- REVIEW ----------
  function renderReview() {
    var cards = CARDS.filter(function (c) { return passFilters(c, false); });
    var quiz = QUIZ.filter(function (q) { return passFilters(q, false); });
    var toReview = cards.filter(function (c) { return cardStatus(c.id) === 'unknown'; });
    var wrong = quiz.filter(function (q) { return quizStatus(q.id) === 'wrong'; });
    var h = '<div class="panel"><div class="lbl">Progress by domain</div><table class="stats"><tr><th>Domain</th><th>Cards known</th><th></th><th>To review</th><th>Quiz</th></tr>';
    [1, 2, 3, 4, 5].forEach(function (d) {
      var cs = CARDS.filter(function (c) { return c.domain === d; }), qs = QUIZ.filter(function (q) { return q.domain === d; });
      var k = cs.filter(function (c) { return cardStatus(c.id) === 'known'; }).length;
      var u = cs.filter(function (c) { return cardStatus(c.id) === 'unknown'; }).length;
      var qa = qs.filter(function (q) { return quizStatus(q.id) !== 'new'; }).length, qr = qs.filter(function (q) { return quizStatus(q.id) === 'right'; }).length;
      h += '<tr><td>D' + d + ' <span class="muted">' + DOMAINS[d].w + '%</span></td><td class="n">' + k + '/' + cs.length + '</td><td><div class="bar"><i style="width:' + pct(k, cs.length) +
        '%"></i></div></td><td class="n">' + u + '</td><td class="n">' + (qa ? qr + '/' + qa : '–') + '</td></tr>';
    });
    h += '</table></div>';
    h += '<div class="panel"><div class="row" style="margin-top:0"><button class="btn primary" data-act="rv-cards"' + (toReview.length ? '' : ' disabled') + '>Drill ' + toReview.length + ' cards to review</button>' +
      '<button class="btn" data-act="rv-quiz"' + (wrong.length ? '' : ' disabled') + '>Retry ' + wrong.length + ' missed questions</button></div>' +
      '<p class="muted mini">These use the domain and focus filters above.</p></div>';
    if (toReview.length) {
      h += '<div class="panel mini"><div class="lbl">Cards to review: quick scan</div><ul>' + toReview.map(function (c) {
        return '<li><b>' + esc(c.front) + '</b><div class="a">' + esc(c.answer) + '</div></li>';
      }).join('') + '</ul></div>';
    }
    h += '<div class="panel mini"><div class="lbl">Sync between devices (GitHub gist)</div>';
    if (!syncCfg.token) {
      h += '<p>Keep your marks in sync between PC and tablet through a secret gist in your GitHub account.</p><ol>' +
        '<li><a href="https://github.com/settings/tokens/new?scopes=gist&description=AIF-C01%20study%20sync" target="_blank" rel="noopener">Create a GitHub token</a> ' +
        'with only the <b>gist</b> scope (an expiration of 30 days is plenty) and copy it.</li>' +
        '<li>Paste it below and tap Connect. Do the same on your other device.</li></ol>' +
        '<input class="search" id="syncToken" type="password" autocomplete="off" spellcheck="false" placeholder="GitHub token (gist scope only)">' +
        '<div class="row"><button class="btn small primary" data-act="sync-connect">Connect</button></div>' +
        '<p class="muted">The token is stored only in this browser, on this device. Marks sync on open, after each change and when you come back to the app.</p>';
    } else {
      h += '<p id="syncStatus">' + esc(syncStatusText()) + '</p><div class="row"><button class="btn small primary" data-act="sync-now">Sync now</button>' +
        '<button class="btn small" data-act="sync-disconnect">Disconnect this device</button></div>';
    }
    h += '</div><div class="panel mini"><div class="lbl">Manual transfer (backup)</div>' +
      '<p class="muted">Copy a progress code here and import it on the other device. Importing merges: for each card, the most recent mark wins.</p>' +
      '<div class="row"><button class="btn small" data-act="code-copy">Copy progress code</button>' +
      (navigator.share ? '<button class="btn small" data-act="code-share">Share code</button>' : '') + '</div>' +
      '<textarea class="search code" id="codeBox" rows="3" spellcheck="false" placeholder="Paste a progress code here"></textarea>' +
      '<div class="row"><button class="btn small" data-act="code-import">Import code</button></div>' +
      '<p class="muted" id="codeMsg">' + esc(state.codeMsg || '') + '</p></div>';
    h += '<div class="panel mini"><div class="lbl">Reset</div><p class="muted">' +
      (syncCfg.token ? 'Erases your marks here and, through sync, on your other devices too.' : 'Progress lives only in this browser on this device.') + '</p>' +
      '<button class="btn small' + (state.resetArmed ? ' active-bad' : '') + '" data-act="rv-reset">' + (state.resetArmed ? 'Tap again to erase all progress' : 'Reset progress') + '</button></div>';
    $('view').innerHTML = h; setActions('');
    state.codeMsg = '';
  }

  // ---------- TIPS ----------
  function renderTips() {
    var h = '<div class="panel tips">' +
      '<h3>The exam</h3><ul><li>65 questions in 90 minutes: 50 scored + 15 unscored (you cannot tell which). Pass = 700 / 1000.</li>' +
      '<li>Formats: multiple choice (1 of 4), multiple response (2+ of 5+), ordering (3–5 steps), matching (3–7 pairs).</li>' +
      '<li>Scoring is compensatory: you need the total, not every domain. No penalty for guessing, so never leave a blank.</li>' +
      '<li>Weights: D1 20% · D2 24% · D3 28% · D4 14% · D5 14%.</li></ul>' +
      '<h3>How to attack a question</h3><ul><li>Read the LAST sentence first: find the requirement (LEAST operational overhead, MOST cost-effective, without retraining, real-time…).</li>' +
      '<li>"Least operational overhead" usually means the most managed option (for example Bedrock over self-hosting, a purpose-built AI service over a custom model).</li>' +
      '<li>If one narrow AWS AI service does exactly the job (sentiment, OCR, speech-to-text), it usually beats a GenAI build.</li>' +
      '<li>Eliminate the options that solve a different problem, then choose between the last two using the requirement keyword.</li>' +
      '<li>About 80 seconds per question. Flag hard ones, move on, come back at the end.</li>' +
      '<li><b>Do not eliminate a service because AWS retired it.</b> AWS has closed SageMaker Clarify, Model Monitor, Ground Truth, Amazon A2I, Amazon Kendra, Amazon Q Business, Amazon Forecast and Bedrock Agents (now "Classic") to new customers, most of them in 2026. The exam question pool lags behind: each one is still the correct answer for its classic job.</li></ul>' +
      '<h3>Tags in this deck</h3><ul><li><span class="b t-new2026">NEW 2026</span> added in the 2026 exam-guide revisions. Most practice exams do not cover these, and recent test-takers were surprised by them.</li>' +
      '<li><span class="b t-hot">HOT</span> reported as frequent or confusing by people who took the exam in September 2026.</li>' +
      '<li><span class="b t-legacy">LEGACY</span> not on the current in-scope list but still shows up as an answer or distractor.</li></ul>' +
      '<h3>Suggested plan</h3><ul><li><b>Monday night:</b> Learn D1 then D2, then Flashcards D1–D2, then a short quiz.</li>' +
      '<li><b>Tuesday morning:</b> D3 (Learn, then Flashcards) and the D3 quiz.</li>' +
      '<li><b>Tuesday midday:</b> D4 and D5, then filter NEW 2026.</li>' +
      '<li><b>Tuesday afternoon:</b> one timed practice exam from another source (65 questions / 90 min). Review every miss.</li>' +
      '<li><b>Tuesday evening:</b> Review tab (cards to review + missed questions), compare cards, HOT filter. Sleep early.</li>' +
      '<li><b>Wednesday:</b> 20–30 minutes in the Review tab only. No new material.</li></ul>' +
      '<h3>Controls</h3><ul><li>Learn: tap a card to collapse it to just the question, tap again to expand. "Collapse all" turns the list into a self-test.</li>' +
      '<li>Flashcards (keyboard): Space = reveal, 1 = didn\'t know, 2 = knew it, ← = back.</li>' +
      '<li>Quiz: A–E or 1–5 pick an option, Enter = check / next.</li></ul>' +
      '<p class="muted mini">Deck: ' + CARDS.length + ' cards · ' + QUIZ.length + ' questions' + (META.built ? ' · built ' + esc(META.built) : '') +
      (META.partial ? ' · partial build: more domains are coming' : '') + ' · based on the AIF-C01 exam guide v1.1 (April 2026).</p></div>';
    $('view').innerHTML = h; setActions('');
  }

  // ---------- actions / events ----------
  function setActions(html) {
    $('actions').innerHTML = html;
    $('actionbar').hidden = !html;
  }
  function handleAct(act, el) {
    var s = state.qz;
    switch (act) {
      case 'mark-known': case 'mark-unknown': {
        var art = el.closest('[data-id]'); var id = art.getAttribute('data-id');
        var target = act === 'mark-known' ? 'known' : 'unknown';
        setCard(id, cardStatus(id) === target ? 'new' : target);
        var st = cardStatus(id);
        art.className = 'card learn st-' + st;
        var bs = art.querySelectorAll('[data-act]');
        bs[0].className = 'btn small' + (st === 'unknown' ? ' active-bad' : '');
        bs[1].className = 'btn small' + (st === 'known' ? ' active-ok' : '');
        break;
      }
      case 'fc-flip': fcFlip(); break;
      case 'fc-yes': fcRate(true); break;
      case 'fc-no': fcRate(false); break;
      case 'fc-skip': if (state.fc) { state.fc.pos++; state.fc.flipped = false; renderFlash(); } break;
      case 'fc-prev': if (state.fc && state.fc.pos > 0) { state.fc.pos--; state.fc.flipped = false; renderFlash(); } break;
      case 'fc-restart': startFlash(false); renderFlash(); break;
      case 'fc-review': startFlash(true); renderFlash(); break;
      case 'qz-start-todo': startQuiz(quizPool(true).map(function (q) { return q.id; })); break;
      case 'qz-start-all': startQuiz(quizPool(false).map(function (q) { return q.id; })); break;
      case 'opt': {
        if (!s || s.submitted) break;
        var q = QUIZ_BY[s.ids[s.i]], oi = +el.getAttribute('data-oi');
        if (q.format === 'single') s.sel = [oi];
        else { var k = s.sel.indexOf(oi); if (k >= 0) s.sel.splice(k, 1); else s.sel.push(oi); }
        renderQuiz(); break;
      }
      case 'up': case 'down': {
        if (!s || s.submitted) break;
        var i = +el.getAttribute('data-k'), j = act === 'up' ? i - 1 : i + 1;
        if (j < 0 || j >= s.orderState.length) break;
        var t = s.orderState[i]; s.orderState[i] = s.orderState[j]; s.orderState[j] = t; renderQuiz(); break;
      }
      case 'qz-submit': submitQuiz(); break;
      case 'qz-next': nextQuiz(); break;
      case 'qz-quit': if (s) { if (s.results.length) { s.ids = s.ids.slice(0, s.results.length); s.i = s.ids.length; renderQuiz(); } else { state.qz = null; renderQuiz(); } } break;
      case 'qz-retry': startQuiz(s.results.filter(function (r) { return !r.ok; }).map(function (r) { return r.id; })); break;
      case 'qz-new': state.qz = null; renderQuiz(); break;
      case 'rv-cards': prefs.mode = 'flash'; savePrefs(); startFlash(true); renderTabs(); renderFilters(); render(); window.scrollTo(0, 0); break;
      case 'rv-quiz': {
        var ids = QUIZ.filter(function (x) { return passFilters(x, false) && quizStatus(x.id) === 'wrong'; }).map(function (x) { return x.id; });
        prefs.mode = 'quiz'; savePrefs(); renderTabs(); renderFilters(); startQuiz(ids); break;
      }
      case 'rv-reset':
        if (!state.resetArmed) { state.resetArmed = true; renderReview(); setTimeout(function () { state.resetArmed = false; if (prefs.mode === 'review') renderReview(); }, 4000); }
        else {
          P = { cards: {}, quiz: {}, resetAt: Date.now() };  // resetAt lets the reset win over older marks on synced devices
          save(LS_PROGRESS, P); state.resetArmed = false; state.fc = null; state.qz = null; renderSummary(); renderReview(); scheduleSync(300);
        }
        break;
      case 'sync-connect': {
        var tok = ($('syncToken').value || '').trim();
        if (!tok) break;
        syncCfg = { token: tok }; saveSync(); renderReview();
        syncNow();
        break;
      }
      case 'sync-now': syncNow(); break;
      case 'sync-disconnect': clearTimeout(syncTimer); syncTimer = null; syncCfg = {}; saveSync(); renderSummary(); renderReview(); break;
      case 'code-copy':
        makeCode().then(function (code) {
          var box = $('codeBox'); box.value = code; box.focus(); box.select();
          var done = function () { $('codeMsg').textContent = 'Code copied (' + code.length + ' characters). Paste it into "Import code" on the other device.'; };
          var manual = function () {
            try { if (document.execCommand('copy')) { done(); return; } } catch (e) { /* fall through */ }
            $('codeMsg').textContent = 'The code is selected above: copy it manually.';
          };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, manual); else manual();
        });
        break;
      case 'code-share':
        makeCode().then(function (code) { return navigator.share({ title: 'AIF-C01 study progress', text: code }); }).catch(function () { /* share sheet closed */ });
        break;
      case 'code-import':
        readCode($('codeBox').value || '').then(function (data) {
          var m = mergeProgress(P, data);
          if (m.localChanged) { P = m.merged; save(LS_PROGRESS, P); }
          state.codeMsg = m.localChanged ? '✓ Imported. Marks merged (the most recent mark for each card wins).' : 'Nothing new in that code: you already have these marks.';
          renderSummary(); renderReview();
          if (m.localChanged) scheduleSync(300);
        }).catch(function (e) { $('codeMsg').textContent = 'Could not import: ' + e.message + '.'; });
        break;
    }
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el && !el.disabled) { handleAct(el.getAttribute('data-act'), el); return; }
    if (prefs.mode === 'flash' && e.target.closest('#fcCard') && !e.target.closest('a')) { fcFlip(); return; }
    if (prefs.mode === 'learn') {
      var art = e.target.closest('article.card.learn');
      // a tap toggles the card; ignore taps on controls/links and clicks that end a text selection
      if (art && !e.target.closest('a, button, select, input') && !String(window.getSelection ? window.getSelection() : '')) toggleCollapse(art);
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-act') === 'match' && state.qz && !state.qz.submitted) {
      state.qz.matchSel[+el.getAttribute('data-li')] = +el.value;
      var q = QUIZ_BY[state.qz.ids[state.qz.i]];
      var btn = document.querySelector('[data-act="qz-submit"]'); if (btn) btn.disabled = !canSubmit(q);
    }
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (prefs.mode === 'flash' && state.fc) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!state.fc.flipped) fcFlip(); }
      else if (e.key === '1') fcRate(false);
      else if (e.key === '2') fcRate(true);
      else if (e.key === 'ArrowLeft') handleAct('fc-prev');
      else if (e.key === 'ArrowRight') handleAct('fc-skip');
    } else if (prefs.mode === 'quiz' && state.qz && state.qz.i < state.qz.ids.length) {
      var s = state.qz, q = QUIZ_BY[s.ids[s.i]];
      if (e.key === 'Enter') { e.preventDefault(); if (s.submitted) nextQuiz(); else submitQuiz(); return; }
      if (!s.submitted && (q.format === 'single' || q.format === 'multi')) {
        var k = 'abcdefg'.indexOf(e.key.toLowerCase()); if (k < 0) k = '1234567'.indexOf(e.key);
        if (k >= 0 && k < s.optOrder.length) { var fake = document.createElement('i'); fake.setAttribute('data-oi', s.optOrder[k]); handleAct('opt', fake); }
      }
    }
  });

  // ---------- render ----------
  function renderView() {
    switch (prefs.mode) {
      case 'learn': setActions(''); renderLearn(); break;
      case 'flash': renderFlash(); break;
      case 'quiz': renderQuiz(); break;
      case 'review': renderReview(); break;
      default: renderTips();
    }
  }
  function render() { renderView(); }

  if (!MODES.some(function (m) { return m[0] === prefs.mode; })) prefs.mode = 'learn';
  applyTheme(); renderSummary(); renderTabs(); renderFilters();
  if (prefs.mode === 'flash') startFlash(false);
  render();
  $('foot').textContent = CARDS.length + ' cards · ' + QUIZ.length + ' questions' + (META.built ? ' · built ' + META.built : '') +
    (META.partial ? ' · partial build (more domains coming)' : '') + ' · progress is saved in this browser';
  if (syncCfg.token) syncNow();
})();
</script>
</body>
</html>
