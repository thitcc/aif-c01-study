n, text out) plus image, video and speech models. Stems mention 'images and text together' or 'analyze a chart and explain it'.","example":"An insurance app sends a photo of car damage and asks 'Describe the damage'; a multimodal model returns a text description.","cues":["images and text","multiple data types","analyze video and answer questions","text, image, audio"],"confuse":[{"with":"Amazon Rekognition","diff":"Pre-trained computer vision service for detection tasks; it does not hold open-ended conversations about images."},{"with":"LLM (text only)","diff":"Accepts and produces only text."}],"memory":"Multi-modal = many senses.","refs":["Exam guide 2.1.1","https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html"],"slice":"s2"},{"id":"s2-diffusion-models","domain":2,"task":"2.1","objective":"2.1.1","kind":"concept","tags":[],"front":"What is a diffusion model, and how does it differ from GANs and VAEs?","answer":"A generative model that creates images (or other media) by starting from random noise and removing noise step by step, guided by a text prompt, until a realistic output appears.","explain":"During training, the model learns to reverse a process that gradually adds noise to real images. At generation time it starts with pure noise and 'denoises' it into a new image that matches the prompt. Diffusion is the dominant approach behind modern text-to-image tools. Other generative approaches: a GAN (generative adversarial network) trains a generator and a discriminator in competition until fakes look real, and a VAE (variational autoencoder) compresses data into a latent space and decodes new samples from it.","example":"Prompt 'a red sneaker on a beach at sunset' produces a brand-new image from noise.","cues":["start from noise","text-to-image","iterative denoising","generate images"],"confuse":[{"with":"GAN","diff":"Generator vs discriminator competing; not noise-removal steps."},{"with":"VAE","diff":"Encoder compresses to a latent space and a decoder generates from it."},{"with":"Transformer LLM","diff":"Generates text token by token rather than denoising an image."}],"memory":"Diffusion denoises, GAN duels, VAE compresses.","refs":["Exam guide 2.1.1"],"slice":"s2"},{"id":"s2-fm-lifecycle","domain":2,"task":"2.1","objective":"2.1.3","kind":"concept","tags":[],"front":"What are the stages of the foundation model lifecycle?","answer":"Data selection, model selection, pre-training, fine-tuning, evaluation, deployment, and feedback, with feedback used to improve the model in later iterations.","explain":"Data selection chooses and cleans the training data. Model selection picks the architecture or existing FM. Pre-training teaches general knowledge from massive unlabeled data (very expensive, usually done by the model provider), and fine-tuning adapts the model to specific tasks with smaller, targeted data. Evaluation measures quality and safety on test data before deployment; deployment makes the model available for inference (using it to answer requests). Feedback from real users and monitoring after deployment closes the loop and feeds the next improvement cycle.","example":"A company picks an existing FM, fine-tunes it on support tickets, evaluates answers, deploys it, then collects thumbs-up/down ratings for the next version.","cues":["lifecycle stages","pre-training","collect user feedback after deployment","evaluate before deployment"],"confuse":[{"with":"ML development lifecycle","diff":"Classic ML: frame problem, prepare data, train, evaluate, deploy, monitor; FM lifecycle adds pre-training vs fine-tuning."},{"with":"Evaluation vs feedback","diff":"Evaluation uses test data before deployment; feedback comes from real users after deployment."}],"memory":"Data, Model, Pre-train, Fine-tune, Evaluate, Deploy, Feedback: 'Do Most People Find Every Detail Fun?'","refs":["Exam guide 2.1.3"],"slice":"s2"},{"id":"s2-pretraining-data","domain":2,"task":"2.1","objective":"2.1.3","kind":"concept","tags":[],"front":"How does pre-training differ from fine-tuning in data and cost?","answer":"Pre-training learns general knowledge from massive unlabeled data through self-supervised learning and is very expensive, usually done by the model provider; fine-tuning uses a much smaller, often labeled, task-specific dataset to specialize an existing FM.","explain":"Unlabeled data is raw content with no correct answer attached; labeled data pairs each example with the desired output. In self-supervised learning the data provides its own target, for example hiding the next token and learning to predict it, so no human labeling is needed. Pre-training on enormous amounts of text costs a great deal of compute and time, which is why most companies start from an existing FM and only fine-tune or prompt it.","example":"A provider pre-trains an FM on public web text; a bank then fine-tunes it on a few thousand labeled examples of its own support answers.","cues":["unlabeled data at massive scale","self-supervised","adapt an existing FM","smaller task-specific dataset"],"confuse":[{"with":"Fine-tuning","diff":"Starts from an already pre-trained FM and uses a small targeted dataset."},{"with":"Prompt engineering","diff":"Uses no training at all and leaves the weights unchanged."}],"memory":"Pre-training = going to school; fine-tuning = on-the-job training.","refs":["Exam guide 2.1.3"],"slice":"s2"},{"id":"s2-token-pricing","domain":2,"task":"2.1","objective":"2.1.4","kind":"concept","tags":["new2026"],"front":"How does token-based pricing work for FM inference, and how does it affect cost and performance?","answer":"On-demand inference for text models is billed per input token processed and per output token generated, so longer prompts and longer responses both increase cost; longer responses add the most latency because output is generated token by token.","explain":"Inference means sending a request to a model and getting an answer. With on-demand pricing in Amazon Bedrock you pay for tokens in (your prompt, instructions, history and documents) and tokens out (the response), usually at different rates, with output often priced higher. Cost levers: shorter prompts, only relevant context, concise answers and smaller models when quality allows. Not every model is billed per token: image and video generation models are priced per image or per second of video, and embedding models charge only for input tokens.","example":"A chatbot sending a 3,000-token prompt with the full chat history on every turn pays for those 3,000 input tokens each time.","cues":["pay per token","input and output tokens","reduce inference cost","long prompts increase cost"],"confuse":[{"with":"Provisioned Throughput","diff":"A reserved-capacity pricing mode (covered with Bedrock pricing options), not per-token on-demand."},{"with":"Instance-hour pricing","diff":"Paying for a running server (for example a SageMaker AI endpoint) regardless of tokens."}],"memory":"Pay by the word-piece, both ways: in and out.","refs":["Exam guide 2.1.4","https://aws.amazon.com/bedrock/pricing/"],"slice":"s2"},{"id":"s2-context-engineering","domain":2,"task":"2.1","objective":"2.1.5","kind":"concept","tags":["new2026"],"front":"What is context engineering in FM applications?","answer":"Deliberately selecting, structuring and managing all the information placed in the model's context window, such as instructions, retrieved documents, memory, conversation history and tool results, so the model has exactly what it needs.","explain":"Prompt engineering focuses on how you word the request; context engineering designs the whole package the model sees on each call. Because the context window is limited and every token costs money, you include only relevant, up-to-date material, summarize or drop old history, and order information clearly. Good context engineering improves accuracy, reduces hallucinations, and lowers cost and latency, especially in agents and multi-turn assistants.","example":"An assistant keeps a short summary of earlier turns, adds the 3 most relevant policy passages and the latest order status, instead of dumping the whole chat log and manual.","cues":["what goes into the context window","memory and tool results","relevant information only","long conversations"],"confuse":[{"with":"Prompt engineering","diff":"Optimizes the wording of the instruction; context engineering curates everything in the window."},{"with":"Fine-tuning","diff":"Changes model weights; context engineering changes only what the model sees at inference time."}],"memory":"Prompt engineering writes the question; context engineering packs the briefcase.","refs":["Exam guide 2.1.5"],"slice":"s2"},{"id":"s2-genai-advantages","domain":2,"task":"2.2","objective":"2.2.1","kind":"concept","tags":[],"front":"What are the main advantages of generative AI?","answer":"Adaptability to many tasks with one model, responsiveness (fast answers at scale), natural conversational capabilities, and the ability to generate new content such as text, images, code and audio.","explain":"Adaptability means one FM can summarize, translate and classify just by changing the prompt. Responsiveness means it can serve many users instantly, around the clock. Conversational capability lets users interact in plain language, and content generation creates new material rather than only labeling existing data. The exam pairs these with scenarios about scaling customer support or content creation.","example":"One model drafts marketing copy in the morning and answers employee HR questions in the afternoon.","cues":["adapt to many tasks","natural language interaction","generate new content","scale quickly"],"confuse":[{"with":"Traditional ML","diff":"Predicts a label or number for one narrow task; it does not generate new content."}],"memory":"ARCC: Adaptable, Responsive, Conversational, Creates.","refs":["Exam guide 2.2.1"],"slice":"s2"},{"id":"s2-hallucination","domain":2,"task":"2.2","objective":"2.2.2","kind":"concept","tags":["hot"],"front":"What is a hallucination in generative AI?","answer":"A hallucination is output that sounds confident and plausible but is factually incorrect, fabricated, or not supported by the provided data.","explain":"LLMs generate the statistically likely next token; they do not look facts up, so they can invent citations, numbers, policies or events. This is the most cited GenAI disadvantage on the exam. The usual mitigation is grounding answers in trusted company data by retrieving relevant documents and adding them to the prompt (retrieval-augmented generation, RAG), plus guardrails (filters that block or check unsafe or off-topic outputs, such as Amazon Bedrock Guardrails) and human review. Detection techniques are covered with responsible AI.","example":"A support bot tells a customer the refund window is 90 days when the real policy says 30 days.","cues":["plausible but false","fabricated information","confidently wrong","made-up sources"],"confuse":[{"with":"Nondeterminism","diff":"Different answers to the same prompt; a hallucination is a wrong answer, even if repeated."},{"with":"Bias","diff":"Systematic unfairness toward groups, not invented facts."}],"memory":"Hallucination = the model dreaming out loud.","refs":["Exam guide 2.2.2"],"slice":"s2"},{"id":"s2-nondeterminism","domain":2,"task":"2.2","objective":"2.2.2","kind":"concept","tags":[],"front":"What does nondeterminism mean for GenAI outputs?","answer":"Nondeterminism means the same prompt can produce different outputs on different runs, which makes GenAI results harder to reproduce, test and audit.","explain":"Models pick each next token by sampling from probabilities, so wording and sometimes content vary between runs. That is fine for creative tasks but a problem where identical, repeatable results are required. Lowering randomness settings reduces variation but should not be treated as a guarantee of identical outputs. Exam stems say 'consistent', 'repeatable' or 'same answer every time'.","example":"Asking twice for a product description returns two differently worded versions.","cues":["different output for the same input","not repeatable","consistent answers required"],"confuse":[{"with":"Hallucination","diff":"About correctness of content, not variation between runs."},{"with":"Temperature","diff":"An inference parameter (covered with prompt engineering) that controls how random sampling is."}],"memory":"Same question, new roll of the dice.","refs":["Exam guide 2.2.2"],"slice":"s2"},{"id":"s2-genai-disadvantages","domain":2,"task":"2.2","objective":"2.2.2","kind":"concept","tags":[],"front":"Besides hallucinations, which disadvantages of GenAI does the exam expect you to know?","answer":"Limited interpretability (hard to explain why an output was produced), inaccuracy, nondeterminism, plus cost and latency at scale and uncertainty about training data and generated content ownership.","explain":"Interpretability means being able to understand how a model reached its result; FMs with billions of parameters behave like black boxes. Inaccuracy covers outdated knowledge (the model only knows data up to its training cutoff) and plain mistakes. These limits matter most in regulated decisions (credit, medical, legal) where you must justify each decision, and the exam often expects you to prefer a simpler or explainable approach there.","example":"A bank cannot explain to a regulator why an LLM approved one loan and denied another.","cues":["black box","cannot explain decisions","regulated industry","knowledge cutoff"],"confuse":[{"with":"Amazon SageMaker Clarify","diff":"Provides bias and explainability reports for models; it does not make large FMs fully transparent."}],"memory":"HINT: Hallucination, Interpretability, Nondeterminism, Truthfulness (inaccuracy).","refs":["Exam guide 2.2.2"],"slice":"s2"},{"id":"s2-model-selection-factors","domain":2,"task":"2.2","objective":"2.2.3","kind":"concept","tags":[],"front":"Which factors should you consider when selecting a GenAI model?","answer":"Model type and modality, capabilities, performance and accuracy requirements, constraints such as context window and languages, compliance and data residency, cost, latency, and model complexity or size.","explain":"No single model is best for everything. Match the modality (text, image, speech), check it can do the task in the needed languages and fits your document sizes, and confirm it meets regulatory requirements, including data residency (rules on where data may be stored and processed) and availability in the right AWS Region (a geographic area, such as Europe (Ireland), where AWS runs data centers; not every model is offered in every Region). Larger models are usually more capable but slower and more expensive; smaller models are cheaper and faster for simpler tasks. The exam stem usually states one decisive requirement (lowest latency, lowest cost, compliance) that picks the answer.","example":"A real-time chat for simple FAQs chooses a small, fast text model; a legal analysis tool chooses a larger model with a big context window.","cues":["choose the right model","latency requirement","cost constraints","compliance requirement"],"confuse":[{"with":"Model evaluation","diff":"Measures quality of candidate models with metrics; selection factors decide what to shortlist."}],"memory":"Pick a model like a car: purpose, speed, price, rules of the road.","refs":["Exam guide 2.2.3"],"slice":"s2"},{"id":"s2-business-metrics","domain":2,"task":"2.2","objective":"2.2.4","kind":"concept","tags":[],"front":"Which business metrics measure the value of a GenAI application?","answer":"ROI, efficiency, conversion rate, average revenue per user (ARPU), customer lifetime value (CLV), accuracy, and cross-domain performance measure whether the application delivers business value.","explain":"ROI (return on investment) compares benefits to costs. Efficiency is time or effort saved per task. Conversion rate is the share of users who complete a desired action such as buying. ARPU is revenue divided by number of users, and CLV is the total revenue expected from a customer over the whole relationship. Accuracy is how often outputs are correct, and cross-domain performance is how well the model works across different tasks or business areas.","example":"After adding AI product descriptions, an online store tracks whether the share of visitors who buy rises from 2% to 3%.","cues":["measure business value","return on investment","revenue per user","long-term customer value"],"confuse":[{"with":"Technical metrics (ROUGE, BLEU, F1)","diff":"Measure model output quality, not business impact."},{"with":"ARPU vs CLV","diff":"ARPU is average revenue per user in a period; CLV is total value over the customer's lifetime."}],"memory":"Business asks 'did it pay?'; engineers ask 'is it correct?'","refs":["Exam guide 2.2.4"],"slice":"s2"},{"id":"s2-scn-recommendations","domain":2,"task":"2.1","objective":"2.1.2","kind":"concept","tags":[],"front":"In a GenAI design, how can embeddings power a recommendation engine for new titles with little viewing history?","answer":"Create embeddings of show descriptions and content, then use vector similarity to recommend the titles closest to what the viewer liked.","explain":"Because embeddings capture meaning, two shows with similar plots, genres or moods have nearby vectors, even if nobody has watched the new one yet. This is the GenAI approach to recommendation engines. Exam rule: if Amazon Personalize (a managed recommendation service) is an option in a personalized-recommendation scenario, choose it. Personalize also uses item metadata to recommend new items.","example":"A new sci-fi thriller is recommended to fans of another sci-fi thriller because their description vectors are close.","cues":["similar items","recommendation engine","little interaction history","personalized recommendations: think Amazon Personalize"],"confuse":[{"with":"Amazon Personalize","diff":"Fully managed recommendation service that trains on your user interactions and item metadata; the usual exam answer for personalized recommendations."}],"memory":"Close vectors, close tastes.","refs":["Exam guide 2.1.2"],"slice":"s2"},{"id":"s2-scn-summarization","domain":2,"task":"2.1","objective":"2.1.2","kind":"scenario","tags":["hot"],"front":"Analysts spend hours reading long quarterly reports and want short summaries of key points. Which GenAI capability fits best?","answer":"Text summarization with a large language model, which condenses long documents into concise key points.","explain":"Summarization is a core LLM use case: the model reads the text in its context window and writes a shorter version. Very long documents may need chunking or a model with a large context window. On the exam, 'condense', 'key points' or 'executive summary' point to an LLM, not to a classic NLP analysis service.","example":"A 60-page report becomes a 5-bullet executive summary.","cues":["condense long documents","key points","executive summary"],"confuse":[{"with":"Amazon Comprehend","diff":"Extracts sentiment, entities and key phrases; it does not write a new summary."},{"with":"Amazon Textract","diff":"Extracts text from scanned documents; it does not summarize."}],"memory":"Long in, short out = LLM summarization.","refs":["Exam guide 2.1.2"],"slice":"s2"},{"id":"s2-scn-semantic-search","domain":2,"task":"2.1","objective":"2.1.2","kind":"scenario","tags":[],"front":"Employees search an internal wiki, but keyword search misses articles that use different words with the same meaning. What GenAI technique should the company use?","answer":"Semantic search using embeddings: convert documents and queries into vectors and return the documents whose vectors are most similar to the query.","explain":"Keyword search matches exact words; semantic search compares meaning. An embedding model turns each document chunk and each query into vectors, and a vector similarity search returns the closest matches. The same technique powers recommendation engines and the retrieval step of RAG (retrieval-augmented generation, where retrieved passages are added to the prompt so the model answers from your data).","example":"A search for 'time off' returns the 'vacation policy' article.","cues":["same meaning, different words","search by meaning","similar items"],"confuse":[{"with":"Keyword search","diff":"Exact-match terms; fails on synonyms."},{"with":"Amazon Comprehend key phrases","diff":"Extracts words from text; indexing them is still keyword matching."}],"memory":"Search by meaning, not by spelling.","refs":["Exam guide 2.1.2"],"slice":"s2"},{"id":"s2-scn-image-generation","domain":2,"task":"2.1","objective":"2.1.2","kind":"scenario","tags":["new2026","hot"],"front":"A marketing team wants to create original product images from text descriptions without a photo shoot. Which type of model should they use?","answer":"An image generation foundation model, such as Amazon Nova Canvas on Amazon Bedrock, which creates new images from text (and image) prompts.","explain":"Text-to-image models are generative: they create pixels that never existed, commonly using diffusion techniques. Amazon Nova Canvas is Amazon's image generation model, and Amazon Nova Reel generates short videos from text and images. Contrast this with vision services that only analyze existing images.","example":"Prompt 'white ceramic mug on a wooden table, soft morning light' produces a new catalog image.","cues":["generate images from text","create new visuals","no photo shoot"],"confuse":[{"with":"Amazon Rekognition","diff":"Analyzes existing images and video (objects, faces, moderation); it does not create images."},{"with":"Amazon Nova Reel","diff":"Generates video, not still images."}],"memory":"Canvas paints pictures, Reel rolls video.","refs":["Exam guide 2.1.2","https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html"],"slice":"s2"},{"id":"s2-scn-video-generation","domain":2,"task":"2.1","objective":"2.1.2","kind":"scenario","tags":["new2026","hot"],"front":"A marketing team wants short promotional video clips created from a text description and a product photo. Which AWS model should they use?","answer":"Amazon Nova Reel on Amazon Bedrock, a video generation model that turns text and image inputs into new video clips.","explain":"Video generation is a GenAI use case: the model creates new moving footage rather than editing or analyzing existing video. Amazon Nova Reel accepts a text prompt and optionally an image, such as a product photo, and generates a short video. The look-alikes are Amazon Nova Canvas, which generates still images, and Amazon Rekognition, which only analyzes video that already exists.","example":"Prompt 'the sneaker rotating slowly on a beach at sunset' plus a product photo produces a short promotional clip.","cues":["generate video from text","promotional clips","text and image to video"],"confuse":[{"with":"Amazon Nova Canvas","diff":"Generates still images, not video."},{"with":"Amazon Rekognition","diff":"Analyzes existing video (labels, faces, moderation); it does not create video."}],"memory":"Reel = movie reel.","refs":["Exam guide 2.1.2","https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html"],"slice":"s2"},{"id":"s2-scn-voice-assistant","domain":2,"task":"2.1","objective":"2.1.2","kind":"scenario","tags":["hot","new2026"],"front":"A company wants a customer service voice agent that listens to callers and talks back naturally in real time, in a single model. Which model type fits best?","answer":"A speech-to-speech foundation model such as Amazon Nova Sonic, which takes speech in and returns speech (with text transcripts) for real-time conversations.","explain":"Audio generation is a GenAI use case. Older designs chain three services: speech-to-text, a text model, then text-to-speech. Amazon Nova Sonic handles conversational speech understanding and generation in one model with streaming for low-latency, multi-turn dialogue.","example":"A caller asks 'Where is my order?' aloud and hears a natural spoken answer within a moment.","cues":["speech-to-speech","real-time voice conversation","customer service voice agent"],"confuse":[{"with":"Amazon Polly","diff":"Text-to-speech only; it does not understand the caller."},{"with":"Amazon Transcribe","diff":"Speech-to-text only; it does not generate a spoken reply."}],"memory":"Sonic = sound in, sound out.","refs":["Exam guide 2.1.2","https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html"],"slice":"s2"},{"id":"s2-scn-code-generation","domain":2,"task":"2.1","objective":"2.1.2","kind":"scenario","tags":["new2026","hot"],"front":"A development team wants an AI assistant in their IDE that turns natural-language feature requests into working code and helps refactor existing code. Which GenAI use case and AWS tool fit?","answer":"Code generation with an FM-powered coding assistant such as Kiro, an AI development environment that turns natural-language requirements into specifications and code.","explain":"Code generation is a core GenAI use case: models trained on large amounts of source code can write, explain, refactor and test code from plain-language instructions. Kiro is an agentic IDE (a code editor with an AI agent built in) and is the AWS development tool in scope for the exam. Kiro uses spec-driven development: it turns a natural-language request into requirements, a design and tasks before writing code, which the developer reviews.","example":"A developer types 'add a password reset endpoint with email confirmation' and gets a plan, code and tests to review.","cues":["generate code from natural language","developer productivity","AI coding assistant","spec-driven development"],"confuse":[{"with":"Amazon Q Developer (formerly CodeWhisperer)","diff":"Earlier AWS coding assistant named in older courses and practice exams; not in the v1.1 in-scope list, which names Kiro."},{"with":"Amazon Comprehend","diff":"Analyzes text meaning (sentiment, entities); it does not write code."}],"memory":"Kiro: say what you want, get the spec, then the code.","refs":["Exam guide 2.1.2"],"slice":"s2"},{"id":"s2-scn-translation","domain":2,"task":"2.1","objective":"2.1.2","kind":"scenario","tags":["hot"],"front":"A company must translate thousands of support articles and product descriptions into 10 languages at high volume and low cost, keeping brand and product names unchanged. Which AWS service fits best?","answer":"Amazon Translate, the purpose-built neural machine translation service, using custom terminology to keep brand and product names consistent.","explain":"Translation is a GenAI-era use case with two AWS routes. Amazon Translate is a managed neural machine translation service built only for translating text at scale; its custom terminology feature makes sure brand and product names are translated (or left unchanged) the way you define. An LLM on Amazon Bedrock can also translate and is the better fit when tone or style must also be adapted, or when translation is combined with summarization or rewriting.","example":"A terminology file tells Amazon Translate to keep 'CloudBoard Pro' unchanged in French, German and Japanese.","cues":["translate at scale","multiple languages","keep brand names unchanged","MOST cost-effective translation"],"confuse":[{"with":"LLM on Amazon Bedrock","diff":"Can translate too; better when tone or style must be adapted or other tasks are combined."},{"with":"Amazon Comprehend","diff":"Detects the language of a text but does not translate it."},{"with":"Amazon Transcribe","diff":"Converts speech to text in the same language; it does not translate."}],"memory":"Translate translates; Comprehend comprehends; Transcribe transcribes.","refs":["Exam guide 2.1.2","https://docs.aws.amazon.com/translate/latest/dg/how-custom-terminology.html"],"slice":"s2"},{"id":"s2-scn-token-cost","domain":2,"task":"2.1","objective":"2.1.4","kind":"scenario","tags":["new2026"],"front":"A company's GenAI chatbot bill is growing. Each request includes the entire conversation history, and answers are several paragraphs long when one would do. What should they change first?","answer":"Reduce tokens: send only relevant or summarized history in the prompt and instruct the model to give concise answers, because on-demand text inference is billed per input and output token.","explain":"Every token in the prompt and every token generated is billed, so bloated prompts and wordy answers directly raise cost. Shorter answers also reduce latency because output is generated token by token. Switching to a smaller model is another lever when quality remains acceptable.","example":"Cutting history from 4,000 to 800 tokens and answers from 400 to 120 tokens sharply lowers the per-request token count.","cues":["reduce inference cost","long conversation history","verbose responses","MOST cost-effective"],"confuse":[{"with":"Buying a larger context window model","diff":"Allows more tokens but does not reduce what you pay for them."},{"with":"Fine-tuning","diff":"Adds training cost; not the first lever for token spend."}],"memory":"Fewer tokens in, fewer tokens out, smaller bill.","refs":["Exam guide 2.1.4","https://aws.amazon.com/bedrock/pricing/"],"slice":"s2"},{"id":"s2-scn-compliance-selection","domain":2,"task":"2.2","objective":"2.2.3","kind":"scenario","tags":[],"front":"A healthcare company in a regulated market must keep data processing in approved AWS Regions and meet industry regulations. How should this affect GenAI model selection?","answer":"Treat compliance as a selection factor: choose only models available in the approved Regions that meet the company's regulatory requirements, even if another model scores slightly higher.","explain":"Compliance covers laws, industry rules and data residency (rules on where data may be stored and processed). An AWS Region is a geographic area, such as Europe (Ireland), where AWS runs data centers, and model availability differs by Region and provider, so a model that cannot run where your data must stay is not an option. Also check how the model is invoked: Amazon Bedrock cross-Region inference can route requests to other Regions, and geographic inference profiles keep processing within a geography such as the US or EU. When a stem states a regulatory constraint, it outranks raw performance.","example":"A model is rejected because it is not offered in the Region required by the company's data residency policy.","cues":["regulated industry","data residency","approved Regions","compliance requirements"],"confuse":[{"with":"Performance-first selection","diff":"Choosing the top benchmark model ignores the stated compliance constraint."}],"memory":"Rules first, then speed and score.","refs":["Exam guide 2.2.3","https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html"],"slice":"s2"},{"id":"s2-scn-business-metric","domain":2,"task":"2.2","objective":"2.2.4","kind":"scenario","tags":[],"front":"An online store adds a GenAI shopping assistant and wants to know whether it makes more visitors complete a purchase. Which metric should they track?","answer":"Conversion rate: the percentage of visitors who complete a desired action, such as a purchase, compared before and after the assistant.","explain":"Pick the business metric that matches the goal in the stem. More purchases per visitor means conversion rate; more revenue per user in a period means ARPU; more total value from each customer over time means CLV; benefit relative to project cost means ROI; time saved per task means efficiency.","example":"Purchases per 100 visitors rise from 2 to 3: conversion rate went from 2% to 3%.","cues":["complete a purchase","sign-ups","percentage of visitors"],"confuse":[{"with":"Customer lifetime value","diff":"Total revenue over the whole customer relationship, not a single visit."},{"with":"ROI","diff":"Compares total gains with the cost of the project."}],"memory":"Visitor to buyer = conversion.","refs":["Exam guide 2.2.4"],"slice":"s2"},{"id":"s2-cmp-prompt-vs-context","domain":2,"task":"2.1","objective":"2.1.5","kind":"compare","tags":["new2026"],"front":"Prompt engineering vs context engineering: how do you tell them apart?","answer":"Prompt engineering improves the wording of the instruction; context engineering manages all information placed in the context window, including retrieved documents, memory, history and tool results.","explain":"Both work at inference time and neither changes model weights. Prompt engineering is about how you ask. Context engineering is about what the model gets to see and in what form, which matters most for long conversations and agents that call tools. If a stem mentions trimming history, choosing which documents or memory to include, or managing a limited window, think context engineering.","example":"Rewriting 'Answer briefly' is prompt engineering; deciding to include only the last 5 messages plus a summary is context engineering.","cues":["wording of instructions","what goes into the context window","memory and tool results"],"confuse":[{"with":"Fine-tuning","diff":"Changes model weights; both of these do not."}],"memory":"Prompt = the question. Context = everything on the desk with the question.","refs":["Exam guide 2.1.5"],"slice":"s2"},{"id":"s2-cmp-token-chunk-embedding","domain":2,"task":"2.1","objective":"2.1.1","kind":"compare","tags":[],"front":"Token vs chunk vs embedding: how do you tell them apart?","answer":"A token is a small unit of text the model reads and bills; a chunk is a passage split from a larger document for retrieval; an embedding is a numeric vector that represents the meaning of a chunk or query.","explain":"They are different sizes and different kinds of thing. Tokens are word pieces used for limits and pricing. Chunks are groups of many tokens, cut from documents so that search can return just the right passage. Embeddings are lists of numbers created from text or images so that similarity can be measured.","example":"A 10-page document becomes 20 chunks, each about 400 tokens, and each chunk gets one embedding vector.","cues":["word pieces","split documents","vector representation"],"confuse":[{"with":"Vector","diff":"An embedding is stored as a vector; 'vector' is the data format, 'embedding' is its meaning-capturing use."}],"memory":"Letters in a word (token), pages of a book (chunk), GPS pin of the page's meaning (embedding).","refs":["Exam guide 2.1.1"],"slice":"s2"},{"id":"s2-cmp-genai-assistant-vs-lex","domain":2,"task":"2.1","objective":"2.1.2","kind":"compare","tags":["hot"],"front":"A company wants a 24/7 chat assistant for customers. When is the answer a GenAI assistant built on an FM in Amazon Bedrock, and when is it Amazon Lex?","answer":"Choose an LLM-powered assistant on Amazon Bedrock for open-ended questions answered with generated natural-language responses; choose Amazon Lex to build conversational interfaces around defined intents and slots for structured flows such as booking or order status.","explain":"AI assistants and customer service agents are core GenAI use cases. An FM-based assistant can understand and answer almost any question in free-form language. Amazon Lex is a service for building text and voice chatbots: you define intents (what the user wants, such as BookAppointment) and slots (the details to collect, such as date and time), and Lex manages the dialog. Lex now also uses LLMs to improve understanding, but the exam cue 'build a conversational interface with intents' still points to Lex.","example":"'Why was my invoice higher this month?' fits a Bedrock assistant; 'Book a haircut for Friday at 3 PM' fits a Lex bot with date and time slots.","cues":["open-ended questions","intents and slots","conversational interface","chatbot for booking or order status"],"confuse":[{"with":"Amazon Polly","diff":"Only converts text to speech; it holds no conversation."},{"with":"Amazon Nova Sonic","diff":"Speech-to-speech FM for real-time voice conversations, not an intent-based bot builder."}],"memory":"Lex = Lists of intents; Bedrock = open-ended talk.","refs":["Exam guide 2.1.2","https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html"],"slice":"s2"},{"id":"s3-ai-agent-definition","domain":2,"task":"2.1","objective":"2.1.6","kind":"concept","tags":["new2026"],"front":"What is an AI agent (agentic AI)?","answer":"An AI agent is a foundation model plus tools, memory and instructions that works toward a goal in a loop: it plans, takes actions, observes the results and decides the next step with limited human input.","explain":"A foundation model (FM) is a large pre-trained model, such as an LLM, that can do many tasks. On its own an FM only returns text; an agent wraps it so it can call tools (APIs, databases, code) and remember context. The loop is often called plan, act, observe (or reason and act). Autonomy is a spectrum: from suggesting actions for a human to approve, to acting fully on its own. The exam contrasts agents (multi-step, take actions) with plain chatbots (answer only).","example":"A travel agent receives 'book me a flight to Lisbon under 500 dollars', searches flights with a tool, checks the user's calendar, books the ticket and sends a confirmation.","cues":["multistep tasks","take actions on behalf of users","autonomously","call APIs to complete"],"confuse":[{"with":"Chatbot","diff":"A chatbot answers questions; an agent plans and takes actions with tools."},{"with":"Fixed workflow","diff":"A workflow follows predefined steps; an agent decides its own next step at run time."}],"memory":"Agent = Brain (FM) + Hands (tools) + Notebook (memory) + Loop (plan, act, observe).","refs":["Exam guide 2.1.6","https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-foundations/introduction.html","https://docs.aws.amazon.com/bedrock/latest/userguide/agents.html"],"slice":"s3"},{"id":"s3-tool-usage","domain":2,"task":"2.1","objective":"2.1.6","kind":"concept","tags":["new2026"],"front":"What is tool usage (function calling) in agentic AI?","answer":"Tool usage (function calling) lets a model choose an external function, API or data source, send structured inputs to it, and use the returned result to continue the task.","explain":"A tool is any function the agent may call, such as 'get_order_status' or a database query. The developer describes each tool (name, purpose, inputs); the model decides when to call which tool, and the application runs it and returns the output to the model. This is how agents get fresh data and perform real actions instead of only generating text. In Amazon Bedrock Agents tools are defined as action groups; in Amazon Bedrock AgentCore they are exposed through Gateway as MCP tools.","example":"A support agent calls a 'lookup_order' tool with order ID 123, receives 'shipped yesterday', then answers the customer.","cues":["function calling","call external APIs","action groups","retrieve real-time data"],"confuse":[{"with":"RAG","diff":"RAG retrieves documents to ground an answer; tool use can also perform actions such as creating a ticket."}],"memory":"The model picks the tool; your code swings the hammer.","refs":["Exam guide 2.1.6","https://docs.aws.amazon.com/bedrock/latest/userguide/agents.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html"],"slice":"s3"},{"id":"s3-agent-memory","domain":2,"task":"2.1","objective":"2.1.6","kind":"concept","tags":["new2026"],"front":"What is memory management for AI agents: short-term vs long-term memory?","answer":"Short-term memory keeps the turn-by-turn context of the current session; long-term memory extracts and stores durable facts, such as user preferences and summaries, that persist across sessions.","explain":"Models are stateless: without memory every request starts from zero. Short-term memory lets the agent understand follow-ups like 'what about tomorrow?' in the same conversation. Long-term memory stores key insights from past sessions so the agent can personalize future interactions. Amazon Bedrock AgentCore Memory is the fully managed AWS service that provides both types, and memory stores can be shared across agents.","example":"A customer said last month they prefer window seats; next time they book, the agent offers a window seat automatically (long-term memory).","cues":["remember across sessions","user preferences","multi-turn conversation","stateless agent"],"confuse":[{"with":"Context window","diff":"The context window is how many tokens the model can see in one request; memory decides what to store and bring back."},{"with":"Knowledge base (RAG)","diff":"A knowledge base holds company documents; memory holds what the agent learned about the user and the conversation."}],"memory":"Short-term = this chat. Long-term = this customer.","refs":["Exam guide 2.1.6","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html"],"slice":"s3"},{"id":"s3-workflow-orchestration","domain":2,"task":"2.1","objective":"2.1.6","kind":"concept","tags":["new2026"],"front":"What is workflow orchestration in agentic AI?","answer":"Workflow orchestration coordinates a multistep process across agents, tools and services: it breaks a goal into tasks, delegates each task, tracks state and intermediate results, and adapts or retries until the process completes.","explain":"An orchestrator (a program or an orchestration agent) is the coordinator that decides which worker agent or tool does each step and in what order. It keeps the execution context, so long-running processes can continue after each step. AWS guidance describes workflow orchestration agents as a centralized coordinator with a predefined structure, which is useful for enterprise process automation. Expect it on the exam as the answer for 'multistep business process that calls several systems in sequence or conditionally'.","example":"An invoice-approval flow: extract invoice data, check the purchase order, route to a manager if over a limit, then post to the ERP system.","cues":["multistep process","coordinate multiple agents","long-running tasks","sequence or conditional steps"],"confuse":[{"with":"Multi-agent collaboration (peer)","diff":"Peers negotiate and share work without a single central coordinator."}],"memory":"Orchestrator = conductor; agents and tools = musicians.","refs":["Exam guide 2.1.6","https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/workflow-orchestration-agents.html"],"slice":"s3"},{"id":"s3-multi-agent-patterns","domain":2,"task":"2.1","objective":"2.1.6","kind":"concept","tags":["new2026"],"front":"What are the main multi-agent system patterns?","answer":"Supervisor (orchestrator-workers): one agent routes subtasks to specialist agents. Hierarchical: supervisors manage sub-supervisors. Sequential pipeline: each agent passes output to the next. Peer or swarm: agents collaborate without a central controller.","explain":"A multi-agent system splits a complex problem among several specialized agents, each with its own role, prompt and tools. The supervisor pattern is built into Amazon Bedrock Agents multi-agent collaboration (now Agents Classic), where a supervisor agent routes questions to collaborator agents; on Amazon Bedrock AgentCore you build it in code, for example with Strands Agents using agents as tools. Peer or swarm patterns let agents debate or hand off work dynamically. Agents communicate through messages, shared memory or a protocol such as Agent2Agent (A2A).","example":"An online mortgage assistant: a supervisor agent routes 'existing mortgage' questions to one collaborator and 'new mortgage application' questions to another.","cues":["specialist sub-agents","supervisor agent","break down complex tasks","collaborator agents"],"confuse":[{"with":"Single agent with many tools","diff":"One agent does everything; multi-agent splits roles to reduce complexity and allow parallel work."}],"memory":"Supervisor = manager with a team; Swarm = team with no manager; Pipeline = assembly line.","refs":["Exam guide 2.1.6","https://docs.aws.amazon.com/bedrock/latest/userguide/agents-multi-agent-collaboration.html","https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/multi-agent-collaboration.html","https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html"],"slice":"s3"},{"id":"s3-mcp","domain":2,"task":"2.1","objective":"2.1.6","kind":"concept","tags":["new2026"],"front":"What is the Model Context Protocol (MCP), and how does it differ from Agent2Agent (A2A)?","answer":"MCP is an open standard that lets AI applications and agents connect to external tools, data sources and prompts through a common client-server interface, instead of writing a custom integration for each system.","explain":"In MCP an MCP host (the AI application, such as an IDE or agent) creates one MCP client per connection to an MCP server. An MCP server is a program that offers context through three primitives: tools (functions the model can run), resources (data such as file contents or records) and prompts (reusable templates). Think of it as 'USB-C for AI': build a server once and any MCP-compatible agent can use it. A2A (Agent2Agent) is a different open protocol for agent-to-agent communication: each agent publishes an agent card describing its skills, and AgentCore Runtime can host A2A servers. Exam rule: agent needs an external system = MCP; agents from different teams or frameworks must collaborate = A2A.","example":"A company publishes an MCP server for its ticketing system; Kiro, a Strands agent and Amazon Quick can all use it without new code. To reserve a hotel, the same travel agent asks a separate hotel agent over A2A.","cues":["standardized protocol","connect agents to external tools and data","reuse across agents","MCP server","agent-to-agent communication"],"confuse":[{"with":"A2A","diff":"MCP connects an agent to tools and data; A2A connects an agent to other agents."},{"with":"Function calling","diff":"Function calling is the model capability; MCP is the standard for how tools are exposed and discovered."},{"with":"Amazon Bedrock AgentCore Gateway","diff":"Gateway is the managed AWS service that turns APIs and Lambda functions into MCP tools; MCP is the protocol itself."}],"memory":"MCP = USB-C port for AI tools (Tools, Resources, Prompts). A2A = Agent to Agent.","refs":["Exam guide 2.1.6","https://modelcontextprotocol.io/docs/learn/architecture","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-a2a.html"],"slice":"s3"},{"id":"s3-agent-business-applications","domain":3,"task":"3.1","objective":"3.1.6","kind":"concept","tags":["new2026"],"front":"What role do AI agents play in business, and what are typical applications?","answer":"AI agents automate multistep, decision-heavy work by reasoning over data and taking actions across systems, for example customer support resolution, IT and HR help desks, claims processing, travel booking, coding assistance and data analysis.","explain":"The business value is delegation: an agent completes a whole task (not just answers a question), reducing manual effort and cognitive load. Good candidates are processes that need judgment, several tools and some flexibility. Poor candidates are simple deterministic rules (use code) or single narrow tasks (use a specific AI service like Amazon Translate). Many agent designs keep a human in the loop for high-risk actions.","example":"An insurance agent collects missing claim details from the customer, checks the policy via API, and files the claim.","cues":["automate end-to-end tasks","process insurance claims","take actions across systems","reduce manual effort"],"confuse":[{"with":"Traditional AI service","diff":"Amazon Comprehend or Textract performs one narrow task; an agent chains many steps and actions."}],"memory":"If it needs to DO several things, think agent; if it only needs to SAY something, think chatbot or FM.","refs":["Exam guide 3.1.6","https://docs.aws.amazon.com/bedrock/latest/userguide/agents.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html","https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-foundations/introduction.html"],"slice":"s3"},{"id":"s3-bedrock-platform","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":["hot"],"front":"What is Amazon Bedrock?","answer":"Amazon Bedrock is a fully managed, serverless service that provides access to high-performing foundation models from Amazon and leading AI companies through a single API, to build and scale generative AI applications without managing infrastructure.","explain":"Serverless means you do not provision or manage servers; you pay for what you use. Bedrock offers 100+ models from providers such as Amazon (Nova), Anthropic, Meta, Mistral, DeepSeek and OpenAI. Around the models it adds features: Knowledge Bases (RAG), Guardrails (safety), model customization, evaluations and agent building. On the exam, Bedrock is the default answer for 'use FMs via API with the LEAST operational overhead'.","example":"A startup calls Amazon Nova and Anthropic Claude through the same Bedrock API and switches models without changing infrastructure.","cues":["access multiple foundation models","single API","LEAST operational overhead","serverless generative AI"],"confuse":[{"with":"Amazon SageMaker AI","diff":"SageMaker AI is for building, training and hosting your own ML models with more control and more effort."},{"with":"SageMaker JumpStart","diff":"JumpStart deploys pretrained models onto SageMaker AI endpoints that you manage."}],"memory":"Bedrock = the model buffet: many FMs, one API, no servers.","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html","https://aws.amazon.com/bedrock/faqs/"],"slice":"s3"},{"id":"s3-bedrock-agents","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":[],"front":"What is Amazon Bedrock Agents?","answer":"Amazon Bedrock Agents is a managed capability to build agents that break user requests into steps, call company APIs through action groups, and query knowledge bases, without provisioning infrastructure or writing orchestration code.","explain":"An action group defines the actions (APIs or Lambda functions) the agent can call; a knowledge base supplies company documents for RAG. Bedrock handles the prompt engineering, orchestration, memory, encryption and permissions. It also supports multi-agent collaboration with a supervisor agent. Note: since July 30, 2026 AWS calls it Amazon Bedrock Agents Classic (maintenance mode, closed to new customers) and recommends Amazon Bedrock AgentCore, whose managed harness is a config-based equivalent; exam questions may still use the classic name.","example":"An agent that processes insurance claims: it asks the user for missing fields, calls a claims API (action group) and checks policy documents (knowledge base).","cues":["action groups","knowledge bases","no infrastructure to manage","call APIs to fulfill requests"],"confuse":[{"with":"Amazon Bedrock AgentCore","diff":"AgentCore is a framework-agnostic platform to run and govern any agent at scale; Bedrock Agents is a console-configured agent inside Bedrock."}],"memory":"Agents = Actions (action groups) + Answers (knowledge bases).","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/bedrock/latest/userguide/agents.html","https://docs.aws.amazon.com/bedrock/latest/userguide/agents-multi-agent-collaboration.html","https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html"],"slice":"s3"},{"id":"s3-agentcore-overview","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":["new2026"],"front":"What is Amazon Bedrock AgentCore and what are its main components?","answer":"Amazon Bedrock AgentCore is an agentic platform to build, deploy and operate AI agents securely at scale with any framework and any model, using modular services such as Runtime, Memory, Gateway, Identity, Policy, Observability, Code Interpreter, Browser and Evaluations.","explain":"Runtime is serverless hosting for agents with session isolation. Memory gives short-term and long-term memory. Gateway turns APIs and Lambda functions into MCP tools. Identity manages agent authentication and credentials. Policy enforces deterministic rules on tool calls. Observability traces and monitors agents (OpenTelemetry, CloudWatch). Code Interpreter is a sandbox to run code; Browser is a managed cloud browser for web tasks. Evaluations measures agent quality. Harness is a managed agent loop: you declare the model, system prompt and tools, and AgentCore runs orchestration, memory and tool calls; AWS recommends it for customers moving off Bedrock Agents Classic. The overview also lists Registry (catalog of agents and tools), Payments and Optimization. Components work together or independently with frameworks like Strands Agents, LangGraph or CrewAI.","example":"A team builds an agent in LangGraph, hosts it on AgentCore Runtime, gives it AgentCore Memory, and monitors it with AgentCore Observability.","cues":["any framework, any model","deploy agents at scale","production agents securely","without managing infrastructure"],"confuse":[{"with":"Strands Agents","diff":"Strands is an open-source SDK to write the agent code; AgentCore runs and governs it in production."},{"with":"Amazon Bedrock Agents","diff":"Bedrock Agents (now Classic, closed to new customers) is a console-configured agent inside Bedrock; AgentCore runs config-based (Harness) or code-defined agents from any framework."}],"memory":"Run it, Remember it, Reach tools (Gateway), know Who it is (Identity), set Rules (Policy), Watch it (Observability).","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html"],"slice":"s3"},{"id":"s3-agentcore-runtime","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":["new2026"],"front":"What is Amazon Bedrock AgentCore Runtime?","answer":"AgentCore Runtime is a secure, serverless hosting environment to deploy and scale AI agents and tools built with any framework and any model, with isolated sessions and support for the MCP and A2A protocols.","explain":"Hosting means running your agent code in the cloud so users can call it. Runtime works with frameworks such as Strands Agents, LangGraph and CrewAI, or custom code, and with models in or outside Amazon Bedrock. Each user session runs in its own microVM (a small, isolated virtual machine), so one user's data cannot leak into another session. It offers fast cold starts for real-time use and extended run times for asynchronous, long-running agents.","example":"A team writes an agent with Strands Agents on a laptop and deploys it to AgentCore Runtime so thousands of users can use it with isolated sessions.","cues":["deploy agents from any framework","serverless agent hosting","session isolation","long-running asynchronous agents"],"confuse":[{"with":"AWS Lambda","diff":"Lambda runs general short functions; AgentCore Runtime is purpose-built for agents with session isolation and long-running agent sessions."},{"with":"AgentCore Harness","diff":"Harness is a config-only agent loop (no agent code); Runtime hosts the agent code you wrote."}],"memory":"Runtime = the agent's home in the cloud, one private room per user.","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html"],"slice":"s3"},{"id":"s3-agentcore-identity","domain":5,"task":"5.1","objective":"5.1.1","kind":"concept","tags":["new2026"],"front":"What is Amazon Bedrock AgentCore Identity?","answer":"AgentCore Identity is an identity and credential management service for AI agents: it authenticates who can invoke an agent and securely manages the credentials agents use to access AWS resources and third-party services on behalf of users.","explain":"Agents often need to call tools like Salesforce, Slack or GitHub as a specific user. Instead of hard-coding API keys, AgentCore Identity gives each agent a workload identity (an identity for software, not a person), handles inbound authentication (who may call the agent) and outbound credentials such as OAuth tokens (what the agent may reach). It works with existing identity providers such as Amazon Cognito, Okta, Microsoft Entra ID and Auth0, and keeps audit trails.","example":"An agent reads a user's Google Calendar only after the user consents through OAuth; AgentCore Identity stores and supplies the token.","cues":["act on behalf of users","OAuth tokens for third-party tools","existing identity provider","no hard-coded credentials"],"confuse":[{"with":"AWS IAM","diff":"IAM controls access to AWS resources for users and roles; AgentCore Identity manages agent identities and third-party credentials for agents."},{"with":"Policy in AgentCore","diff":"Identity answers WHO the agent and user are; Policy decides WHAT tool calls are allowed."}],"memory":"Identity = the agent's badge and keychain.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html"],"slice":"s3"},{"id":"s3-agentcore-policy","domain":5,"task":"5.1","objective":"5.1.1","kind":"concept","tags":["new2026"],"front":"What is Policy in Amazon Bedrock AgentCore?","answer":"Policy in AgentCore enforces deterministic, fine-grained rules on what tools an agent may call and under what conditions, by intercepting every tool call through AgentCore Gateway and evaluating it against policies before execution.","explain":"Agents are flexible, so they can misread business rules or act outside their authority. Policy moves security controls outside the agent code: rules are written in Cedar (AWS's open-source authorization language) or in plain natural language that is converted to policies and checked with automated reasoning. Because enforcement happens at the gateway boundary, a manipulated prompt cannot bypass it. Rules can use user identity and tool input values.","example":"Rule: the refund tool may be called only when the amount is 500 dollars or less; larger refunds are blocked even if the agent tries.","cues":["deterministic control","limit which tools an agent can call","business rules outside agent code","prevent policy bypass"],"confuse":[{"with":"Amazon Bedrock Guardrails","diff":"Guardrails filter harmful or unwanted content in prompts and responses; Policy authorizes agent tool actions."},{"with":"IAM policies","diff":"IAM policies govern AWS API access by principals; Policy in AgentCore governs agent tool calls through Gateway with tool input conditions."}],"memory":"Guardrails police WORDS; Policy polices ACTIONS.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html"],"slice":"s3"},{"id":"s3-strands-agents","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":["new2026"],"front":"What is Strands Agents?","answer":"Strands Agents is an open-source SDK from AWS, for Python and TypeScript, for building AI agents in code with a model-driven agent loop, simple tool definitions and MCP support, working with Amazon Bedrock and other model providers.","explain":"An SDK (software development kit) is a code library. With Strands a developer writes a few lines: pick a model, give a prompt, add tools (any function marked as a tool, or MCP servers), and the SDK runs the reason-and-act loop. It supports multi-agent systems and deploys well to Amazon Bedrock AgentCore Runtime; the AgentCore managed harness is itself powered by Strands. On the exam, choose Strands when developers want an open-source, code-first framework to build agents.","example":"A developer turns a Python function search_docs into a tool with a decorator and creates an agent that answers from the documentation.","cues":["open-source SDK","code-first agent framework","build agents in a few lines of code","Python or TypeScript"],"confuse":[{"with":"Amazon Bedrock AgentCore","diff":"AgentCore is the managed platform to run agents; Strands is the library to write them."},{"with":"Kiro","diff":"Kiro is an IDE that helps you write software; Strands is a library your software uses to be an agent."}],"memory":"Strands = the strings you tie together to make an agent (code library).","refs":["Exam guide 2.3.1","https://strandsagents.com/","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html"],"slice":"s3"},{"id":"s3-kiro","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":["new2026","hot"],"front":"What is Kiro?","answer":"Kiro is an AWS agentic AI development environment (IDE, CLI and web) that helps developers go from prototype to production using spec-driven development: it turns a prompt into requirements, a design and a task list, then implements the tasks.","explain":"An IDE is the editor where developers write code. Kiro's specs are structured files: requirements.md (user stories and acceptance criteria), design.md (architecture) and tasks.md (trackable implementation tasks). It also offers steering files (project rules), hooks (automations triggered by events) and MCP support. AWS recommends Kiro in place of the Amazon Q Developer IDE plugins, whose support ends April 30, 2027.","example":"A developer asks for 'add login with MFA'; Kiro writes requirements, a design and tasks, then codes and tracks each task.","cues":["spec-driven development","agentic IDE","requirements, design and tasks","prototype to production"],"confuse":[{"with":"Amazon Q Developer","diff":"Q Developer is the older AWS coding assistant; AWS recommends Kiro in place of the Q Developer IDE plugins, whose support ends April 30, 2027."},{"with":"Strands Agents","diff":"Strands is an SDK to build agents; Kiro is a tool developers use to build any software."}],"memory":"Kiro: specs first, code second.","refs":["Exam guide 2.3.1","https://kiro.dev/docs/","https://kiro.dev/docs/specs/","https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/what-is.html"],"slice":"s3"},{"id":"s3-quick","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":["new2026"],"front":"What is Amazon Quick?","answer":"Amazon Quick is a fully managed, AI-powered assistant for business users that answers questions grounded in company data, builds dashboards, automates tasks with AI agents and flows, conducts research and builds apps from natural language, with no ML expertise required.","explain":"Quick evolved from Amazon QuickSight, which continues as Quick Sight (dashboards and business intelligence) inside Quick. Other features: Quick Flows and Quick Automate (automations), Quick Index (connects company documents so answers are grounded), Quick Research (cited research reports) and Apps. It connects to company tools through connectors and open standards such as MCP. It is the AWS recommendation for customers who used Amazon Q Business.","example":"A sales manager asks 'Why did Q3 revenue drop in Brazil?' and Quick answers from company data, builds a chart and drafts a follow-up email.","cues":["business users, no ML expertise","answers grounded in company data","dashboards and automation","evolved from QuickSight"],"confuse":[{"with":"Kiro","diff":"Kiro is for software developers writing code; Quick is for business users working with data."},{"with":"Amazon Q Business","diff":"Q Business is closed to new customers; AWS recommends Quick instead."}],"memory":"Quick = QuickSight grew up and got agents.","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/quick/latest/userguide/what-is.html","https://aws.amazon.com/quick/","https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html"],"slice":"s3"},{"id":"s3-transform","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":["new2026"],"front":"What is AWS Transform?","answer":"AWS Transform is an agentic AI service that accelerates migration and modernization: specialized AI agents migrate VMware and other workloads, modernize mainframe, Windows and .NET applications, and continuously remediate technical debt.","explain":"Technical debt is outdated code, frameworks or dependencies that make systems costly to maintain. AWS Transform uses expert agents built on AWS migration experience to automate assessment, planning, code transformation and cutover. The product page also describes a model-to-model migration assessment that finds dependencies on other AI providers and plans a move to Amazon Bedrock. On the exam, pick Transform for 'modernize legacy code or migrate workloads with agentic AI'.","example":"A bank uses AWS Transform to analyze a COBOL mainframe portfolio and generate a modernization plan and code.","cues":["modernize legacy applications","mainframe or .NET modernization","migrate VMware workloads","reduce technical debt"],"confuse":[{"with":"Kiro","diff":"Kiro helps build new software; Transform modernizes and migrates existing legacy estates."}],"memory":"Transform = time machine that brings old code into the present.","refs":["Exam guide 2.3.1","https://aws.amazon.com/transform/"],"slice":"s3"},{"id":"s3-nova-family","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":["new2026"],"front":"What is the Amazon Nova family of models and when do you pick each one?","answer":"Amazon Nova is Amazon's own family of foundation models on Amazon Bedrock: Micro (text only, lowest latency and cost), Lite (low-cost multimodal), Pro (balanced accuracy, speed, cost), Premier (most capable), Canvas (images), Reel (video) and Sonic (speech-to-speech).","explain":"Multimodal means the model accepts several input types such as text, images, video and documents. Understanding models (Micro, Lite, Pro, Premier) output text. Creative models generate images (Canvas) or video (Reel). Nova 2 adds Nova 2 Lite with extended thinking (step-by-step reasoning), Nova 2 Sonic and Nova Multimodal Embeddings (vectors for text, image, video and audio search). Nova Act is a separate service for agents that automate browser UI workflows. You use the Nova models through the Amazon Bedrock API (Nova Act is its own service, and Nova models can also be customized in SageMaker AI).","example":"Cheap, fast text classification of tickets: Nova Micro. Marketing image: Nova Canvas. Product video: Nova Reel.","cues":["Amazon's own foundation models","lowest latency text-only","generate images","generate video"],"confuse":[{"with":"Amazon Titan","diff":"Titan is Amazon's earlier model family (Titan text generation is older; Titan Text Embeddings is still used for RAG); Nova is the current FM family."},{"with":"Amazon Polly","diff":"Polly only converts text to speech; Nova Sonic understands speech and replies with speech."}],"memory":"Size ladder: Micro, Lite, Pro, Premier. Canvas paints, Reel films, Sonic talks.","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html","https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html","https://docs.aws.amazon.com/nova/latest/nova2-userguide/whats-new.html","https://aws.amazon.com/nova/act/"],"slice":"s3"},{"id":"s3-nova-sonic","domain":2,"task":"2.3","objective":"2.3.1","kind":"concept","tags":["new2026","hot"],"front":"What is Amazon Nova Sonic?","answer":"Amazon Nova Sonic is a speech-to-speech foundation model that understands spoken input and replies with natural speech (plus text transcripts) in real time through a bidirectional streaming API, for voice assistants and customer service.","explain":"Speech-to-speech means one model hears audio and answers with audio, instead of chaining three services (Transcribe for speech-to-text, an LLM, Polly for text-to-speech). Streaming keeps latency low for natural, multi-turn conversations, and it can call tools. Nova 2 Sonic supports more languages, including Portuguese and Hindi, and can switch languages within a session. Exam cue: 'real-time voice conversation' or 'speech-to-speech' points to Nova Sonic.","example":"A call center voice bot that talks with customers naturally and looks up their order through a tool.","cues":["speech-to-speech","real-time voice conversations","low-latency voice assistant","bidirectional streaming"],"confuse":[{"with":"Amazon Transcribe","diff":"Transcribe only converts speech to text."},{"with":"Amazon Polly","diff":"Polly only converts text to speech."},{"with":"Amazon Lex","diff":"Lex builds intent-based chatbots; Nova Sonic is a generative FM for open conversation."}],"memory":"Sonic = sound in, sound out.","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html","https://docs.aws.amazon.com/nova/latest/nova2-userguide/using-conversational-speech.html"],"slice":"s3"},{"id":"s3-genai-advantages","domain":2,"task":"2.3","objective":"2.3.2","kind":"concept","tags":[],"front":"What are the advantages of using AWS generative AI services to build applications?","answer":"Managed AWS GenAI services lower the barrier to entry and speed time to market: pre-trained models via API, no infrastructure to manage, pay-as-you-go pricing, and built-in features that help meet business objectives faster and more cost-effectively.","explain":"Accessibility: developers without ML expertise can use FMs through an API or a no-code tool such as Amazon Quick. Efficiency: AWS handles scaling, patching and hosting. Cost-effectiveness: on-demand pricing with no upfront commitment, and you avoid training models from scratch. Speed to market: prototype in days by combining Bedrock models, Knowledge Bases, Guardrails and agents. Exam answers often use the words 'LEAST operational overhead' or 'fastest time to market'.","example":"A retailer launches a product-description generator in two weeks with Amazon Bedrock instead of training its own model for months.","cues":["lower barrier to entry","speed to market","no ML expertise","pay only for what you use"],"confuse":[{"with":"Training from scratch","diff":"Building your own FM needs huge data, compute and expertise; managed services avoid that."}],"memory":"A-L-E-C-S: Accessible, Lower barrier, Efficient, Cost-effective, Speed.","refs":["Exam guide 2.3.2","https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html","https://docs.aws.amazon.com/quick/latest/userguide/what-is.html"],"slice":"s3"},{"id":"s3-aws-infra-benefits","domain":2,"task":"2.3","objective":"2.3.3","kind":"concept","tags":[],"front":"What are the benefits of AWS infrastructure for generative AI applications (security, compliance, responsibility, safety)?","answer":"With Amazon Bedrock your content is not used to improve the base models and is not shared with model providers; data is encrypted, access is controlled with IAM, and AWS compliance programs and the shared responsibility model apply.","explain":"Security: encryption in transit (TLS) and at rest (AWS KMS), IAM permissions, private connectivity (AWS PrivateLink), logging with AWS CloudTrail. Compliance: AWS services inherit certifications you can review in AWS Artifact. Responsibility: under the shared responsibility model AWS secures the infrastructure and you secure your data, access and configuration. Safety: features such as Amazon Bedrock Guardrails and automated abuse detection support responsible AI.","example":"A hospital uses Bedrock knowing its prompts are not used to train the provider's model and are encrypted with its own KMS key.","cues":["data not used to train base models","not shared with model providers","shared responsibility model","compliance requirements"],"confuse":[{"with":"Public consumer chatbot","diff":"Consumer tools may use inputs for training; Bedrock does not use your content to improve base models."}],"memory":"Your data stays yours: not used for training, not shared, encrypted.","refs":["Exam guide 2.3.3","https://aws.amazon.com/bedrock/faqs/","https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html"],"slice":"s3"},{"id":"s3-sc-agent-vs-chatbot","domain":3,"task":"3.1","objective":"3.1.6","kind":"scenario","tags":["new2026"],"front":"An airline wants its assistant to not only answer baggage questions but also rebook a missed flight, apply a voucher and email the new itinerary. What kind of AI solution fits?","answer":"An AI agent, because the task needs multistep reasoning and actions across booking, voucher and email systems, not only generated answers.","explain":"A chatbot or plain FM can answer questions but cannot change systems. An agent plans the steps, calls tools (rebooking API, voucher API, email API) and checks each result. On AWS you would build it with Amazon Bedrock AgentCore (or the classic Amazon Bedrock Agents). The exam signal is a verb list such as book, update, submit, send.","example":"","cues":["complete tasks on behalf of customers","call multiple systems","take actions","multistep"],"confuse":[{"with":"Amazon Lex chatbot","diff":"Lex handles intent-based conversations; it does not reason and plan across many tools on its own."}],"memory":"Verbs (book, send, update) mean agent.","refs":["Exam guide 3.1.6","https://docs.aws.amazon.com/bedrock/latest/userguide/agents.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html"],"slice":"s3"},{"id":"s3-sc-agentcore-memory","domain":2,"task":"2.1","objective":"2.1.6","kind":"scenario","tags":["new2026"],"front":"A company runs an AI agent on AgentCore Runtime. Customers complain that the agent forgets their preferences between conversations. Which solution fixes this with the LEAST development effort?","answer":"Amazon Bedrock AgentCore Memory with long-term memory, which extracts and stores user preferences and facts across sessions.","explain":"Agents are stateless by default. AgentCore Memory is fully managed and offers short-term memory (inside one session) and long-term memory (across sessions, including preferences and summaries). Building your own store in a database would work but needs more effort.","example":"The agent remembers that a user is vegetarian and suggests vegetarian restaurants next week.","cues":["forgets between sessions","remember user preferences","personalized","fully managed memory"],"confuse":[{"with":"Increase the context window","diff":"A bigger context window does not persist anything after the session ends."}],"memory":"Forgetful agent across sessions = long-term memory.","refs":["Exam guide 2.1.6","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html"],"slice":"s3"},{"id":"s3-sc-agentcore-gateway","domain":2,"task":"2.3","objective":"2.3.1","kind":"scenario","tags":["new2026"],"front":"A company has dozens of internal REST APIs and AWS Lambda functions. It wants AI agents built in different frameworks to use them as tools without rewriting each integration. Which AWS service should it use?","answer":"Amazon Bedrock AgentCore Gateway, which converts APIs, Lambda functions and services into MCP-compatible tools that any agent can use through one secure endpoint.","explain":"AgentCore Gateway is a managed entry point for agent traffic. It turns OpenAPI, Smithy and Lambda targets into MCP tools, connects existing MCP servers, and handles inbound and outbound authentication. Policy in AgentCore also attaches to Gateway to control each tool call. It can also front other agents (including A2A traffic) and route model inference requests, and it offers 1-click integrations with tools such as Salesforce, Slack, Jira and Zendesk.","example":"","cues":["turn APIs into tools","MCP-compatible tools","Lambda functions as tools","single endpoint for agents"],"confuse":[{"with":"Amazon API Gateway","diff":"API Gateway publishes APIs for apps; AgentCore Gateway exposes tools to AI agents via MCP."}],"memory":"Gateway = the door where tools become MCP.","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html"],"slice":"s3"},{"id":"s3-sc-agentcore-browser","domain":2,"task":"2.3","objective":"2.3.1","kind":"scenario","tags":["new2026"],"front":"An AI agent must log in to partner web portals that have no API, fill in forms and extract order information, in a secure and isolated environment. Which AgentCore capability should the team use?","answer":"Amazon Bedrock AgentCore Browser, a fully managed, isolated cloud browser that lets agents navigate websites, fill forms and extract information.","explain":"Some systems only have a web user interface, so the agent needs a real browser instead of an API. AgentCore Browser runs isolated browser sessions with live viewing, session replay and CloudTrail logging, and works with automation frameworks such as Playwright. Its sibling, AgentCore Code Interpreter, is a sandbox where the agent writes and runs code (Python, JavaScript, TypeScript), for example to analyze an uploaded CSV file. Rule: web pages = Browser; run code = Code Interpreter; call an API = Gateway.","example":"Contrast: an agent that must calculate statistics on a CSV file with Python uses AgentCore Code Interpreter, not Browser.","cues":["no API, only a website","fill web forms","navigate websites","isolated browser session"],"confuse":[{"with":"AgentCore Code Interpreter","diff":"Code Interpreter runs code the agent writes in a sandbox; Browser interacts with web pages."},{"with":"AgentCore Gateway","diff":"Gateway needs an API or Lambda function to expose as a tool; Browser works through the website itself."},{"with":"Amazon Nova Act","diff":"Nova Act is a separate service for browser-automation agents; AgentCore Browser is the browser tool inside AgentCore."}],"memory":"Web page? Browser. Run code? Code Interpreter. API? Gateway.","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/browser-tool.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-tool.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html"],"slice":"s3"},{"id":"s3-sc-agentcore-observability","domain":2,"task":"2.3","objective":"2.3.1","kind":"scenario","tags":["new2026"],"front":"A team runs an AI agent in production and must trace each step and tool call, inspect intermediate outputs and find latency bottlenecks, using OpenTelemetry-compatible data and Amazon CloudWatch dashboards. Which AgentCore capability meets this need?","answer":"Amazon Bedrock AgentCore Observability, which traces, debugs and monitors each step of an agent's workflow with CloudWatch dashboards and OpenTelemetry-compatible telemetry.","explain":"Observability means seeing what a running system is doing. AgentCore Observability shows the agent's execution path step by step and reports metrics such as session count, latency, token usage and error rates. OpenTelemetry (OTEL) is an open standard format for traces and metrics, so the data can also go to other monitoring tools. Agent
