sk":"3.3","objective":"3.3.3","tags":["hot"],"format":"single","stem":"An AI company wants its chat model to refuse harmful requests and give answers that people rate as more helpful. Human annotators will rank several candidate responses to each prompt. Which training technique uses these rankings to align the model with human preferences?","options":[{"text":"Reinforcement learning from human feedback (RLHF)","correct":true,"why":"RLHF turns human preference rankings into a reward that trains the model toward preferred responses."},{"text":"Retrieval Augmented Generation with a knowledge base","correct":false,"why":"RAG adds factual context at query time and does not learn from preference rankings."},{"text":"Continued pre-training on support transcripts","correct":false,"why":"Continued pre-training adds domain knowledge from unlabeled text, not alignment with human preferences."},{"text":"An Amazon Bedrock human-based evaluation job","correct":false,"why":"A human evaluation job measures response quality but does not retrain the model."}],"pick":1,"sequence":[],"pairs":[],"explain":"Humans ranking responses to align model behavior with preferences is RLHF.","refs":["Exam guide 3.3.3"],"slice":"s5"},{"id":"s5-q-rouge","domain":3,"task":"3.4","objective":"3.4.2","tags":["hot"],"format":"single","stem":"A media company uses an FM to generate short summaries of news articles. Editors have written reference summaries for a test set. The company wants an automatic metric that measures how much of the reference summaries' content appears in the generated summaries. Which metric should it use?","options":[{"text":"ROUGE","correct":true,"why":"ROUGE is recall-oriented n-gram overlap with reference text and is the standard summarization metric."},{"text":"BLEU","correct":false,"why":"BLEU is a precision-oriented overlap metric designed for machine translation."},{"text":"Perplexity","correct":false,"why":"Perplexity measures how well a model predicts text and does not compare against reference summaries."},{"text":"F1 score","correct":false,"why":"F1 balances precision and recall for classification-style answers and is not the standard summarization metric."}],"pick":1,"sequence":[],"pairs":[],"explain":"Summarization plus recall of reference content means ROUGE.","refs":["Exam guide 3.4.2"],"slice":"s5"},{"id":"s5-q-human-evaluation","domain":3,"task":"3.4","objective":"3.4.1","tags":["hot","new2026"],"format":"single","stem":"A financial services company is choosing between two FMs in Amazon Bedrock to draft client letters. The letters must reflect the company's compliance wording and tone, which only its compliance officers can judge. The company wants a managed way to collect their ratings. Which solution meets these requirements?","options":[{"text":"Create an Amazon Bedrock model evaluation job that uses human workers from the compliance team.","correct":true,"why":"Human-based evaluation jobs let your own experts rate and compare model responses on subjective criteria."},{"text":"Create an automatic model evaluation job that uses a built-in benchmark dataset.","correct":false,"why":"Built-in datasets measure generic accuracy, robustness or toxicity, not company-specific compliance tone."},{"text":"Compute BLEU scores for both models against a set of sample letters.","correct":false,"why":"BLEU counts word overlap and cannot judge compliance tone."},{"text":"Use Amazon SageMaker Model Monitor to compare both models.","correct":false,"why":"Model Monitor detects drift on deployed endpoints; it does not collect expert ratings to compare FMs."}],"pick":1,"sequence":[],"pairs":[],"explain":"Subjective, expert-only criteria call for human-based evaluation, which Amazon Bedrock supports as a managed job type.","refs":["Exam guide 3.4.1","https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html","https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-type-human.html"],"slice":"s5"},{"id":"s5-q-rag-evaluation","domain":3,"task":"3.4","objective":"3.4.4","tags":["hot","new2026"],"format":"single","stem":"A company built a customer-support assistant with Amazon Bedrock Knowledge Bases. Auditors found that some answers include details that are not in the retrieved documents. The company wants to measure this problem systematically on a test set of questions before each release. Which approach should it use?","options":[{"text":"Run an Amazon Bedrock retrieve-and-generate RAG evaluation and track faithfulness.","correct":true,"why":"Faithfulness measures how well responses avoid hallucination relative to the retrieved text."},{"text":"Run an Amazon Bedrock retrieve-only RAG evaluation and track context coverage.","correct":false,"why":"Retrieve-only jobs score the retrieved passages, not whether generated answers add unsupported details."},{"text":"Measure the BLEU score of the answers against the source documents.","correct":false,"why":"BLEU measures n-gram precision for translation and does not reliably detect unsupported claims."},{"text":"Track the assistant's average cost per interaction after each release.","correct":false,"why":"Cost per interaction is a business metric, not a measure of groundedness."}],"pick":1,"sequence":[],"pairs":[],"explain":"Answers that go beyond the retrieved documents are a faithfulness (groundedness) problem, measured by a retrieve-and-generate RAG evaluation.","refs":["Exam guide 3.4.4","https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html","https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html"],"slice":"s5"},{"id":"s5-q-rag-retrieve-only","domain":3,"task":"3.4","objective":"3.4.4","tags":["hot","new2026"],"format":"single","stem":"An HR assistant built on Amazon Bedrock Knowledge Bases often pulls the wrong policy passages. Before changing its retrieval settings, the team wants to measure only how well the knowledge base finds passages that fit each question, without judging generated answers. Which approach should it use?","options":[{"text":"Run an Amazon Bedrock retrieve-only RAG evaluation and track context relevance.","correct":true,"why":"Retrieve-only jobs score the retrieved passages, and context relevance measures how well they fit each question."},{"text":"Run an Amazon Bedrock retrieve-and-generate RAG evaluation and track faithfulness.","correct":false,"why":"Faithfulness judges generated answers against the retrieved text, not whether retrieval found the right passages."},{"text":"Measure the BLEU score of the generated answers against the policy documents.","correct":false,"why":"BLEU scores generated text overlap for translation and says nothing about retrieval quality."},{"text":"Track the assistant's task completion rate in production.","correct":false,"why":"Task completion rate is a business outcome and cannot isolate retrieval quality."}],"pick":1,"sequence":[],"pairs":[],"explain":"To test retrieval alone, use a retrieve-only RAG evaluation; context relevance needs no ground truth, while context coverage requires ground-truth texts.","refs":["Exam guide 3.4.4","https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html"],"slice":"s5"},{"id":"s5-q-agentcore-evaluations","domain":3,"task":"3.4","objective":"3.4.4","tags":["new2026"],"format":"single","stem":"A company built a customer-service agent with Strands Agents and deployed it with Amazon Bedrock AgentCore. The company needs automated, ongoing scoring of the agent's production traces for helpfulness and correct tool use. The solution must have the LEAST operational overhead. Which solution meets these requirements?","options":[{"text":"Use Amazon Bedrock AgentCore Evaluations with built-in evaluators in online evaluation.","correct":true,"why":"AgentCore Evaluations scores agent traces with LLM-judge evaluators, including continuously on production traffic."},{"text":"Run Amazon Bedrock Model Evaluation jobs with a built-in benchmark dataset.","correct":false,"why":"Model Evaluation scores model responses to static prompt datasets, not live agent traces or tool calls."},{"text":"Use Amazon SageMaker Model Monitor on the agent's endpoint.","correct":false,"why":"Model Monitor detects data and quality drift for SageMaker AI endpoints, not agent tool use."},{"text":"Build Amazon CloudWatch dashboards for agent latency and error rates.","correct":false,"why":"Latency and error rates are operational metrics; they do not score helpfulness or tool-use quality."}],"pick":1,"sequence":[],"pairs":[],"explain":"Quality scoring of agent traces on AWS points to Amazon Bedrock AgentCore Evaluations; CloudWatch-based observability covers only operational metrics.","refs":["Exam guide 3.4.4","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluations.html","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability.html"],"slice":"s5"},{"id":"s5-q-business-metrics","domain":3,"task":"3.4","objective":"3.4.5","tags":["new2026"],"format":"multi","stem":"A telecom company launched an FM-powered support assistant. Leadership wants to know whether the assistant meets its business objectives: resolving customer issues without human agents and reducing support costs. Which metrics should the company track? (Select TWO.)","options":[{"text":"Task completion rate","correct":true,"why":"It shows the share of customer issues the assistant fully resolves without a human agent."},{"text":"Cost per interaction","correct":true,"why":"It shows whether each AI-handled contact is cheaper than the previous process."},{"text":"ROUGE score of responses","correct":false,"why":"ROUGE measures overlap with reference summaries, not business outcomes."},{"text":"Perplexity of the model","correct":false,"why":"Perplexity is a technical fluency measure unrelated to cost or resolution."},{"text":"Number of model parameters","correct":false,"why":"Model size is a technical property, not a business outcome."}],"pick":2,"sequence":[],"pairs":[],"explain":"Business alignment is measured with outcome metrics such as task completion rate, user satisfaction and cost per interaction, not text-quality metrics.","refs":["Exam guide 3.4.5"],"slice":"s5"},{"id":"s5-q-fm-lifecycle-order","domain":3,"task":"3.3","objective":"3.3.1","tags":[],"format":"order","stem":"A company plans to build a specialized legal assistant on top of a foundation model. Put the stages of the FM lifecycle in the correct order, starting with the base model.","options":[],"pick":0,"sequence":["Start from a base FM pre-trained on massive unlabeled general data","Continue pre-training on unlabeled legal documents","Fine-tune on labeled legal prompt-response pairs","Evaluate with benchmarks, metrics and human reviewers","Deploy and monitor with user feedback and business metrics"],"pairs":[],"explain":"General knowledge first, then domain knowledge, then task behavior, then evaluation before and after deployment.","refs":["Exam guide 3.3.1"],"slice":"s5"},{"id":"s5-q-metrics-match","domain":3,"task":"3.4","objective":"3.4.2","tags":["hot","new2026"],"format":"match","stem":"Match each evaluation metric or method to what it is best used for.","options":[],"pick":0,"sequence":[],"pairs":[{"left":"BLEU","right":"Machine translation quality using n-gram precision"},{"left":"ROUGE","right":"Summarization quality using recall of reference n-grams"},{"left":"BERTScore","right":"Semantic similarity to a reference, tolerant of paraphrases"},{"left":"LLM-as-a-judge","right":"Scalable, explained scoring of qualities such as helpfulness"},{"left":"Perplexity","right":"How well a model predicts text, where lower is better"}],"explain":"Translation means BLEU, summaries mean ROUGE, meaning means BERTScore, nuanced scoring at scale means LLM-as-a-judge, and fluency means perplexity.","refs":["Exam guide 3.4.2","https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html"],"slice":"s5"},{"id":"s6-q-denied-topics","domain":4,"task":"4.1","objective":"4.1.2","tags":["hot"],"format":"single","stem":"A healthcare provider is launching an appointment-scheduling assistant on Amazon Bedrock. Compliance requires that the assistant never provides medical diagnoses, however users phrase the request. The company wants a managed solution with the LEAST development effort. Which solution meets these requirements?","options":[{"text":"Configure an Amazon Bedrock Guardrails denied topic for medical diagnosis.","correct":true,"why":"Denied topics block a user-defined subject by meaning in both prompts and responses."},{"text":"Configure an Amazon Bedrock Guardrails word filter listing medical terms.","correct":false,"why":"Word filters only match exact words, so rephrased requests would get through."},{"text":"Enable the Amazon Bedrock Guardrails content filter for Misconduct.","correct":false,"why":"A medical diagnosis is not a predefined harmful category, so content filters would not reliably block it."},{"text":"Enable the Amazon Bedrock Guardrails Prompt Attack content filter.","correct":false,"why":"The Prompt Attack filter detects jailbreaks and prompt injection, not ordinary questions about a forbidden subject."}],"pick":1,"sequence":[],"pairs":[],"explain":"A business-specific forbidden subject that users can phrase many ways is a denied topic in Amazon Bedrock Guardrails.","refs":["Exam guide 4.1.2","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html"],"slice":"s6"},{"id":"s6-q-clarify-pretraining","domain":4,"task":"4.1","objective":"4.1.7","tags":["hot"],"format":"single","stem":"A hospital is preparing patient data to train a readmission-risk model on Amazon SageMaker AI. Regulators require the hospital to show, before training, whether the data is imbalanced across ethnicity and age groups, and later to explain which features drove each prediction. Which AWS capability meets these requirements?","options":[{"text":"Amazon SageMaker Clarify","correct":true,"why":"Clarify detects pre-training and post-training bias and provides SHAP-based feature attributions."},{"text":"Amazon SageMaker Model Monitor","correct":false,"why":"Model Monitor watches deployed models over time; it does not analyze data before training."},{"text":"Amazon SageMaker Ground Truth","correct":false,"why":"Ground Truth creates labels for training data; it does not measure bias or explain predictions."},{"text":"Amazon Bedrock Guardrails","correct":false,"why":"Guardrails filters generative AI inputs and outputs; it does not analyze tabular training data."}],"pick":1,"sequence":[],"pairs":[],"explain":"Bias in data plus explaining predictions points to Amazon SageMaker Clarify.","refs":["Exam guide 4.1.7","https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-configure-processing-jobs.html"],"slice":"s6"},{"id":"s6-q-overfitting","domain":4,"task":"4.1","objective":"4.1.6","tags":["hot"],"format":"single","stem":"A data science team trained a model that reaches 98 percent accuracy on its training data but only 65 percent on a held-out test set collected at the same time. The errors are concentrated in customer groups that were rare in the training set. Which statement BEST describes the situation?","options":[{"text":"The model is overfitting and the training data lacks diversity.","correct":true,"why":"High training accuracy with low test accuracy is overfitting, and errors in rare groups indicate unrepresentative data."},{"text":"The model's errors come from incorrect labels in the test set.","correct":false,"why":"Nothing points to label problems; the errors follow how rarely each group appears in the training data."},{"text":"The model is affected by data drift after deployment.","correct":false,"why":"The test set comes from the same period, so the gap is not caused by data changing over time."},{"text":"The model has high bias because it is too simple for the data.","correct":false,"why":"High bias shows low accuracy on the training data too, but training accuracy here is 98 percent."}],"pick":1,"sequence":[],"pairs":[],"explain":"Good on training data but bad on new data is overfitting; errors clustered in rare groups point to unbalanced, non-diverse data.","refs":["Exam guide 4.1.6"],"slice":"s6"},{"id":"s6-q-sustainability","domain":4,"task":"4.1","objective":"4.1.3","tags":[],"format":"single","stem":"A company needs to add sentiment classification for customer product reviews. Leadership has asked the team to choose the approach that MOST reduces the environmental impact of the solution while still meeting accuracy needs. Which approach should the team choose?","options":[{"text":"Use a right-sized pre-trained model and run inference on AWS Inferentia.","correct":true,"why":"Reusing a pre-trained model avoids training energy, and Inferentia is built for efficient inference."},{"text":"Train a new custom model from scratch on AWS Trainium instances.","correct":false,"why":"Trainium is efficient, but training from scratch still uses far more energy than reusing a pre-trained model."},{"text":"Use the largest foundation model in Amazon Bedrock with prompt engineering.","correct":false,"why":"It avoids training, but an oversized model uses more energy per request than the task needs."},{"text":"Fine-tune a large foundation model on GPU instances for each product category.","correct":false,"why":"Repeated fine-tuning of a large model adds training compute the task does not need."}],"pick":1,"sequence":[],"pairs":[],"explain":"Sustainable model selection means reuse, right-size and run on efficient hardware; efficient chips do not make unnecessary training sustainable.","refs":["Exam guide 4.1.3"],"slice":"s6"},{"id":"s6-q-responsible-dimension","domain":4,"task":"4.1","objective":"4.1.1","tags":[],"format":"single","stem":"A company's customer-service chatbot confidently tells customers that products carry a five-year warranty, although the actual warranty is one year. The answers are polite and contain no offensive content, and all customers receive the same answer. Which responsible AI dimension is MOST directly violated?","options":[{"text":"Veracity and robustness","correct":true,"why":"The chatbot states false facts as true, which is a veracity failure (a hallucination)."},{"text":"Safety","correct":false,"why":"Safety concerns harmful or toxic output, and the answers contain no offensive content."},{"text":"Fairness","correct":false,"why":"Fairness concerns unequal treatment of groups, but all customers receive the same answer."},{"text":"Privacy and security","correct":false,"why":"Privacy and security concerns protecting data and models, and no personal data was exposed."}],"pick":1,"sequence":[],"pairs":[],"explain":"Confident but false output is a veracity problem; toxic output is safety; unequal treatment of groups is fairness.","refs":["Exam guide 4.1.1","https://aws.amazon.com/ai/responsible-ai/"],"slice":"s6"},{"id":"s6-q-human-centered-design","domain":4,"task":"4.2","objective":"4.2.4","tags":["new2026"],"format":"single","stem":"An insurance company uses an ML model to recommend claim decisions to customers through a mobile app. Customers complain that they do not understand the decisions and have no way to report mistakes. The company wants to apply human-centered design principles for explainable AI. What should the company do?","options":[{"text":"Show key decision factors in the app and let customers flag errors for review.","correct":true,"why":"This gives end users AI decision transparency, a user-feedback mechanism and human oversight."},{"text":"Create Amazon SageMaker Model Cards and share them with the internal audit team.","correct":false,"why":"Model Cards document the model for auditors; customers still get no explanation and no way to report errors."},{"text":"Retrain the model on more balanced data to reduce incorrect decisions.","correct":false,"why":"Better data may reduce errors, but customers still cannot understand decisions or give feedback."},{"text":"Send every claim to a human adjuster and stop using the model.","correct":false,"why":"This removes the AI instead of designing it around users, and it does not scale."}],"pick":1,"sequence":[],"pairs":[],"explain":"Human-centered explainable AI means clear explanations for users, feedback mechanisms and a path to human review.","refs":["Exam guide 4.2.4"],"slice":"s6"},{"id":"s6-q-interpretability-tradeoff","domain":4,"task":"4.2","objective":"4.2.3","tags":[],"format":"single","stem":"A lender must give every rejected applicant a clear explanation of how the decision was made, and auditors must be able to trace the model's logic directly. A deep neural network scored slightly higher accuracy than a decision tree in testing. Which choice BEST meets the requirements?","options":[{"text":"Use the decision tree, because its decision logic can be inspected directly.","correct":true,"why":"A transparent model lets auditors follow the exact rules, and this is worth a small loss of accuracy."},{"text":"Use the neural network and add SHAP explanations with SageMaker Clarify.","correct":false,"why":"SHAP gives after-the-fact approximations of feature influence, not model logic that auditors can trace directly."},{"text":"Use the neural network and document it in SageMaker Model Cards.","correct":false,"why":"Documentation records intended use and metrics, but it does not make the black-box logic traceable."},{"text":"Use a foundation model to write a plain-language reason for each decision.","correct":false,"why":"Generated explanations may sound plausible but may not reflect how the decision was actually made."}],"pick":1,"sequence":[],"pairs":[],"explain":"Interpretability versus performance: when the stem demands directly traceable logic, choose the transparent model and accept slightly lower accuracy.","refs":["Exam guide 4.2.3","Exam guide 4.2.1"],"slice":"s6"},{"id":"s6-q-dataset-characteristics","domain":4,"task":"4.1","objective":"4.1.5","tags":["hot"],"format":"multi","stem":"A company is building a voice assistant and found that it performs poorly for users with certain regional accents. The company wants to improve fairness by changing its training data, not the model architecture. Which TWO actions should the company take? (Select TWO.)","options":[{"text":"Add recordings from speakers of the under-represented accents.","correct":true,"why":"More diverse, inclusive data teaches the model about the groups it currently fails."},{"text":"Balance the dataset so each accent group has comparable representation.","correct":true,"why":"A balanced dataset prevents the majority group from dominating what the model learns."},{"text":"Remove low-quality recordings, most of which come from the under-represented accents.","correct":false,"why":"Cleaning that removes mostly minority data makes the imbalance worse."},{"text":"Double the dataset size by adding more recordings from the current speakers.","correct":false,"why":"More data with the same imbalance does not improve coverage of the missing accents."},{"text":"Delete the accent metadata so the model cannot learn accent differences.","correct":false,"why":"Hiding the attribute does not give the model examples of those accents, so performance stays poor."}],"pick":2,"sequence":[],"pairs":[],"explain":"Responsible datasets are inclusive, diverse, balanced and curated; more of the same data does not fix under-representation.","refs":["Exam guide 4.1.5"],"slice":"s6"},{"id":"s6-q-legal-risks","domain":4,"task":"4.1","objective":"4.1.4","tags":["hot"],"format":"multi","stem":"A retail company plans to use a generative AI model to automatically write product descriptions and marketing images that are published without review. The legal team asks which risks are specifically legal or trust risks of this plan. Which TWO risks should the team identify? (Select TWO.)","options":[{"text":"Generated images may infringe on copyrighted works.","correct":true,"why":"Outputs can reproduce protected material, leading to intellectual property infringement claims."},{"text":"Hallucinated product claims may mislead customers.","correct":true,"why":"False statements can harm end users, create liability and cause loss of customer trust."},{"text":"Outputs may vary in wording between runs for the same product.","correct":false,"why":"Non-deterministic wording is a consistency issue, not a legal or trust risk."},{"text":"Token-based pricing may make costs harder to forecast.","correct":false,"why":"Cost predictability is a business concern, not a legal risk."},{"text":"Response latency may increase during peak shopping periods.","correct":false,"why":"Latency is a performance concern, not a legal risk."}],"pick":2,"sequence":[],"pairs":[],"explain":"GenAI legal risks include IP infringement, biased outputs, hallucinations, end-user harm and loss of customer trust.","refs":["Exam guide 4.1.4"],"slice":"s6"},{"id":"s6-q-match-concern-tool","domain":4,"task":"4.1","objective":"4.1.7","tags":["hot","legacy"],"format":"match","stem":"A company is building a responsible AI program on AWS. Match each responsible AI concern to the AWS tool that addresses it.","options":[],"pick":0,"sequence":[],"pairs":[{"left":"Block toxic content and mask PII in chatbot responses","right":"Amazon Bedrock Guardrails"},{"left":"Detect bias in training data and explain individual predictions","right":"Amazon SageMaker Clarify"},{"left":"Alert when a deployed model's predictions drift toward bias","right":"Amazon SageMaker Model Monitor"},{"left":"Document a model's intended use and risk rating for auditors","right":"Amazon SageMaker Model Cards"},{"left":"Send low-confidence predictions to human reviewers","right":"Amazon Augmented AI (Amazon A2I)"}],"explain":"Guardrails blocks, Clarify explains, Model Monitor watches over time, Model Cards document, A2I asks a human.","refs":["Exam guide 4.1.7","Exam guide 4.2.2","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html","https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-configure-processing-jobs.html","https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor.html","https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html","https://docs.aws.amazon.com/sagemaker/latest/dg/a2i-use-augmented-ai-a2i-human-review-loops.html"],"slice":"s6"},{"id":"s7-q-kms-customer-keys","domain":5,"task":"5.1","objective":"5.1.1","tags":["hot"],"format":"single","stem":"A bank stores training data and fine-tuned model artifacts for an Amazon Bedrock workload in Amazon S3. Its security policy requires that the bank controls the encryption keys, including key rotation and the ability to disable a key, and that every use of a key is auditable. Which solution meets these requirements?","options":[{"text":"Encrypt the data with AWS KMS customer managed keys","correct":true,"why":"Customer managed KMS keys give the bank control over key policy, rotation and disabling, and key usage is logged in CloudTrail."},{"text":"Store the encryption keys in AWS Secrets Manager","correct":false,"why":"Secrets Manager stores application secrets such as API keys; it is not the service that encrypts S3 data with managed keys."},{"text":"Enable Amazon Macie on the S3 buckets","correct":false,"why":"Macie discovers sensitive data but does not encrypt it or manage keys."},{"text":"Create an AWS PrivateLink endpoint for Amazon S3","correct":false,"why":"PrivateLink keeps traffic off the public internet but does not provide encryption at rest or key control."}],"pick":1,"sequence":[],"pairs":[],"explain":"Encryption at rest with customer control of keys points to AWS KMS customer managed keys.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/data-encryption.html"],"slice":"s7"},{"id":"s7-q-privatelink","domain":5,"task":"5.1","objective":"5.1.1","tags":[],"format":"single","stem":"A healthcare company runs an application in private subnets of a VPC that calls Amazon Bedrock. A security requirement states that traffic between the application and Amazon Bedrock must not traverse the public internet. Which solution meets this requirement?","options":[{"text":"Create an interface VPC endpoint for Amazon Bedrock with AWS PrivateLink","correct":true,"why":"An interface endpoint powered by PrivateLink gives the VPC a private connection to Bedrock that stays on the AWS network."},{"text":"Route the traffic through a NAT gateway in a public subnet","correct":false,"why":"A NAT gateway sends traffic out through an internet gateway to the public Bedrock endpoint, so it still uses the internet path."},{"text":"Put an Amazon CloudFront distribution in front of the Bedrock API","correct":false,"why":"CloudFront is a content delivery network for caching content near users, not private connectivity from a VPC to AWS services."},{"text":"Encrypt the requests with an AWS KMS customer managed key","correct":false,"why":"KMS encrypts data but does not change the network path the traffic takes."}],"pick":1,"sequence":[],"pairs":[],"explain":"Keep traffic off the public internet between a VPC and an AWS service: AWS PrivateLink interface VPC endpoint.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/usingVPC.html"],"slice":"s7"},{"id":"s7-q-invocation-logging","domain":5,"task":"5.1","objective":"5.1.4","tags":["new2026"],"format":"single","stem":"A financial services company runs a customer-facing assistant on Amazon Bedrock. Regulators require the company to retain the complete text of every user prompt and every model response for later review. Which solution meets this requirement?","options":[{"text":"Enable Amazon Bedrock model invocation logging to Amazon S3","correct":true,"why":"Invocation logging captures full request and response data and delivers it to S3 or CloudWatch Logs as a managed feature."},{"text":"Create an AWS CloudTrail trail for Amazon Bedrock API calls","correct":false,"why":"CloudTrail records who called the API and when, not the full prompt and response content."},{"text":"Configure an Amazon Bedrock Guardrails content filter","correct":false,"why":"Guardrails block or mask content in real time; they are not a record of all conversations."},{"text":"Enable AWS Config rules for the Bedrock account","correct":false,"why":"Config evaluates resource configurations, not conversation content."}],"pick":1,"sequence":[],"pairs":[],"explain":"Need the actual prompts and responses for audit: Bedrock model invocation logging; CloudTrail only records API activity.","refs":["Exam guide 5.1.4","https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html"],"slice":"s7"},{"id":"s7-q-macie-pii","domain":5,"task":"5.1","objective":"5.1.1","tags":[],"format":"single","stem":"A retailer plans to load several years of customer support transcripts stored in Amazon S3 into an Amazon Bedrock knowledge base. Before loading, the security team must identify which objects contain personally identifiable information across all buckets, with the LEAST manual effort. Which AWS service should the team use?","options":[{"text":"Amazon Macie","correct":true,"why":"Macie automatically discovers and classifies sensitive data such as PII across S3 buckets."},{"text":"Amazon Inspector","correct":false,"why":"Inspector scans workloads for software vulnerabilities, not for PII in S3 objects."},{"text":"AWS Artifact","correct":false,"why":"Artifact provides AWS compliance reports, not data discovery."},{"text":"AWS Trusted Advisor","correct":false,"why":"Trusted Advisor gives account best-practice checks and does not inspect object contents for PII."}],"pick":1,"sequence":[],"pairs":[],"explain":"Sensitive data or PII sitting in S3 is a Macie question.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html"],"slice":"s7"},{"id":"s7-q-model-cards","domain":5,"task":"5.1","objective":"5.1.2","tags":[],"format":"single","stem":"A healthcare company's governance board requires each machine learning model to have standardized documentation that records its intended use, training data sources, evaluation results and known limitations, so auditors can review it. Which AWS feature meets this requirement?","options":[{"text":"Amazon SageMaker Model Cards","correct":true,"why":"Model Cards provide a single place to document intended use, training details, evaluation results and risk for governance and audits."},{"text":"Amazon SageMaker Model Monitor","correct":false,"why":"Model Monitor watches deployed models for data and quality drift; it does not create governance documentation."},{"text":"Amazon SageMaker Clarify","correct":false,"why":"Clarify measures bias and explains predictions; its results can be recorded in a model card but it is not the documentation tool."},{"text":"AWS CloudTrail","correct":false,"why":"CloudTrail records API activity, not descriptive model documentation."}],"pick":1,"sequence":[],"pairs":[],"explain":"Documenting what a model is, what data it used and how it should be used: SageMaker Model Cards.","refs":["Exam guide 5.1.2"],"slice":"s7"},{"id":"s7-q-data-residency","domain":5,"task":"5.2","objective":"5.2.2","tags":[],"format":"single","stem":"A German public-sector agency is building a generative AI application on AWS. A national law requires that all citizen data used by the application is stored and processed only within Germany. Which action BEST meets this requirement?","options":[{"text":"Deploy the application, data stores and model inference in an AWS Region in Germany, such as Europe (Frankfurt)","correct":true,"why":"Choosing a Region inside Germany and keeping inference in that Region, without cross-Region routing, controls where data is stored and processed."},{"text":"Encrypt all citizen data with AWS KMS customer managed keys","correct":false,"why":"Encryption protects confidentiality but does not control where the data is located."},{"text":"Serve the application through Amazon CloudFront edge locations","correct":false,"why":"CloudFront caches content at edge locations worldwide, which does not restrict data to one country."},{"text":"Enable S3 cross-Region replication to a backup Region","correct":false,"why":"Replicating to another Region could move data outside the country, violating residency."}],"pick":1,"sequence":[],"pairs":[],"explain":"Data residency is achieved by selecting the AWS Region and keeping processing there; encryption and caching do not keep data in a jurisdiction.","refs":["Exam guide 5.2.2","https://docs.aws.amazon.com/bedrock/latest/userguide/abuse-detection.html"],"slice":"s7"},{"id":"s7-q-grounding-check","domain":5,"task":"5.1","objective":"5.1.5","tags":["hot","new2026"],"format":"single","stem":"A company built a question answering application that uses Retrieval Augmented Generation (RAG) with Amazon Bedrock Knowledge Bases. Some responses include statements that are not supported by the retrieved documents. The company wants to automatically detect and block these responses without retraining the model. Which solution meets these requirements?","options":[{"text":"Configure a contextual grounding check in Amazon Bedrock Guardrails","correct":true,"why":"The contextual grounding check scores each response against the retrieved source and blocks ungrounded or irrelevant answers below the threshold."},{"text":"Decrease the temperature inference parameter of the model","correct":false,"why":"Lower temperature reduces randomness but does not detect or block responses that are unsupported by the retrieved documents."},{"text":"Enable Amazon SageMaker Model Monitor on the model","correct":false,"why":"Model Monitor detects drift in models deployed on Amazon SageMaker AI; it does not check each answer against retrieved sources."},{"text":"Enable Amazon Bedrock model invocation logging","correct":false,"why":"Logging records responses for later review but does not detect or block them."}],"pick":1,"sequence":[],"pairs":[],"explain":"Detecting and blocking answers that are not supported by the source text is the Guardrails contextual grounding check.","refs":["Exam guide 5.1.5","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html"],"slice":"s7"},{"id":"s7-q-scoping-matrix","domain":5,"task":"5.2","objective":"5.2.3","tags":[],"format":"single","stem":"A company builds an internal assistant that sends employee questions, together with passages retrieved from company documents, to an Anthropic Claude model through Amazon Bedrock APIs. The company does not fine-tune or train the model. According to the Generative AI Security Scoping Matrix, which scope applies?","options":[{"text":"Scope 3: Pre-trained models","correct":true,"why":"Building your own application on an existing foundation model through an API, including with RAG, is Scope 3."},{"text":"Scope 2: Enterprise app","correct":false,"why":"Scope 2 is using a third-party enterprise application with generative AI features built in, not building your own app."},{"text":"Scope 4: Fine-tuned models","correct":false,"why":"Scope 4 requires fine-tuning the model with your data, which the company does not do."},{"text":"Scope 5: Self-trained models","correct":false,"why":"Scope 5 means training a model from scratch."}],"pick":1,"sequence":[],"pairs":[],"explain":"Own app + existing FM via API (with or without RAG) = Scope 3; fine-tuning moves it to Scope 4.","refs":["Exam guide 5.2.3","https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/"],"slice":"s7"},{"id":"s7-q-shared-responsibility","domain":5,"task":"5.1","objective":"5.1.1","tags":[],"format":"multi","stem":"A company uses Amazon Bedrock to power a customer-facing chatbot. The security team is documenting which tasks the company itself is responsible for under the AWS shared responsibility model. Which tasks are the company's responsibility? (Select TWO.)","options":[{"text":"Defining IAM policies that control who can invoke the models","correct":true,"why":"Access management is security in the cloud and always remains the customer's job."},{"text":"Configuring Amazon Bedrock Guardrails for the chatbot's content policies","correct":true,"why":"Choosing and configuring content policies is the customer's responsibility even on a managed service."},{"text":"Patching the servers that host the foundation models","correct":false,"why":"AWS manages and patches the underlying infrastructure of Amazon Bedrock."},{"text":"Securing the physical data centers that run Amazon Bedrock","correct":false,"why":"Physical security is part of security of the cloud, owned by AWS."},{"text":"Scaling the inference capacity behind on-demand model invocations","correct":false,"why":"AWS operates and scales the managed inference infrastructure for on-demand Amazon Bedrock."}],"pick":2,"sequence":[],"pairs":[],"explain":"Even on fully managed Bedrock, the customer owns data, access (IAM) and Guardrails configuration; AWS owns infrastructure.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html"],"slice":"s7"},{"id":"s7-q-privacy-techniques","domain":5,"task":"5.1","objective":"5.1.3","tags":[],"format":"multi","stem":"A company wants to share a customer dataset with its data science team to train a churn prediction model. The data scientists must NOT be able to see who the individual customers are or view their full contact and payment details. Which techniques should the company apply to the dataset before sharing it? (Select TWO.)","options":[{"text":"Anonymize the data by removing names, emails and other identifying fields","correct":true,"why":"Removing identifying fields prevents individuals from being identified while keeping useful features."},{"text":"Mask sensitive fields such as phone and card numbers","correct":true,"why":"Masking hides the real values so data scientists cannot see them."},{"text":"Encrypt the dataset with AWS KMS customer managed keys","correct":false,"why":"Encryption protects data from people without the key, but the data scientists who are granted access would still see real customer identities."},{"text":"Enable AWS CloudTrail data events for the bucket","correct":false,"why":"CloudTrail records who accessed the data but does not hide identities."},{"text":"Enable S3 Versioning on the dataset bucket","correct":false,"why":"Versioning protects against overwrites and deletions, not identity exposure."}],"pick":2,"sequence":[],"pairs":[],"explain":"Privacy-enhancing techniques such as anonymization and masking hide identities from authorized users; encryption, logging and versioning do not.","refs":["Exam guide 5.1.3"],"slice":"s7"},{"id":"s7-q-governance-services-match","domain":5,"task":"5.2","objective":"5.2.1","tags":[],"format":"match","stem":"A company is building a governance and compliance program for its AI workloads on AWS. Match each AWS service to the requirement it addresses.","options":[],"pick":0,"sequence":[],"pairs":[{"left":"AWS Config","right":"Continuously evaluate resource configurations against compliance rules"},{"left":"AWS CloudTrail","right":"Record which identity made each API call and when"},{"left":"Amazon Inspector","right":"Scan EC2, container images and Lambda functions for software vulnerabilities"},{"left":"AWS Artifact","right":"Download AWS SOC and ISO compliance reports"},{"left":"AWS Trusted Advisor","right":"Get automated best-practice checks for cost, security and performance"}],"explain":"Know each governance service by its single job: Config = configuration compliance, CloudTrail = API audit, Inspector = vulnerabilities, Artifact = AWS compliance reports, Trusted Advisor = best-practice checks.","refs":["Exam guide 5.2.1"],"slice":"s7"},{"id":"fill-q-match-ai-services-business-needs","domain":1,"task":"1.2","objective":"1.2.4","tags":["hot","legacy","new2026"],"format":"match","stem":"A company has five business needs and wants a managed AWS service for each. Match each need to the AWS service that meets it.","options":[],"pick":0,"sequence":[],"pairs":[{"left":"Detect sentiment and find PII in thousands of customer emails","right":"Amazon Comprehend"},{"left":"Give employees an intelligent enterprise search index over manuals, wikis and SharePoint that returns ranked relevant documents and passages","right":"Amazon Kendra"},{"left":"Pull key-value pairs and tables out of scanned loan application forms","right":"Amazon Textract"},{"left":"Flag unsafe content in user-uploaded product photos","right":"Amazon Rekognition"},{"left":"Let sales managers build revenue dashboards and ask natural-language questions about the data","right":"Amazon Quick"}],"explain":"Comprehend understands text, Kendra finds ranked passages, Textract reads scanned documents, Rekognition analyzes images, and Quick answers business users' questions over dashboards and company data. Kendra has been closed to new customers since July 2026, so newer questions may point to Amazon Bedrock Knowledge Bases for the same need, but the exam can still name Kendra.","refs":["Exam guide 1.2.4","https://docs.aws.amazon.com/kendra/latest/dg/what-is-kendra.html","https://docs.aws.amazon.com/quick/latest/userguide/what-is.html"],"slice":"fill"},{"id":"fill-q-match-pipeline-stage-services","domain":1,"task":"1.3","objective":"1.3.4","tags":["hot","new2026"],"format":"match","stem":"A company is planning AI work across several teams. Match each need to the AWS service or feature that fits it best.","options":[],"pick":0,"sequence":[],"pairs":[{"left":"Label 200,000 raw images with a human workforce to build a training set","right":"Amazon SageMaker Ground Truth"},{"left":"Visually clean and transform tabular data before training","right":"Amazon SageMaker Data Wrangler"},{"left":"Call a foundation model through a serverless API","right":"Amazon Bedrock"},{"left":"Business users ask natural-language questions of company data and dashboards","right":"Amazon Quick"},{"left":"Developers turn a feature request into specs, a design and code","right":"Kiro"}],"explain":"Ground Truth labels data, Data Wrangler prepares it, Bedrock serves foundation models by API, Quick serves business users, and Kiro helps developers build software from specs. AWS Glue DataBrew is also a visual data preparation tool, but it is a general analytics service; Data Wrangler is the data prep feature inside SageMaker AI (now in SageMaker Canvas) for ML workflows.","refs":["Exam guide 1.3.4","https://docs.aws.amazon.com/sagemaker/latest/dg/sms.html","https://docs.aws.amazon.com/quick/latest/userguide/what-is.html","https://kiro.dev/docs/"],"slice":"fill"},{"id":"fill-q-order-mlops-retraining-loop","domain":1,"task":"1.3","objective":"1.3.5","tags":["hot"],"format":"order","stem":"A company runs a demand forecasting model on Amazon SageMaker AI and wants an automated MLOps loop that keeps the model accurate as customer behavior changes. Put the steps in the correct order, starting with the first deployment.","options":[],"pick":0,"sequence":["Deploy the first approved model version to a SageMaker AI endpoint","SageMaker Model Monitor compares live input data with the training baseline and detects drift","A SageMaker Pipelines run retrains the model on fresh data","The new model version is registered in SageMaker Model Registry and approved","The newly approved version replaces the old one on the endpoint"],"pairs":[],"explain":"Deploy, monitor, retrain, register and approve, redeploy: drift detection triggers a repeatable retraining pipeline, and the registry controls which version reaches production.","refs":["Exam guide 1.3.5","https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor.html"],"slice":"fill"},{"id":"fill-q-jumpstart-open-source-model","domain":1,"task":"1.3","objective":"1.3.2","tags":[],"format":"single","stem":"A data science team wants to start from an open-source pre-trained foundation model, fine-tune it on its own data, and deploy it to endpoints in its own AWS account with full control over the instance types that host the endpoint. The team wants minimal setup. Which solution meets these requirements?","options":[{"text":"Amazon SageMaker JumpStart","correct":true,"why":"JumpStart offers pre-trained open-source models that you can fine-tune and deploy with a few clicks to SageMaker AI endpoints on instances you choose."},{"text":"An Amazon Bedrock base model invoked on demand","correct":false,"why":"Bedrock on-demand inference is serverless, so the team cannot choose or control the instances that host the model."},{"text":"Train a new model from scratch on Amazon SageMaker AI","correct":false,"why":"Training from scratch ignores the pre-trained starting point and needs far more data, time and setup."},{"text":"Amazon Comprehend custom classification","correct":false,"why":"Comprehend custom classification trains a text classifier, not an open-source foundation model you host yourself."}],"pick":1,"sequence":[],"pairs":[],"explain":"A hub of pre-trained models plus fine-tuning plus deployment on your own SageMaker AI instances with little setup means SageMaker JumpStart.","refs":["Exam guide 1.3.2","https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html"],"slice":"fill"},{"id":"fill-q-sagemaker-ai-custom-model","domain":1,"task":"1.2","objective":"1.2.5","tags":["hot"],"format":"single","stem":"A company with experienced ML engineers must build a custom model that uses its own algorithm on proprietary tabular data. The engineers need to control the training instances and hyperparameters and host the model on their own endpoint. Which AWS service meets these requirements?","options":[{"text":"Amazon SageMaker AI","correct":true,"why":"SageMaker AI is the managed service to build, train and deploy your own ML models with control over algorithms, instances, hyperparameters and endpoints."},{"text":"Amazon Bedrock","correct":false,"why":"Bedrock provides API access to existing foundation models; it does not train your own algorithm on tabular data."},{"text":"Amazon Quick","correct":false,"why":"Quick is an AI assistant and BI service for business users, not a platform for training models."},{"text":"Amazon Personalize","correct":false,"why":"Personalize is a managed recommendation service with built-in recipes, not a way to run your own algorithm with full control."}],"pick":1,"sequence":[],"pairs":[],"explain":"Own algorithm, control over training and your own endpoint means Amazon SageMaker AI; Bedrock is for using existing foundation models with the least effort.","refs":["Exam guide 1.2.5"],"slice":"fill"},{"id":"fill-q-match-sagemaker-inference-options","domain":1,"task":"1.1","objective":"1.1.3","tags":["new2026"],"format":"match","stem":"A company runs several ML models on Amazon SageMaker AI. Match each workload to the inference option that fits it best.","options":[],"pick":0,"sequence":[],"pairs":[{"left":"A millisecond fraud score for each card payment, with steady traffic all day","right":"Real-time inference"},{"left":"An internal tool called a few times per day with long idle periods and no instances to manage","right":"Serverless Inference"},{"left":"500 MB video files that take 20 minutes each to process, with a notification when done","right":"Asynchronous Inference"},{"left":"Scoring an entire 20-million-row table every night","right":"Batch Transform"}],"explain":"Steady low-latency traffic is real-time, intermittent traffic without servers is serverless, large or slow requests are asynchronous, and whole datasets offline are batch.","refs":["Exam guide 1.1.3","https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model.html"],"slice":"fill"},{"id":"fill-q-match-ai-ml-genai-agentic","domain":1,"task":"1.1","objective":"1.1.2","tags":["new2026"],"format":"match","stem":"A manager new to AI is confused by the terminology in a vendor proposal. Match each term to its description.","options":[],"pick":0,"sequence":[],"pairs":[{"left":"Artificial intelligence (AI)","right":"The broad field of machines performing tasks that normally need human intelligence"},{"left":"Machine learning (ML)","right":"Systems that learn patterns from data instead of following explicitly programmed rules"},{"left":"Deep learning","right":"Machine learning that uses neural networks with many layers"},{"left":"Generative AI","right":"Models that create new content such as text, images or code"},{"left":"Agentic AI","right":"Systems that plan and take multi-step actions with tools toward a goal"}],"explain":"The terms nest: ML is a subset of AI, deep learning is a subset of ML, generative AI is built on deep learning, and agentic AI uses generative models to plan and act.","refs":["Exam guide 1.1.2"],"slice":"fill"},{"id":"fill-q-match-data-types","domain":1,"task":"1.1","objective":"1.1.4","tags":[],"format":"match","stem":"A data team is cataloging datasets for upcoming ML projects. Match each data type to the example that best represents it.","options":[],"pick":0,"sequence":[],"pairs":[{"left":"Labeled data","right":"Past transactions each tagged as fraud or not fraud"},{"left":"Unlabeled data","right":"Raw website clickstream events with no target value"},{"left":"Time-series data","right":"Hourly temperature readings from one sensor over two years"},{"left":"Structured tabular data","right":"A customer table with fixed columns for name, age and plan"},{"left":"Unstructured data","right":"Support call recordings and scanned PDF contracts"}],"explain":"Labeled data has a known answer, unlabeled has none, time-series is ordered by time, structured data fits fixed rows and columns, and unstructured data such as audio and documents does not.","refs":["Exam guide 1.1.4"],"slice":"fill"},{"id":"fill-q-multi-where-ml-adds-value","domain":1,"task":"1.2","objective":"1.2.1","tags":[],"format":"multi","stem":"A company is deciding where to invest in AI/ML. It wants to use ML only where learning patterns from historical data and operating at scale bring a clear benefit. Which use cases are the BEST fit? (Select TWO.)","options":[{"text":"Automatically routing millions of incoming support emails to the right team","correct":true,"why":"A repetitive, high-volume task with plenty of historical examples is a classic case for automation and scalability with ML."},{"text":"Giving loan officers a risk score that they review before the final decision","correct":true,"why":"ML assists human decision making here, while a person keeps the final call."},{"text":"Applying a fixed tax rate that must be exactly correct on every invoice","correct":false,"why":"A deterministic rule with one exact outcome is cheaper and more reliable as ordinary code than as a prediction."},{"text":"Making a one-time strategic decision for which no historical data exists","correct":false,"why":"ML needs relevant historical data to learn from, and a one-off decision gives no scale benefit."},{"text":"Alphabetically sorting a 200-row product list that changes once a month","correct":false,"why":"A small, infrequent, deterministic task has no patterns to learn and no scale benefit; a simple sort is exact and cheaper."}],"pick":2,"sequence":[],"pairs":[],"explain":"ML adds value when it automates high-volume work or assists human decisions; tasks that need an exact rule-based outcome, have no historical data, or are small and simple point away from ML.","refs":["Exam guide 1.2.1"],"slice":"fill"},{"id":"fill-q-chain-of-thought","domain":3,"task":"3.2","objective":"3.2.2","tags":["hot"],"format":"single","stem":"A logistics company uses a foundation model on Amazon Bedrock to answer customer questions about shipping costs, which need several calculation steps. The model often returns wrong totals. The team wants better accuracy without training the model, by having it reason step by step before it gives the final answer. Which technique should the team use?","options":[{"text":"Chain-of-thought prompting","correct":true,"why":"Chain-of-thought prompting asks the model to work through intermediate reasoning steps, which improves multi-step math and logic answers."},{"text":"Zero-shot prompting","correct":false,"why":"Zero-shot gives only the task with no examples or reasoning guidance, which is likely what already fails."},{"text":"Increasing the temperature","correct":false,"why":"A higher temperature makes output more random, not more accurate."},{"text":"Few-shot prompting with unrelated examples","correct":false,"why":"Examples from unrelated tasks do not show the needed reasoning steps and can confuse the model."}],"pick":1,"sequence":[],"pairs":[],"explain":"Step by step reasoning without training means chain-of-thought prompting, often triggered by asking the model to think through the problem step by step.","refs":["Exam guide 3.2.2"],"slice":"fill"},{"id":"fill-q-match-prompt-constructs","domain":3,"task":"3.2","objective":"3.2.1","tags":[],"format":"match","stem":"A team is writing prompts for an airline support assistant and for an image generator. Match each prompt element to the example text.","options":[],"pick":0,"sequence":[],"pairs":[{"left":"Instruction","right":"Summarize the customer's complaint and rate how urgent it is"},{"left":"Context","right":"Airline policy: bags delayed more than 21 days qualify for compensation"},{"left":"Input data","right":"The customer's pasted complaint email"},{"left":"Output indicator","right":"Return JSON with the fields issue, urgency and next_step"},{"left":"Negative prompt","right":"No text, no watermark, no blurry background (for the image model)"}],"explain":"The instruction says what task to do, context gives background facts the model needs, input data is the content to work on, the output indicator sets the format, and a negative prompt lists what to leave out.","refs":["Exam guide 3.2.1"],"slice":"fill"},{"id":"fill-q-multi-prompt-best-practices","domain":3,"task":"3.2","objective":"3.2.3","tags":[],"format":"multi","stem":"A team's prompts to a foundation model return vague answers in inconsistent formats. The team wants to improve response quality without training the model. Which actions should the team take? (Select TWO.)","options":[{"text":"Make the prompt specific and concise, and state the exact output format","correct":true,"why":"Specific, concise instructions with a clear format reduce vagueness and make outputs consistent."},{"text":"Test several prompt variants, compare the results and iterate on the best","correct":true,"why":"Experimentation and iteration is a core prompt engineering practice for finding what works."},{"text":"Set the temperature to its maximum value for every request","correct":false,"why":"Maximum temperature adds randomness, making answers less consistent."},{"text":"Paste all company documents into every prompt as background","correct":false,"why":"Dumping everything wastes tokens, can exceed the context window and dilutes the relevant information."},{"text":"Remove all instructions and rely on the model's default behavior","correct":false,"why":"Less guidance produces more vague and variable answers, not fewer."}],"pick":2,"sequence":[],"pairs":[],"explain":"Better prompts come from specificity, concision, a clear output format and systematic experimentation, not from randomness or overloading the context.","refs":["Exam guide 3.2.3"],"slice":"fill"},{"id":"fill-q-ab-test-business-value","domain":3,"task":"3.4","objective":"3.4.3","tags":[],"format":"single","stem":"A retailer has launched a feature that uses a foundation model to write product descriptions. Leadership wants to know whether the feature actually increases purchases and saves copywriter time in production. Which approach should the retailer use?","options":[{"text":"Run an A/B test comparing conversion rates for generated and human-written descriptions, and track copywriter time saved","correct":true,"why":"An online A/B test measures the real business outcomes, purchases and time saved, with live customers."},{"text":"Compute BLEU scores that compare the generated descriptions with the old human-written ones","correct":false,"why":"BLEU measures word overlap with reference text and says nothing about purchases or time saved."},{"text":"Run the model against a public benchmark dataset and compare its score with other models","correct":false,"why":"A benchmark measures general model capability, not this retailer's business results."},{"text":"Measure the model's perplexity on a large sample of the retailer's existing product text","correct":false,"why":"Perplexity measures how well the model predicts text, not whether customers buy more."}],"pick":1,"sequence":[],"pairs":[],"explain":"To prove business value, measure business metrics such as conversion rate and productivity in production, typically with an A/B test.","refs":["Exam guide 3.4.3"],"slice":"fill"},{"id":"fill-q-explainable-not-transparent","domain":4,"task":"4.2","objective":"4.2.1","tags":[],"format":"single","stem":"A bank uses a deep neural network to approve or decline credit applications. Regulators now require the bank to give a reason for each individual decision, but the bank will not replace or retrain the model. Which statement is correct?","options":[{"text":"The model is not transparent, but post-hoc feature attributions such as SHAP values can explain each decision","correct":true,"why":"Post-hoc methods such as SHAP, available in SageMaker Clarify, explain individual predictions of a black-box model without changing it."},{"text":"A deep neural network is transparent by design because every weight in it can be inspected","correct":false,"why":"Millions of weights cannot be interpreted by people, so a deep neural network is not transparent."},{"text":"The bank must open-source the model weights before any single decision can be explained","correct":false,"why":"Explaining a decision does not require publishing weights; post-hoc tools work from the model's inputs and outputs."},{"text":"Only retraining the model as a linear model can produce any explanation for a decision","correct":false,"why":"Linear models are more transparent, but post-hoc methods can explain the existing model, and retraining is ruled out."}],"pick":1,"sequence":[],"pairs":[],"explain":"Transparent means you can see how the model works inside; explainable means you can say why it produced an output, which post-hoc attributions add to black-box models.","refs":["Exam guide 4.2.1","https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-configure-processing-jobs.html"],"slice":"fill"},{"id":"fill-q-ai-service-cards","domain":4,"task":"4.2","objective":"4.2.2","tags":[],"format":"single","stem":"Before adopting Amazon Rekognition face matching, a company's responsible AI board wants to read AWS's own documentation of the service's intended use cases, limitations and responsible AI design choices. Which resource should the board use?","options":[{"text":"AWS AI Service Cards","correct":true,"why":"AI Service Cards are AWS's transparency documents describing intended use cases, limitations and responsible AI design choices of its AI services."},{"text":"Amazon SageMaker Model Cards","correct":false,"why":"Model Cards are where you document models that you build yourself, not AWS's managed services."},{"text":"AWS Artifact","correct":false,"why":"Artifact provides AWS compliance reports such as SOC and ISO, not per-service responsible AI documentation."},{"text":"Amazon Bedrock Model Evaluation","correct":false,"why":"Model Evaluation runs evaluation jobs on foundation models; it does not document Rekognition's intended uses."}],"pick":1,"sequence":[],"pairs":[],"explain":"AWS documents its own AI services in AI Service Cards; you document your own models in SageMaker Model Cards.","refs":["Exam guide 4.2.2","https://aws.amazon.com/ai/responsible-ai/resources/"],"slice":"fill"},{"id":"fill-q-multi-prompt-injection-agent-tools","domain":5,"task":"5.1","objective":"5.1.4","tags":["hot","new2026"],"format":"multi","stem":"A company runs a customer chatbot on Amazon Bedrock that can call internal tools, such as a refund API, and that reads retrieved web pages. Attackers hide instructions in user messages and in those web pages to make the bot ignore its rules and misuse the tools. Which actions will reduce this risk? (Select TWO.)","options":[{"text":"Enable the Amazon Bedrock Guardrails prompt attack filter and tag untrusted retrieved content as user input","correct":true,"why":"The prompt attack filter detects injection and jailbreak attempts in content tagged as user input, including untrusted retrieved text."},{"text":"Give each tool least-privilege IAM permissions and validate tool inputs and outputs outside the model","correct":true,"why":"Even if an injection succeeds, least privilege and independent validation limit what the bot can actually do."},{"text":"Raise the model's temperature so that its responses are harder for attackers to predict","correct":false,"why":"Temperature only changes randomness and does nothing to block injected instructions."},{"text":"Enable Amazon Macie on the Amazon S3 bucket that stores the chat transcripts","correct":false,"why":"Macie discovers sensitive data in S3; it does not detect or stop prompt injection."},{"text":"Switch the chatbot to Provisioned Throughput to get dedicated model capacity","correct":false,"why":"Provisioned Throughput buys capacity and has no effect on security."}],"pick":2,"sequence":[],"pairs":[],"explain":"Defend against prompt injection in layers: filter inputs with Amazon Bedrock Guardrails prompt attack detection and limit and validate what tools can do outside the model.","refs":["Exam guide 5.1.4","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tagging.html"],"slice":"fill"},{"id":"fill-q-config-rules-compliance","domain":5,"task":"5.2","objective":"5.2.1","tags":[],"format":"single","stem":"A company must continuously evaluate whether all its SageMaker AI endpoints and Amazon S3 training data buckets stay encrypted. It must be alerted when any resource becomes noncompliant and keep a history of each resource's configuration. Which AWS service meets these requirements?","options":[{"text":"AWS Config with Config rules","correct":true,"why":"Config records resource configuration history and continuously evaluates resources against rules, flagging noncompliant ones."},{"text":"AWS CloudTrail with a trail","correct":false,"why":"CloudTrail logs who made which API call; it does not evaluate resources against compliance rules."},{"text":"AWS Artifact reports","correct":false,"why":"Artifact provides AWS's own compliance reports; it does not check your resources."},{"text":"AWS Trusted Advisor checks","correct":false,"why":"Trusted Advisor runs a fixed set of best-practice checks and keeps no configuration history for custom compliance rules."}],"pick":1,"sequence":[],"pairs":[],"explain":"Continuous compliance evaluation plus configuration history means AWS Config; who did it means CloudTrail.","refs":["Exam guide 5.2.1","https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html"],"slice":"fill"},{"id":"fill-q-aws-transform-migration","domain":2,"task":"2.3","objective":"2.3.1","tags":["new2026"],"format":"single","stem":"A company wants to migrate hundreds of VMware virtual machines to Amazon EC2 and modernize its IBM z/OS mainframe COBOL applications. It wants specialized AI agents to handle discovery, migration wave planning and code transformation with the LEAST manual effort. Which AWS service should it use?","options":[{"text":"AWS Transform","correct":true,"why":"Transform provides ready-made agentic AI for VMware migration and mainframe modernization, including discovery and wave planning."},{"text":"Kiro","correct":false,"why":"Kiro is a developer IDE for building software from specs; it does not discover servers or plan migration waves."},{"text":"Amazon Bedrock AgentCore","correct":false,"why":"AgentCore runs agents you build yourself, so the company would have to create its own migration agents."},{"text":"Strands Agents","correct":false,"why":"Strands is an open-source SDK for coding your own agents, which means far more manual effort."}],"pick":1,"sequence":[],"pairs":[],"explain":"Legacy migration or modernization with specialized AI agents and minimal effort points to AWS Transform.","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html"],"slice":"fill"}]}</script>
<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('deck').textContent);
  var CARDS = DATA.cards || [];
  var QUIZ = DATA.quiz || [];
  var META = DATA.meta || {};

  var DOMAINS = {
    1: { name: 'Fundamentals of AI and ML', w: 20 },
    2: { name: 'Fundamentals of Generative AI', w: 24 },
    3: { name: 'Applications of Foundation Models', w: 28 },
    4: { name: 'Guidelines for Responsible AI', w: 14 },
    5: { name: 'Security, Compliance, and Governance for AI Solutions', w: 14 }
  };
  var TASKS = {
    '1.1': 'Explain basic AI concepts and terminologies',
    '1.2': 'Identify practical use cases for AI',
    '1.3': 'Describe the AI/ML development lifecycle',
    '2.1': 'Explain the basic concepts of generative AI',
    '2.2': 'Capabilities and limitations of GenAI for business problems',
    '2.3': 'AWS infrastructure and technologies for building GenAI applications',
    '3.1': 'Design considerations for applications that use foundation models',
    '3.2': 'Choose effective prompt engineering techniques',
    '3.3': 'The training and fine-tuning process for FMs',
    '3.4': 'Methods to evaluate FM performance',
    '4.1': 'Develop AI systems that are responsible',
    '4.2': 'Transparent and explainable models',
    '5.1': 'Methods to secure AI systems',
    '5.2': 'Governance and compliance regulations for AI systems'
  };
  var TAGLABEL = { new2026: 'NEW 2026', hot: 'HOT', legacy: 'LEGACY' };
  var KINDLABEL = { concept: 'Concept', scenario: 'Scenario', compare: 'Compare' };
  var KIND_ORDER = { concept: 0, scenario: 1, compare: 2 };
  var SLICE_ORDER = { s1: 0, s2: 1, s3: 2, s4: 3, s5: 4, s6: 5, s7: 6, fill: 7 };
  var MODES = [['learn', 'Learn'], ['flash', 'Flashcards'], ['quiz', 'Quiz'], ['review', 'Review'], ['tips', 'Exam tips']];

  // ---------- storage (every access guarded: storage can be blocked) ----------
  var LS_PROGRESS = 'aifc01.progress.v1', LS_PREFS = 'aifc01.prefs.v1';
  function load(key, def) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* ignore */ } }
  var P = load(LS_PROGRESS, null) || {};
  if (!P.cards) P.cards = {};
  if (!P.quiz) P.quiz = {};
  var prefs = Object.assign({ mode: 'learn', domain: 0, tags: [], kinds: [], shuffle: true, theme: 'auto', hideKnown: false, compact: false },
    load(LS_PREFS, {}) || {});
  function savePrefs() { save(LS_PREFS, prefs); }

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function objKey(o) { return String(o).split('.').map(function (n) { return ('0' + n).slice(-2); }).join('.'); }
  function shortUrl(u) {
    try { var x = new URL(u); var p = x.pathname.replace(/\/$/, ''); var last = p.split('/').pop() || ''; return x.hostname.replace(/^www\./, '') + (last ? '/…/' + last : ''); }
    catch (e) { return u; }
  }
  function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
  var $ = function (id) { return document.getElementById(id); };

  CARDS.forEach(function (c, i) { c._i = i; c.tags = c.tags || []; c.cues = c.cues || []; c.confuse = c.confuse || []; c.refs = c.refs || []; });
  QUIZ.forEach(function (q, i) { q._i = i; q.tags = q.tags || []; q.refs = q.refs || []; });
  CARDS.sort(function (a, b) {
    return a.domain - b.domain || objKey(a.objective).localeCompare(objKey(b.objective)) ||
      (KIND_ORDER[a.kind] || 0) - (KIND_ORDER[b.kind] || 0) ||
      ((SLICE_ORDER[a.slice] == null ? 9 : SLICE_ORDER[a.slice]) - (SLICE_ORDER[b.slice] == null ? 9 : SLICE_ORDER[b.slice])) || a._i - b._i;
  });
  QUIZ.sort(function (a, b) { return a.domain - b.domain || objKey(a.objective).localeCompare(objKey(b.objective)) || a._i - b._i; });
  var CARD_BY = {}, QUIZ_BY = {};
  CARDS.forEach(function (c) { CARD_BY[c.id] = c; });
  QUIZ.forEach(function (q) { QUIZ_BY[q.id] = q; });

  function cardStatus(id) { var r = P.cards[id]; return r && r.s ? r.s : 'new'; }
  function setCard(id, s) {
    var r = P.cards[id] || { n: 0 };
    r.s = s; r.n = (r.n || 0) + 1; r.t = Date.now();
    P.cards[id] = r; save(LS_PROGRESS, P); renderSummary(); scheduleSync();
  }
  function quizStatus(id) { var r = P.quiz[id]; return r ? (r.ok ? 'right' : 'wrong') : 'new'; }
  function setQuiz(id, ok) {
    var r = P.quiz[id] || { n: 0, c: 0 };
    r.ok = !!ok; r.n = (r.n || 0) + 1; if (ok) r.c = (r.c || 0) + 1; r.t = Date.now();
    P.quiz[id] = r; save(LS_PROGRESS, P); renderSummary(); scheduleSync();
  }

  // ---------- progress merge (used by gist sync and by code import) ----------
  // Every record carries t (ms). Per item, the newest record wins; records older than the newest reset are dropped.
  function recSig(r) { return r ? [r.t || 0, r.s || '', r.ok === undefined ? '' : (r.ok ? 1 : 0), r.n || 0, r.c || 0].join('|') : ''; }
  function mergeProgress(local, remote) {
    local = local || {}; remote = remote || {};
    var resetAt = Math.max(local.resetAt || 0, remote.resetAt || 0);
    var out = { cards: {}, quiz: {}, resetAt: resetAt };
    var localChanged = (local.resetAt || 0) !== resetAt, remoteChanged = (remote.resetAt || 0) !== resetAt;
    ['cards', 'quiz'].forEach(function (k) {
      var L = local[k] || {}, R = remote[k] || {}, ids = {};
      Object.keys(L).forEach(function (id) { ids[id] = 1; });
      Object.keys(R).forEach(function (id) { ids[id] = 1; });
      Object.keys(ids).forEach(function (id) {
        var a = L[id] && (L[id].t || 0) > resetAt ? L[id] : null;
        var b = R[id] && (R[id].t || 0) > resetAt ? R[id] : null;
        var win = !a ? b : !b ? a : ((b.t || 0) > (a.t || 0) ? b : a);
        if (win) out[k][id] = win;
        if (recSig(win) !== recSig(L[id])) localChanged = true;
        if (recSig(win) !== recSig(R[id])) remoteChanged = true;
      });
    });
    return { merged: out, localChanged: localChanged, remoteChanged: remoteChanged };
  }
  function onProgressReplaced() {
    renderSummary();
    if (prefs.mode === 'learn' || prefs.mode === 'review') renderView();  // never disturb a running flashcard or quiz session
  }

  // ---------- sync between devices through a secret GitHub gist ----------
  var LS_SYNC = 'aifc01.sync.v1';
  var GIST_FILE = 'aifc01-progress.json', GIST_DESC = 'AIF-C01 study progress (synced by the study app)';
  var syncCfg = load(LS_SYNC, null) || {};
  var apiBase = (function () {  // test hook: only a local mock API may replace GitHub
    var o = load('aifc01.apibase', null);
    return typeof o === 'string' && /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(o) ? o : 'https://api.github.com';
  })();
  var syncBusy = false, syncAgain = false, syncTimer = null;
  function saveSync() { save(LS_SYNC, syncCfg); }
  function hhmm(t) { var d = new Date(t); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function gh(path, method, body) {
    return fetch(apiBase + path, {
      method: method || 'GET', cache: 'no-store',
      headers: { 'Authorization': 'Bearer ' + syncCfg.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (!r.ok) {
        var e = new Error(r.status === 401 ? 'GitHub rejected the token (401)' : r.status === 404 ? 'gist not found (404)' : 'GitHub error ' + r.status);
        e.status = r.status; throw e;
      }
      return r.json();
    });
  }
  function findOrCreateGist() {
    return gh('/gists?per_page=100').then(function (list) {
      var mine = (list || []).filter(function (g) { return g.files && g.files[GIST_FILE]; });
      mine.sort(function (a, b) { return String(a.created_at).localeCompare(String(b.created_at)); });  // oldest wins if two ever exist
      if (mine.length) return mine[0].id;
      var files = {}; files[GIST_FILE] = { content: JSON.stringify({ cards: {}, quiz: {}, resetAt: 0 }) };
      return gh('/gists', 'POST', { description: GIST_DESC, public: false, files: files }).then(function (g) { return g.id; });
    });
  }
  function syncNow() {
    if (!syncCfg.token) return Promise.resolve();
    if (syncBusy) { syncAgain = true; return Promise.resolve(); }
    syncBusy = true; renderSyncStatus();
    var wrote = false;
    return (syncCfg.gistId ? Promise.resolve(syncCfg.gistId) : findOrCreateGist()).then(function (id) {
      syncCfg.gistId = id;
      return gh('/gists/' + id);
    }).then(function (g) {
      var f = g.files && g.files[GIST_FILE], remote = {};
      try { remote = f && f.content ? JSON.parse(f.content) : {}; } catch (e) { remote = {}; }
      var m = mergeProgress(P, remote);  // read and replace P in the same tick, so no tap can slip in between
      if (m.localChanged) { P = m.merged; save(LS_PROGRESS, P); onProgressReplaced(); }
      if (m.remoteChanged) {
        var files = {}; files[GIST_FILE] = { content: JSON.stringify(m.merged) };
        wrote = true;
        return gh('/gists/' + syncCfg.gistId, 'PATCH', { files: files });
      }
    }).then(function () {
      syncCfg.last = Date.now(); syncCfg.error = '';
    }).catch(function (e) {
      wrote = false;
      if (e && e.status === 404) syncCfg.gistId = null;  // gist deleted: look it up (or recreate it) next time
      syncCfg.error = (e && e.status) ? e.message : 'offline, will retry';
    }).then(function () {
      if (syncCfg.token) saveSync();  // unless the user disconnected meanwhile
      syncBusy = false; renderSyncStatus();
