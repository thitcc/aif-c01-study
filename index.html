<script id="deck" type="application/json">{"meta":{"built":"2026-09-28 21:26","partial":false,"slices":["s1","s2","s3","s4","s5","s6","s7","fill"],"cards":272,"quiz":104},"cards":[{"id":"s1-ai-ml-deep-learning","domain":1,"task":"1.1","objective":"1.1.1","kind":"concept","tags":[],"front":"What are artificial intelligence (AI), machine learning (ML), deep learning and neural networks?","answer":"AI is the broad field of machines doing tasks that need human-like intelligence; ML is AI that learns patterns from data; deep learning is ML that uses many-layered neural networks.","explain":"Artificial intelligence (AI) is the umbrella term for any system that reasons, perceives or decides like a human would. Machine learning (ML) is a subset of AI where the system learns rules from example data instead of a programmer writing every rule. A neural network is a model made of layers of connected nodes loosely inspired by brain neurons; deep learning means neural networks with many layers. Deep learning shines on unstructured data such as images, audio and free text.","example":"A spam filter that learned from millions of emails marked spam or not spam is ML; if it uses a many-layered neural network, it is also deep learning.","cues":["learns from data instead of explicit rules","multiple layers","neural network"],"confuse":[{"with":"Rule-based software","diff":"Rules are written by a programmer; ML infers the rules from data."}],"memory":"Russian dolls: AI contains ML contains deep learning.","refs":["Exam guide 1.1.1"],"slice":"s1"},{"id":"s1-generative-ai-llm","domain":1,"task":"1.1","objective":"1.1.1","kind":"concept","tags":[],"front":"What are generative AI (GenAI) and a large language model (LLM)?","answer":"Generative AI creates new content such as text, images, audio or code; an LLM is a large deep learning model trained on huge amounts of text to understand and generate language.","explain":"Generative AI (GenAI) is a subset of deep learning whose output is a brand-new artifact rather than a label or a number. It is usually built on a foundation model (FM), a very large model pre-trained on broad data that can be adapted to many tasks. A large language model (LLM) is an FM specialized in text: it generates text one piece at a time by predicting what comes next. On the exam, if the output is a new paragraph, summary, image or code, think GenAI.","example":"Asking a model to draft a product description from five bullet points is GenAI; predicting whether a customer will churn (yes or no) is traditional ML.","cues":["generate new content","summarize","draft","create images or code"],"confuse":[{"with":"Traditional ML","diff":"Traditional ML outputs a label, category or number; GenAI outputs new content."}],"memory":"Generative = it makes something new.","refs":["Exam guide 1.1.1"],"slice":"s1"},{"id":"s1-agentic-ai-overview","domain":1,"task":"1.1","objective":"1.1.1","kind":"concept","tags":["new2026"],"front":"What is agentic AI?","answer":"Agentic AI is an AI system that autonomously plans and performs multi-step tasks toward a goal, using an FM to reason and calling tools, APIs and data sources to take actions.","explain":"An agent is a program that uses a foundation model (FM) as its reasoning engine to decide what to do next, instead of only answering one prompt. It breaks a goal into steps, calls tools (for example an API, a database query or a web search), observes the results and continues until the task is done. Agentic AI is the newest layer on top of GenAI: GenAI produces content, agentic AI produces actions. Deep agent topics (multi-agent patterns, MCP, Amazon Bedrock AgentCore, Strands Agents) are covered elsewhere in this deck.","example":"A travel agent bot that checks your calendar, searches flights, books the cheapest one and emails you the itinerary, all from one request.","cues":["take actions","multi-step tasks","autonomously","call APIs or tools"],"confuse":[{"with":"Chatbot","diff":"A chatbot only replies; an agent plans and executes actions with tools."},{"with":"Generative AI","diff":"GenAI creates content; agentic AI uses GenAI to reason and then acts."}],"memory":"GenAI talks, agentic AI does.","refs":["Exam guide 1.1.1"],"slice":"s1"},{"id":"s1-computer-vision-nlp","domain":1,"task":"1.1","objective":"1.1.1","kind":"concept","tags":[],"front":"What are computer vision and natural language processing (NLP)?","answer":"Computer vision lets machines interpret images and video; natural language processing (NLP) lets machines understand and work with human language in text or speech.","explain":"Computer vision covers tasks such as detecting objects, recognizing faces, reading text in images and flagging unsafe images. NLP covers tasks such as sentiment analysis, entity extraction, translation, summarization and question answering. Both are application areas of AI, usually powered by deep learning. On AWS, the ready-made vision service is Amazon Rekognition and the ready-made NLP service is Amazon Comprehend.","example":"Counting cars in parking lot camera images is computer vision; detecting angry customer reviews is NLP.","cues":["images or video","text or language","sentiment","detect objects"],"confuse":[{"with":"Speech recognition","diff":"Converting audio to text is speech recognition (Amazon Transcribe), often paired with NLP."}],"memory":"Vision = eyes, NLP = reading and language.","refs":["Exam guide 1.1.1"],"slice":"s1"},{"id":"s1-model-algorithm-training-inference","domain":1,"task":"1.1","objective":"1.1.1","kind":"concept","tags":[],"front":"What are an algorithm, a model, training and inference?","answer":"An algorithm is the learning procedure; a model is the trained artifact it produces. Training teaches the model from data; inference uses the trained model to make predictions on new data.","explain":"An algorithm (for example linear regression, or XGBoost, a popular tree-based algorithm for tabular data) is the recipe for learning. Running that algorithm on training data produces a model, which is the file of learned patterns (parameters). Training is the expensive learning phase; inference (also called inferencing or prediction) is when the finished model answers new requests in production. Most AWS cost and deployment questions are about inference.","example":"Training: feed 5 years of house sales to an algorithm. Inference: the resulting model estimates the price of a house listed today.","cues":["make predictions on new data","trained model","deploy for inference"],"confuse":[{"with":"Parameters vs hyperparameters","diff":"Parameters are learned during training; hyperparameters (learning rate, number of epochs) are settings chosen before training."}],"memory":"Algorithm is the recipe, model is the cake, inference is serving the cake.","refs":["Exam guide 1.1.1"],"slice":"s1"},{"id":"s1-fit-overfitting-underfitting","domain":1,"task":"1.1","objective":"1.1.1","kind":"concept","tags":["hot"],"front":"What do fit, overfitting and underfitting mean?","answer":"Overfitting is when a model performs well on training data but poorly on new data; underfitting is when it performs poorly on both. A good fit generalizes well to unseen data.","explain":"Fit describes how well a model has captured the real pattern. Overfitting means the model memorized the training data, including noise, so it fails on new data; this is called high variance (predictions change a lot with small changes in training data). Fixes include more training data, data augmentation (creating extra training examples, for example by flipping images), regularization (a penalty that keeps the model simpler), early stopping (stop training when validation accuracy stops improving) or a simpler model. Underfitting means the model is too simple to capture the pattern, called high bias in the statistical sense; fixes include a more complex model, better features or longer training. The exam describes symptoms (training accuracy versus test accuracy) and asks for the problem or fix.","example":"Training accuracy 99 percent, test accuracy 60 percent: overfitting. Training 55 percent and test 54 percent: underfitting.","cues":["high accuracy on training data but low on new data","performs poorly on both","does not generalize"],"confuse":[{"with":"Data leakage","diff":"Leakage is test data leaking into training, which makes evaluation look better than reality."}],"memory":"Overfit = memorized the exam answers; underfit = never studied.","refs":["Exam guide 1.1.1"],"slice":"s1"},{"id":"s1-labeled-unlabeled-data","domain":1,"task":"1.1","objective":"1.1.4","kind":"concept","tags":[],"front":"What is the difference between labeled and unlabeled data?","answer":"Labeled data has each example tagged with the correct answer (the target); unlabeled data has no answer attached. Supervised learning requires labeled data; unsupervised learning works on unlabeled data.","explain":"A label is the known correct output for an example, also called ground truth. Creating labels usually requires humans, so labeled data is expensive and slow to obtain, while unlabeled data is plentiful. The presence or absence of labels in a scenario is the biggest clue for which learning type to pick. Amazon SageMaker Ground Truth helps humans create labels.","example":"10,000 X-ray images each marked tumor or no tumor are labeled; 10,000 X-rays with no notes are unlabeled.","cues":["historical data with known outcomes","no labels available","ground truth"],"confuse":[],"memory":"Label = answer key.","refs":["Exam guide 1.1.4"],"slice":"s1"},{"id":"s1-structured-unstructured-data","domain":1,"task":"1.1","objective":"1.1.4","kind":"concept","tags":[],"front":"What are structured, unstructured, tabular, time-series, image and text data?","answer":"Structured (tabular) data fits rows and columns with a fixed schema; unstructured data such as text, images, audio and video has no fixed schema. Time-series data is a sequence of values ordered by time.","explain":"Tabular data is the classic spreadsheet or database table, ideal for traditional ML such as regression and classification. Time-series data records a value at regular time steps (daily sales, sensor readings every second) and is used for forecasting and anomaly detection. Image and text data are unstructured and usually need deep learning or foundation models. Semi-structured data (JSON, logs) sits in between.","example":"Customer table with age, plan and monthly spend is structured; support call recordings and product photos are unstructured; hourly electricity usage is time-series.","cues":["rows and columns","ordered by time","documents, images, audio"],"confuse":[],"memory":"Structured fits in Excel; unstructured does not.","refs":["Exam guide 1.1.4"],"slice":"s1"},{"id":"s1-supervised-learning","domain":1,"task":"1.1","objective":"1.1.5","kind":"concept","tags":["hot"],"front":"What is supervised learning?","answer":"Supervised learning trains a model on labeled data (inputs paired with known correct outputs) so it can predict the output for new inputs. It is used for classification and regression.","explain":"The model sees many examples where the right answer is known and learns the mapping from input to answer. Classification predicts a category (fraud or not fraud); regression predicts a number (house price). Semi-supervised learning is a variant that uses a small labeled set plus a large unlabeled set when labeling is expensive. If the stem says historical data with known outcomes, pick supervised.","example":"Train on past loan applications marked repaid or defaulted to predict whether a new applicant will default.","cues":["labeled historical data","known outcomes","predict a category or value"],"confuse":[{"with":"Unsupervised learning","diff":"Unsupervised has no labels and finds structure; supervised learns from labeled answers."},{"with":"Semi-supervised learning","diff":"Semi-supervised combines a few labels with lots of unlabeled data."}],"memory":"Supervised = a teacher gives the answers.","refs":["Exam guide 1.1.5"],"slice":"s1"},{"id":"s1-unsupervised-learning","domain":1,"task":"1.1","objective":"1.1.5","kind":"concept","tags":["hot"],"front":"What is unsupervised learning?","answer":"Unsupervised learning finds hidden patterns or groupings in unlabeled data, for example clustering, anomaly detection and dimensionality reduction.","explain":"There is no correct answer in the data, so the algorithm discovers structure on its own. Clustering groups similar items (customer segments), anomaly detection finds points that do not fit the normal pattern, and dimensionality reduction compresses many features into fewer. Self-supervised learning, used to pretrain LLMs, creates its own labels from the raw data (for example predicting the next word), so it needs no human labels either.","example":"Group 1 million shoppers into segments by purchase behavior without predefined segment names.","cues":["no labeled data","group similar","discover patterns","segments"],"confuse":[{"with":"Supervised learning","diff":"Supervised needs labels; unsupervised does not."},{"with":"Self-supervised learning","diff":"Self-supervised generates labels from the data itself; it is how foundation models are pretrained."}],"memory":"Unsupervised = no teacher, find the groups yourself.","refs":["Exam guide 1.1.5"],"slice":"s1"},{"id":"s1-reinforcement-learning","domain":1,"task":"1.1","objective":"1.1.5","kind":"concept","tags":["hot"],"front":"What is reinforcement learning (RL)?","answer":"Reinforcement learning trains an agent to make a sequence of decisions by taking actions in an environment and learning from rewards and penalties to maximize cumulative reward.","explain":"In RL there is no labeled dataset: the agent tries actions (trial and error), receives a reward signal, and gradually learns a policy (a strategy of what to do in each situation). It suits robotics, games, autonomous driving and dynamic optimization. Reinforcement learning from human feedback (RLHF) uses human preference ratings as the reward to align LLMs with human expectations.","example":"A warehouse robot learns the fastest path by getting a reward for each delivered package and a penalty for each collision.","cues":["reward","penalty","trial and error","agent interacts with an environment"],"confuse":[{"with":"Supervised learning","diff":"Supervised learns from correct answers given up front; RL learns from reward feedback after acting."}],"memory":"RL = training a dog with treats.","refs":["Exam guide 1.1.5"],"slice":"s1"},{"id":"s1-ai-value","domain":1,"task":"1.2","objective":"1.2.1","kind":"concept","tags":[],"front":"Where does AI/ML provide business value?","answer":"AI/ML adds value by assisting human decision making, automating repetitive tasks, scaling solutions to volumes humans cannot handle, and finding patterns too complex for hand-written rules.","explain":"Good ML candidates have lots of data, a complex pattern and tolerance for occasional errors. Typical value comes from speed (decisions in milliseconds), scale (millions of transactions), consistency (no fatigue) and personalization (a different result for each user). AI usually assists humans rather than replaces them, especially for high-stakes decisions.","example":"A bank uses ML to score every transaction for fraud in real time and sends only the riskiest 0.1 percent to human investigators.","cues":["automate repetitive tasks","scale","assist human decision making","complex patterns"],"confuse":[],"memory":"Assist, automate, scale.","refs":["Exam guide 1.2.1"],"slice":"s1"},{"id":"s1-when-not-ml","domain":1,"task":"1.2","objective":"1.2.2","kind":"concept","tags":[],"front":"When is AI/ML NOT the right solution?","answer":"Avoid ML when a simple deterministic rule solves the problem, when an exact and guaranteed outcome is required instead of a prediction, when there is not enough quality data, or when the cost outweighs the benefit.","explain":"ML produces probabilistic predictions, which means it can be wrong. If the business needs the same correct answer every time (tax calculation, applying a fixed discount rule), ordinary code is cheaper, faster and fully auditable. A cost-benefit analysis compares development, data, compute and maintenance costs with the expected benefit. The exam sometimes hides a rule-based problem inside an AI question; the right answer is not to use ML.","example":"Give 10 percent off orders over 100 dollars: write an if statement, do not train a model.","cues":["specific outcome is needed","deterministic","fixed business rule","cost-benefit analysis"],"confuse":[],"memory":"If an if-statement can do it, ML should not.","refs":["Exam guide 1.2.2"],"slice":"s1"},{"id":"s1-anomaly-detection","domain":1,"task":"1.2","objective":"1.2.3","kind":"concept","tags":["hot"],"front":"What is anomaly detection?","answer":"Anomaly detection identifies rare data points, events or patterns that deviate significantly from normal behavior, often using unsupervised learning when labeled examples of anomalies are scarce.","explain":"An anomaly (outlier) is something unusual compared with the learned normal pattern. Because real anomalies are rare and often unlabeled, models usually learn what normal looks like and flag anything far from it. Random Cut Forest is a well-known AWS algorithm for this. Typical uses are fraud, equipment failure, network intrusion and sudden metric spikes.","example":"A factory sensor normally reads 60 to 70 degrees; a model flags a sudden reading of 95 as an anomaly before the machine fails.","cues":["unusual patterns","outliers","deviates from normal behavior","rare events"],"confuse":[{"with":"Classification","diff":"Classification needs labeled examples of every class; anomaly detection can learn only from normal data."}],"memory":"Anomaly = the odd one out.","refs":["Exam guide 1.2.3"],"slice":"s1"},{"id":"s1-real-world-applications","domain":1,"task":"1.2","objective":"1.2.4","kind":"concept","tags":["new2026"],"front":"What are common real-world AI applications the exam expects you to recognize?","answer":"Computer vision, NLP, speech recognition, recommendation systems, fraud detection, forecasting, knowledge bases that answer questions from company documents, and agentic AI that completes multi-step tasks.","explain":"Each application maps to a technique: vision to image models, NLP to text models, speech recognition to speech-to-text, recommendations to personalization, fraud to classification or anomaly detection, forecasting to time-series regression. A knowledge base lets an FM answer questions grounded in an organization's own documents (retrieval augmented generation, RAG). Agentic AI lets an FM act, not just answer.","example":"An insurer uses Textract to read claim forms, a fraud model to score them, a knowledge base chatbot for agents' policy questions, and an AI agent to open follow-up tickets.","cues":["recommendation","fraud detection","forecast demand","answer questions from internal documents"],"confuse":[],"memory":"See, read, listen, recommend, detect, forecast, know, act.","refs":["Exam guide 1.2.4"],"slice":"s1"},{"id":"s1-sagemaker-ai-overview","domain":1,"task":"1.2","objective":"1.2.5","kind":"concept","tags":["hot"],"front":"What is Amazon SageMaker AI?","answer":"Amazon SageMaker AI is a fully managed service to build, train, tune, deploy and monitor your own ML models at scale, covering the entire ML lifecycle.","explain":"SageMaker AI (formerly Amazon SageMaker) is where you create custom models when no ready-made AI service fits. It provides notebooks, built-in algorithms, managed training on scalable compute, hyperparameter tuning, several deployment options and monitoring. It also includes JumpStart for pre-trained and open-source models and low-code tools such as Canvas. Choose it when the stem stresses a custom model, your own data and algorithm, or full control.","example":"A retailer trains a custom demand model on its own sales data and deploys it to a SageMaker AI endpoint.","cues":["build, train and deploy custom models","full control","entire ML lifecycle"],"confuse":[{"with":"Amazon Bedrock","diff":"Bedrock gives API access to pre-trained foundation models; SageMaker AI is for building and hosting your own models."},{"with":"AI services (Comprehend, Rekognition)","diff":"Pre-trained single-purpose APIs; no model building needed."}],"memory":"SageMaker = the ML workshop.","refs":["Exam guide 1.2.5"],"slice":"s1"},{"id":"s1-comprehend","domain":1,"task":"1.2","objective":"1.2.5","kind":"concept","tags":["hot"],"front":"What does Amazon Comprehend do?","answer":"Amazon Comprehend is a managed NLP service that extracts insights from text: sentiment, entities, key phrases, dominant language and PII, plus custom classification and custom entity recognition.","explain":"Comprehend reads text you already have and tells you what is in it; it does not generate new text. Common tasks are sentiment analysis of reviews, entity recognition (people, places, organizations), key phrase extraction and detecting personally identifiable information (PII). It needs no ML expertise. Amazon Comprehend Medical is a variant for clinical text. Topic modeling still appears in older questions but is no longer available to new customers (AWS suggests Amazon Bedrock LLMs instead).","example":"Analyze 50,000 product reviews to find which ones are negative and which products they mention.","cues":["sentiment analysis","extract entities","key phrases","detect PII in text"],"confuse":[{"with":"Amazon Textract","diff":"Textract pulls text out of scanned documents; Comprehend analyzes the meaning of text."},{"with":"Amazon Bedrock","diff":"Bedrock generates text; Comprehend classifies and extracts from text."}],"memory":"Comprehend = comprehension of text.","refs":["Exam guide 1.2.5","https://docs.aws.amazon.com/comprehend/latest/dg/comprehend-availability-change.html"],"slice":"s1"},{"id":"s1-lex","domain":1,"task":"1.2","objective":"1.2.5","kind":"concept","tags":["hot"],"front":"What does Amazon Lex do?","answer":"Amazon Lex builds conversational interfaces (chatbots and voice bots) for applications, using automatic speech recognition (ASR) and natural language understanding (NLU).","explain":"Lex bots are designed around intents (what the user wants, such as BookHotel) and slots (the details needed, such as city and date). Lex understands typed or spoken input, asks follow-up questions to fill slots and can call AWS Lambda to fulfill the request. It integrates with contact centers such as Amazon Connect. Pick Lex when the stem says build a chatbot or voice bot for customer self-service.","example":"A bank's phone line lets customers say check my balance, and a Lex bot handles it without a human agent.","cues":["chatbot","voice bot","conversational interface","intents and slots"],"confuse":[{"with":"Amazon Polly","diff":"Polly only speaks text aloud; Lex understands and converses."},{"with":"Amazon Bedrock Agents","diff":"Bedrock Agents use an FM to plan multi-step actions; Lex is intent-and-slot conversation design."}],"memory":"Lex = the chatbot builder (intents and slots).","refs":["Exam guide 1.2.5","https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html"],"slice":"s1"},{"id":"s1-ml-pipeline-stages","domain":1,"task":"1.3","objective":"1.3.1","kind":"concept","tags":[],"front":"What are the stages of an ML pipeline, in order?","answer":"Business goal and problem framing, data collection, exploratory data analysis (EDA), data pre-processing, feature engineering, model training, hyperparameter tuning, evaluation, deployment, and monitoring with retraining.","explain":"EDA means exploring data with statistics and charts to understand it. Pre-processing cleans data (missing values, duplicates, formats). Feature engineering creates or selects the input columns (features) that help the model most. Hyperparameter tuning searches settings such as learning rate for the best result. Evaluation checks the model on held-out test data before deployment, and monitoring watches production performance and triggers retraining.","example":"Churn project: define churn, gather usage logs, explore, clean, create days since last login feature, train, tune, evaluate, deploy, monitor.","cues":["feature engineering","exploratory data analysis","hyperparameter tuning","evaluate before deploying"],"confuse":[{"with":"Training vs validation vs test sets","diff":"Training data teaches, validation data tunes hyperparameters and catches overfitting, test data gives the final unbiased score."}],"memory":"Collect, explore, clean, engineer, train, tune, evaluate, deploy, monitor.","refs":["Exam guide 1.3.1"],"slice":"s1"},{"id":"s1-sagemaker-features-by-stage","domain":1,"task":"1.3","objective":"1.3.4","kind":"concept","tags":["hot"],"front":"Which Amazon SageMaker AI feature matches each ML pipeline stage?","answer":"Label: Ground Truth. Prepare: Data Wrangler. Store features: Feature Store. Build: Studio, Canvas, Autopilot, JumpStart. Version and approve: Model Registry. Automate: Pipelines. Watch production: Model Monitor.","explain":"SageMaker AI is a suite of tools, and the exam names a stage and expects the matching tool. Ground Truth creates labeled data with human workers. Data Wrangler cleans and transforms data visually. Feature Store centrally stores features for reuse in training and inference. Studio is the web IDE, Canvas is no-code ML for analysts, Autopilot is AutoML (automatically trying algorithms and settings), Model Registry catalogs model versions, Pipelines automates workflows (CI/CD for ML; CI/CD means continuous integration and delivery, automatically building, testing and releasing) and Model Monitor detects drift (production data changing compared with training data). Today Data Wrangler and Autopilot are both accessed through SageMaker Canvas, and Ground Truth and Model Monitor are closed to new customers, but the exam still names each tool for its stage.","example":"","cues":["label data","prepare data without code","reuse features","catalog model versions","detect drift"],"confuse":[{"with":"SageMaker Clarify","diff":"Clarify detects bias and explains predictions; covered in the responsible AI domain."}],"memory":"Label, wrangle, store, build, register, pipeline, monitor.","refs":["Exam guide 1.3.4","https://docs.aws.amazon.com/sagemaker/latest/dg/data-wrangler.html","https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-automate-model-development.html","https://docs.aws.amazon.com/sagemaker/latest/dg/sms.html","https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-availability-change.html"],"slice":"s1"},{"id":"s1-bedrock-quick-kiro-fit","domain":1,"task":"1.3","objective":"1.3.4","kind":"concept","tags":["new2026","hot"],"front":"Where do Amazon Bedrock, Amazon Quick and Kiro fit in an AI/ML solution?","answer":"Amazon Bedrock provides API access to foundation models for building GenAI apps; Amazon Quick is an AI workspace for business users to analyze data and automate tasks; Kiro is an agentic IDE for spec-driven development.","explain":"Bedrock is the fully managed service to use FMs from Amazon and other providers without managing infrastructure. Amazon Quick evolved from Amazon QuickSight and adds chat, agents, research, flows and automations over company data, with Quick Sight still providing dashboards. Kiro is an AI development environment that plans features as specs (requirements, design, tasks) and writes code with an agent. SageMaker AI remains the choice for building custom ML models.","example":"A developer builds a claims assistant in Kiro that calls a Bedrock model; managers view claim trends and ask questions in Amazon Quick.","cues":["access foundation models through an API","business users analyze data with natural language","agentic IDE","spec-driven development"],"confuse":[{"with":"Amazon Q Developer","diff":"Older AWS coding assistant; its IDE plugins reach end of support on April 30, 2027 and AWS points users to Kiro."},{"with":"Amazon QuickSight","diff":"Former name; now Amazon Quick Sight, a feature within Amazon Quick."}],"memory":"Bedrock builds with FMs, Quick serves the business, Kiro writes the code.","refs":["Exam guide 1.3.4","https://docs.aws.amazon.com/quick/latest/userguide/what-is.html","https://kiro.dev/docs/","https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/what-is.html"],"slice":"s1"},{"id":"s1-model-sources","domain":1,"task":"1.3","objective":"1.3.2","kind":"concept","tags":[],"front":"Where can a foundation model or ML model come from?","answer":"Use a pre-trained model (open-source or proprietary) and optionally customize it, or train a custom model from scratch on your own data; pre-trained models are faster and cheaper, custom training gives the most control.","explain":"Open-source pre-trained models (for example Llama or Mistral families) have publicly available weights you can download, fine-tune and host, such as through Amazon SageMaker JumpStart. Some open-weight models are also available as a managed API in Amazon Bedrock. Proprietary FMs (for example Anthropic Claude or Amazon Nova) are used through an API such as Amazon Bedrock. Training a model from scratch requires massive data, compute, time and expertise, so it is rarely the exam's answer unless the data or use case is truly unique.","example":"A startup fine-tunes an open-source model from JumpStart instead of spending months training its own LLM.","cues":["pre-trained model","open-source","train from scratch","LEAST effort"],"confuse":[{"with":"Fine-tuning","diff":"Fine-tuning adapts an existing pre-trained model; training from scratch starts with no learned knowledge."}],"memory":"Borrow (pre-trained), adapt (fine-tune), or build (from scratch).","refs":["Exam guide 1.3.2"],"slice":"s1"},{"id":"s1-sagemaker-jumpstart","domain":1,"task":"1.3","objective":"1.3.2","kind":"concept","tags":[],"front":"What is Amazon SageMaker JumpStart?","answer":"Amazon SageMaker JumpStart is the ML hub in SageMaker AI that offers pre-trained models, including open-source foundation models, plus solution templates you can deploy, fine-tune and evaluate in your own account with a few clicks.","explain":"A model hub is a catalog of ready-made models. JumpStart lets you pick a pre-trained model, optionally fine-tune it on your data (further train it for your task), and deploy it to a SageMaker AI endpoint that runs in your AWS account. It also provides solution templates and example notebooks for common use cases. The exam uses it as the quick way to start from a pre-trained model while keeping control of the hosting.","example":"A team deploys an open-source text model from JumpStart to its own endpoint, then fine-tunes it on support tickets.","cues":["pre-trained model hub","deploy an open-source model quickly","fine-tune in your own account","solution templates"],"confuse":[{"with":"Amazon Bedrock","diff":"Bedrock is a serverless managed API with no endpoint to manage; JumpStart deploys the model on a SageMaker AI endpoint you manage."}],"memory":"JumpStart = jump-start your project with a ready-made model.","refs":["Exam guide 1.3.2","https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html"],"slice":"s1"},{"id":"s1-managed-vs-self-hosted","domain":1,"task":"1.3","objective":"1.3.3","kind":"concept","tags":["hot"],"front":"What is the difference between using a model through a managed API service and a self-hosted API?","answer":"A managed API service such as Amazon Bedrock runs and scales the model for you with pay-per-use pricing; a self-hosted API on a SageMaker AI endpoint or Amazon EC2 gives more control but you manage instances and scaling.","explain":"With a managed API you send a request and get a response; AWS runs and scales the model. Self-hosting means deploying model weights on compute you choose, which allows custom models, specific instance types and network isolation, at the cost of more operational overhead. Stems that stress LEAST operational overhead point to the managed API; stems that stress full control or a custom model point to self-hosting.","example":"Calling Claude through Amazon Bedrock is a managed API; running an open-source model on a SageMaker AI real-time endpoint is self-hosted.","cues":["LEAST operational overhead","full control over infrastructure","custom instance type"],"confuse":[],"memory":"Managed = rent the answer; self-hosted = run the kitchen.","refs":["Exam guide 1.3.3"],"slice":"s1"},{"id":"s1-mlops","domain":1,"task":"1.3","objective":"1.3.5","kind":"concept","tags":[],"front":"What is MLOps?","answer":"MLOps applies DevOps practices to machine learning to make model development repeatable, automated, scalable and production-ready, including experiment tracking, versioning, CI/CD, monitoring and retraining.","explain":"DevOps is a set of practices that automate building, testing and releasing software; CI/CD is the automated build-test-release pipeline. Without MLOps, models live in one person's notebook and cannot be rebuilt or trusted. Key ideas: experimentation (track runs, parameters and results), repeatable processes (automated pipelines), scalable systems, version control for data, code and models, managing technical debt (the future cost of shortcuts in ML systems), production readiness, model monitoring and automated retraining. On AWS, SageMaker Pipelines, Model Registry and Model Monitor are the main MLOps tools.","example":"Every week a pipeline pulls new data, retrains, evaluates, registers the new model version and deploys it only if it beats the current one.","cues":["repeatable","automate retraining","version models","production readiness","technical debt"],"confuse":[{"with":"DevOps","diff":"DevOps handles code only; MLOps also handles data, models and drift."}],"memory":"MLOps = DevOps plus data plus models.","refs":["Exam guide 1.3.5"],"slice":"s1"},{"id":"s1-data-drift-vs-concept-drift","domain":1,"task":"1.3","objective":"1.3.5","kind":"concept","tags":["hot"],"front":"What are data drift and concept drift?","answer":"Data drift is a change in the distribution of input data after deployment; concept drift is a change in the relationship between inputs and the correct output. Both degrade production models and are handled by monitoring and retraining.","explain":"A distribution is the typical spread of values in the data, for example the usual age range of customers. Data drift means the inputs look different from the training data. Concept drift means the same inputs now lead to a different correct answer because the world changed. Either way the model silently gets worse, which is why MLOps includes production monitoring (on the exam, Amazon SageMaker Model Monitor) and scheduled or triggered retraining.","example":"Data drift: a loan app suddenly receives many younger applicants than it was trained on. Concept drift: after a recession, the same income level now predicts default differently.","cues":["accuracy degrades over time","production data differs from training data","customer behavior changed","retrain the model"],"confuse":[{"with":"Overfitting","diff":"Overfitting shows up before deployment as a train versus test gap; drift appears later in production."}],"memory":"Data drift: the inputs moved. Concept drift: the rules of the game moved.","refs":["Exam guide 1.3.5","https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-data-quality.html"],"slice":"s1"},{"id":"s1-accuracy-confusion-matrix-auc","domain":1,"task":"1.3","objective":"1.3.6","kind":"concept","tags":[],"front":"What are accuracy, the confusion matrix and AUC?","answer":"Accuracy is the share of predictions that are correct; a confusion matrix counts true and false positives and negatives; AUC measures how well a classifier separates classes (closer to 1 is better).","explain":"These are classification metrics. Accuracy is misleading on imbalanced data: if 99 percent of transactions are legitimate, a model that always says legitimate scores 99 percent but catches no fraud. The confusion matrix is the source table for precision, recall and F1. A threshold is the probability cutoff for calling something positive; the ROC curve plots the true positive rate against the false positive rate at every threshold, and AUC is the area under that curve, useful for comparing models.","example":"Out of 100 predictions, 90 correct means 90 percent accuracy.","cues":["imbalanced dataset","true positives and false positives","compare classifiers across thresholds"],"confuse":[{"with":"Regression metrics","diff":"Numeric predictions use error metrics such as RMSE, MAE or R squared instead of accuracy or F1."}],"memory":"Confusion matrix = the scoreboard every metric reads from.","refs":["Exam guide 1.3.6"],"slice":"s1"},{"id":"s1-precision-recall-f1","domain":1,"task":"1.3","objective":"1.3.6","kind":"concept","tags":["hot"],"front":"What are precision, recall and F1 score, and when does each matter?","answer":"Precision is how many predicted positives were truly positive (minimize false alarms); recall is how many actual positives were found (minimize misses); F1 score is the harmonic mean that balances both.","explain":"A false positive is a false alarm; a false negative is a missed case. When missing a positive is costly (fraud, cancer screening) you want high recall. When a false alarm is costly (sending a real email to spam) you want high precision. The harmonic mean is a kind of average that stays low if either precision or recall is low, so F1 rewards models that do well on both. F1 is the single number to use when both matter or the classes are imbalanced.","example":"Of 100 transactions flagged as fraud, 80 are fraud: precision 80 percent. Of 100 actual frauds, 60 were flagged: recall 60 percent.","cues":["cost of missing a positive is high","minimize false positives","balance precision and recall","imbalanced classes"],"confuse":[{"with":"Accuracy","diff":"Accuracy counts all correct predictions and hides poor performance on the rare class."}],"memory":"Recall = recall all the sick patients. Precision = be precise when you raise the alarm.","refs":["Exam guide 1.3.6"],"slice":"s1"},{"id":"s1-business-metrics","domain":1,"task":"1.3","objective":"1.3.6","kind":"concept","tags":[],"front":"Which business metrics evaluate whether an ML model is worth it?","answer":"Business metrics such as return on investment (ROI), cost per user, development costs, customer feedback and conversion rate measure the model's business value, separate from technical accuracy.","explain":"A model can be very accurate and still lose money if it costs more to build and run than it saves. ROI compares benefit with total cost; cost per user shows unit economics as usage grows; customer feedback and satisfaction show whether users actually like the result. The exam may ask which metric a business leader should track, and the answer is a business metric, not F1.","example":"A recommendation model raises average order value by 5 dollars and costs 0.02 dollars per user per month: strong ROI.","cues":["return on investment","cost per user","customer feedback","business value"],"confuse":[{"with":"Model performance metrics","diff":"Accuracy, precision, recall and F1 measure prediction quality, not business impact."}],"memory":"Accurate is not the same as profitable.","refs":["Exam guide 1.3.6"],"slice":"s1"},{"id":"s1-realtime-endpoint-scenario","domain":1,"task":"1.1","objective":"1.1.3","kind":"scenario","tags":[],"front":"A payment app must score each transaction for fraud in milliseconds while the customer waits, with steady traffic all day. Which SageMaker AI deployment option fits?","answer":"A SageMaker AI real-time inference endpoint, a persistent endpoint that returns low-latency predictions for each request.","explain":"Real-time inference keeps the model loaded on always-on instances, so each request gets an immediate answer. You pay for the instances while the endpoint runs, which is efficient when traffic is steady. It is the default choice when a user or application is waiting synchronously for the prediction.","example":"","cues":["milliseconds","while the customer waits","steady traffic","low latency"],"confuse":[{"with":"Serverless Inference","diff":"Serverless also answers synchronously but suits intermittent traffic and can have cold starts."}],"memory":"Someone is waiting: real-time.","refs":["Exam guide 1.1.3"],"slice":"s1"},{"id":"s1-serverless-inference-scenario","domain":1,"task":"1.1","objective":"1.1.3","kind":"scenario","tags":["new2026"],"front":"An internal HR tool calls an ML model only a few times per day with long idle periods, and the team wants to avoid managing or paying for idle instances. Which SageMaker AI option is MOST cost-effective?","answer":"Amazon SageMaker Serverless Inference, which automatically provisions and scales compute, scales to zero when idle, and charges only for use.","explain":"Serverless means you do not choose or manage servers; AWS allocates compute when requests arrive. It is ideal for intermittent or unpredictable traffic that can tolerate cold starts, which is the extra delay when a request arrives after a quiet period. For steady high traffic, a real-time endpoint is usually better.","example":"","cues":["intermittent traffic","idle periods","no infrastructure to manage","can tolerate cold starts"],"confuse":[{"with":"Asynchronous Inference","diff":"Async is for large payloads and long processing, not for small infrequent requests."}],"memory":"Rarely used: go serverless.","refs":["Exam guide 1.1.3"],"slice":"s1"},{"id":"s1-async-inference-scenario","domain":1,"task":"1.1","objective":"1.1.3","kind":"scenario","tags":["new2026"],"front":"A media company submits large video files for ML analysis that can take up to 30 minutes each, and users can wait for a notification. Which SageMaker AI option fits?","answer":"Amazon SageMaker Asynchronous Inference, which queues requests with large payloads (up to 1 GB) and long processing times (up to one hour) and returns results to Amazon S3.","explain":"Asynchronous means the caller does not wait on an open connection: the request goes into a queue, the input and output live in Amazon S3, and an Amazon SNS notification can report completion. Async endpoints can scale the instance count to zero when no requests are waiting, saving cost. It sits between real-time (instant, small payload) and batch (whole dataset, offline).","example":"","cues":["large payloads","long processing time","near real-time","queue requests"],"confuse":[{"with":"Batch Transform","diff":"Batch processes a whole dataset on a schedule without an endpoint; async handles individual requests as they arrive."}],"memory":"Big and slow, one at a time: async.","refs":["Exam guide 1.1.3","https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html"],"slice":"s1"},{"id":"s1-batch-transform-scenario","domain":1,"task":"1.1","objective":"1.1.3","kind":"scenario","tags":[],"front":"Every night a retailer needs predictions for its entire 20 million-row customer table in Amazon S3, and nobody needs results until morning. Which SageMaker AI option is MOST cost-effective?","answer":"SageMaker AI Batch Transform (batch inference), which runs predictions on an entire dataset offline without a persistent endpoint.","explain":"Batch inference processes many records at once and writes results to storage. Batch Transform starts compute for the job, reads the dataset from Amazon S3, writes predictions back and shuts down, so you pay only for the job duration. Choose it when latency does not matter and the input is a large, already available dataset.","example":"","cues":["entire dataset","no need for immediate results","offline","no persistent endpoint"],"confuse":[{"with":"Real-time endpoint","diff":"Real-time keeps instances running for instant answers; batch runs once and stops."}],"memory":"Overnight and everything: batch.","refs":["Exam guide 1.1.3"],"slice":"s1"},{"id":"s1-transcribe-scenario","domain":1,"task":"1.2","objective":"1.2.5","kind":"scenario","tags":["hot"],"front":"A call center wants to convert thousands of recorded customer calls into searchable text. Which AWS service should they use?","answer":"Amazon Transcribe, which uses automatic speech recognition to convert speech in audio or video into text.","explain":"Speech-to-text is called automatic speech recognition (ASR). Amazon Transcribe handles batch and real-time streaming audio, can label different speakers (speaker diarization), supports custom vocabularies and can redact PII. Amazon Transcribe Call Analytics adds call center insights, and Transcribe Medical targets clinical speech. If the stem says audio in, text out, choose Transcribe.","example":"Generate subtitles for training videos automatically.","cues":["convert speech to text","call recordings","subtitles","transcripts"],"confuse":[{"with":"Amazon Polly","diff":"Polly is the reverse: text to speech."}],"memory":"TranSCRIBE = a scribe writes down what is said.","refs":["Exam guide 1.2.5"],"slice":"s1"},{"id":"s1-polly-scenario","domain":1,"task":"1.2","objective":"1.2.5","kind":"scenario","tags":["hot"],"front":"A news website wants to offer an audio version of every article, read in a natural-sounding voice. Which AWS service should it use?","answer":"Amazon Polly, a text-to-speech service that turns text into lifelike speech.","explain":"Text-to-speech (TTS) converts written text into audio. Polly offers many voices and languages, including neural voices that sound more natural, and supports SSML (a markup to control pronunciation, pauses and emphasis). It is used for accessibility, e-learning, IVR phone menus and reading apps. Output direction is the key: text in, audio out.","example":"An e-learning platform generates narration for 200 lessons without hiring voice actors.","cues":["text to speech","read aloud","lifelike voice","audio version"],"confuse":[{"with":"Amazon Transcribe","diff":"Transcribe is speech to text, the opposite direction."},{"with":"Amazon Nova Sonic","diff":"Nova Sonic is a speech-to-speech foundation model for real-time voice conversations, not simple read-aloud."}],"memory":"Polly the parrot talks.","refs":["Exam guide 1.2.5"],"slice":"s1"},{"id":"s1-rekognition-scenario","domain":1,"task":"1.2","objective":"1.2.4","kind":"scenario","tags":["hot"],"front":"A social media app must automatically flag inappropriate images and videos that users upload. Which AWS service meets this need with no ML expertise?","answer":"Amazon Rekognition, which analyzes images and videos to detect objects, faces, text and unsafe content (content moderation).","explain":"Rekognition is AWS's pre-trained computer vision service. It detects labels (car, dog, beach), faces and facial comparison, celebrities, text in images, and inappropriate content, for both stored and streaming video. Custom Labels lets you train it to find your own objects with a small labeled set. Any image or video analysis stem points here.","example":"Verify a user's selfie matches the photo on their ID during onboarding.","cues":["images and videos","content moderation","face comparison","detect objects"],"confuse":[{"with":"Amazon Textract","diff":"Textract is specialized for documents and forms, not general image analysis."}],"memory":"Rekognition = recognize what is in the picture.","refs":["Exam guide 1.2.4"],"slice":"s1"},{"id":"s1-textract-scenario","domain":1,"task":"1.2","objective":"1.2.4","kind":"scenario","tags":["hot"],"front":"An insurer receives thousands of scanned claim forms and wants to extract the field values and tables automatically. Which AWS service should it use?","answer":"Amazon Textract, which extracts printed and handwritten text, forms (key-value pairs) and tables from scanned documents.","explain":"Textract goes beyond simple OCR (optical character recognition, turning an image of text into characters): it understands document structure, so it returns a field name with its value and preserves table rows and columns. It works on PDFs and images such as invoices, IDs, tax forms and receipts. Pair it with Comprehend when you then need to analyze the extracted text.","example":"Pull the invoice number, date and total from 20,000 supplier invoices into a database.","cues":["scanned documents","forms and tables","extract text from PDFs","handwriting"],"confuse":[{"with":"Amazon Rekognition","diff":"Rekognition can read short text in scenes; Textract is built for documents and forms."},{"with":"Amazon Comprehend","diff":"Comprehend analyzes meaning; Textract extracts the raw text and structure."}],"memory":"TEXTract = extracts text.","refs":["Exam guide 1.2.4"],"slice":"s1"},{"id":"s1-personalize-scenario","domain":1,"task":"1.2","objective":"1.2.4","kind":"scenario","tags":[],"front":"An online retailer wants to show each shopper real-time product recommendations based on their browsing history, without building ML models. Which AWS service fits?","answer":"Amazon Personalize, a fully managed ML service that uses your data to generate real-time personalized item recommendations (and user segments) without ML expertise.","explain":"A recommendation system suggests items a user is likely to want, based on user behavior (clicks, purchases), item data and user data. Personalize trains and hosts the recommendation model for you, supports real-time and batch recommendations, and can personalize rankings or find similar items. Look for personalization, recommendations, or customers who bought this also bought.","example":"A streaming service shows each viewer a different you might also like row.","cues":["personalized recommendations","recommend products","user behavior","similar items"],"confuse":[{"with":"Amazon Kendra","diff":"Kendra answers search queries; Personalize proposes items without a query."}],"memory":"Personalize = personal shopper.","refs":["Exam guide 1.2.4","https://docs.aws.amazon.com/personalize/latest/dg/what-is-personalize.html"],"slice":"s1"},{"id":"s1-kendra-scenario","domain":1,"task":"1.2","objective":"1.2.4","kind":"scenario","tags":["legacy","hot"],"front":"Employees need to type natural-language questions and get back the exact matching passages from manuals, wikis and SharePoint sites, with ranked results and no generated answer. Which AWS service fits?","answer":"Amazon Kendra, an intelligent enterprise search service that uses ML to return precise answers from documents across many data sources.","explain":"Enterprise search means searching an organization's internal content rather than the public web. Kendra understands natural-language questions, connects to many repositories through connectors and ranks the most relevant passages. It frequently appears as the retriever in a RAG design, feeding relevant passages to an FM. It is not in the v1.1 in-scope list: Amazon Kendra entered maintenance mode on June 30, 2026 and has been closed to new customers since July 30, 2026, and AWS recommends Amazon Bedrock Knowledge Bases (managed RAG) instead; Amazon Quick Index also grounds answers in company documents. Pick Kendra only if no in-scope option fits.","example":"An HR team asks how many vacation days carry over and gets the exact paragraph from the policy PDF.","cues":["enterprise search","natural language questions over internal documents","search across repositories","return the exact passage"],"confuse":[{"with":"Amazon Bedrock Knowledge Bases","diff":"Knowledge Bases is managed RAG that generates an answer with an FM; Kendra is search that retrieves passages."}],"memory":"Kendra = company Google.","refs":["Exam guide 1.2.4","https://docs.aws.amazon.com/kendra/latest/dg/kendra-availability-change.html","https://docs.aws.amazon.com/quick/latest/userguide/what-is.html"],"slice":"s1"},{"id":"s1-forecast-frauddetector-legacy","domain":1,"task":"1.2","objective":"1.2.4","kind":"scenario","tags":["legacy"],"front":"A retailer with no ML expertise wants to forecast weekly product demand from three years of historical sales data. Which AWS service should it use?","answer":"Amazon SageMaker Canvas, the no-code ML feature of Amazon SageMaker AI that builds time-series forecasting models; older questions may key Amazon Forecast, which is no longer available to new customers.","explain":"Amazon Forecast was the managed time-series forecasting service; it is closed to new customers and AWS points them to SageMaker Canvas. Amazon Fraud Detector (closed to new customers on November 7, 2025) was the managed fraud service; AWS now suggests SageMaker AI, AutoGluon and AWS WAF. Both still appear in older practice questions as options, so recognize what they did.","example":"Old exam answer: forecast demand with Amazon Forecast, detect fake account sign-ups with Amazon Fraud Detector.","cues":["forecast demand","time-series","detect online fraud","no ML expertise"],"confuse":[{"with":"Amazon Personalize","diff":"Personalize recommends items; Forecast predicted future values over time."}],"memory":"Forecast and Fraud Detector are closed to new customers; Canvas is the modern forecasting path.","refs":["Exam guide 1.2.4","https://docs.aws.amazon.com/forecast/latest/dg/what-is-forecast.html","https://docs.aws.amazon.com/frauddetector/latest/ug/what-is-frauddetector.html","https://aws.amazon.com/blogs/machine-learning/transition-your-amazon-forecast-usage-to-amazon-sagemaker-canvas/"],"slice":"s1"},{"id":"s1-ground-truth-scenario","domain":1,"task":"1.3","objective":"1.3.4","kind":"scenario","tags":["hot"],"front":"A company has 200,000 unlabeled product images and needs accurate labels to train a classification model, using human reviewers. Which AWS service should it use?","answer":"Amazon SageMaker Ground Truth, which builds high-quality labeled datasets using human labelers and optional automated labeling.","explain":"Supervised models need labels, and Ground Truth manages the labeling workflow. Workers can be your own employees, a third-party vendor or Amazon Mechanical Turk (a public crowd workforce), and active learning can auto-label easy items to cut cost. Ground Truth is no longer open to new customers (existing customers are unaffected), but it remains the exam answer for human data labeling. Stems mention labeling, annotation or human labelers.","example":"Drawing bounding boxes around cars in dashcam images for a self-driving dataset.","cues":["label training data","human annotators","bounding boxes","labeled dataset"],"confuse":[{"with":"Amazon Augmented AI (A2I)","diff":"A2I adds human review of model predictions after deployment; Ground Truth labels training data before training."}],"memory":"Ground Truth creates the ground truth (labels).","refs":["Exam guide 1.3.4","https://docs.aws.amazon.com/sagemaker/latest/dg/sms.html"],"slice":"s1"},{"id":"s1-data-wrangler-feature-store-scenario","domain":1,"task":"1.3","objective":"1.3.4","kind":"scenario","tags":[],"front":"Data scientists spend weeks cleaning data, and different teams keep recreating the same customer features. Which two SageMaker AI features address these problems?","answer":"Amazon SageMaker Data Wrangler for visual data preparation and feature engineering, and Amazon SageMaker Feature Store to store and share features for reuse across teams and models.","explain":"Data Wrangler lets you import, explore, clean and transform data with built-in transformations and little code, then export the flow. Feature Store is a central repository for features, with an online store for low-latency inference and an offline store for training, so every team uses the same feature definitions. Together they cut data preparation time and prevent inconsistent features.","example":"The customer lifetime value feature is computed once, stored in Feature Store, and reused by marketing and fraud models.","cues":["clean and transform data","reuse features across teams","consistent features for training and inference"],"confuse":[{"with":"AWS Glue DataBrew","diff":"DataBrew is a general visual data prep tool for analytics; Data Wrangler lives inside SageMaker AI for ML."}],"memory":"Wrangle the data, store the features.","refs":["Exam guide 1.3.4"],"slice":"s1"},{"id":"s1-canvas-autopilot-scenario","domain":1,"task":"1.3","objective":"1.3.4","kind":"scenario","tags":[],"front":"Business analysts with no coding or ML experience want to build a churn prediction model from a spreadsheet. Which SageMaker AI capability fits best?","answer":"Amazon SageMaker Canvas, a visual no-code interface that lets business users build ML models and generate predictions.","explain":"Canvas lets analysts import data, pick the column to predict and get a model through point-and-click, including time-series forecasts. Under the hood it uses automated machine learning (AutoML), which automatically tries algorithms and settings; SageMaker Autopilot, the AutoML capability that builds, trains and tunes the best model, now runs inside Canvas. Developers who want code and full control use SageMaker Studio instead.","example":"A marketing analyst uploads a CSV of past customers and predicts which current customers are likely to cancel.","cues":["no-code","business analysts","no ML expertise","automatically build the best model"],"confuse":[{"with":"SageMaker Studio","diff":"Studio is the full IDE for data scientists and engineers who write code."}],"memory":"Canvas = paint a model without code.","refs":["Exam guide 1.3.4","https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-automate-model-development.html"],"slice":"s1"},{"id":"s1-model-monitor-scenario","domain":1,"task":"1.3","objective":"1.3.5","kind":"scenario","tags":["hot"],"front":"A deployed fraud model's accuracy is slowly dropping because customer behavior has changed since training. Which SageMaker AI feature detects this automatically?","answer":"Amazon SageMaker Model Monitor, which continuously monitors production models for data drift and model quality drift and raises alerts.","explain":"Drift means production data or the relationship between inputs and outputs has changed compared with training data, so predictions get worse over time. Model Monitor compares live traffic against a baseline and can track data quality, model quality, bias drift and feature attribution drift, sending metrics and alerts to Amazon CloudWatch. The usual follow-up is to retrain the model on fresh data, ideally through an automated pipeline. Note: Model Monitor is no longer open to new customers (existing customers are unaffected); AWS points new users to open-source SageMaker AI monitoring solutions with Amazon CloudWatch and Quick Sight dashboards, but on the exam Model Monitor is still the answer for drift detection.","example":"After a holiday season changes shopping patterns, Model Monitor alerts the team, and SageMaker Pipelines retrains the model.","cues":["drift","model performance degrades over time","monitor in production","trigger retraining"],"confuse":[{"with":"SageMaker Clarify","diff":"Clarify explains predictions and measures bias; Model Monitor watches ongoing production drift (it can use Clarify for bias drift)."}],"memory":"Model Monitor = health check after go-live.","refs":["Exam guide 1.3.5","https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-availability-change.html"],"slice":"s1"},{"id":"s1-model-registry-pipelines-scenario","domain":1,"task":"1.3","objective":"1.3.5","kind":"scenario","tags":[],"front":"An ML team wants to automate retraining, keep track of every model version, and require a manager's approval before a new version is deployed. Which SageMaker AI features should it use?","answer":"Amazon SageMaker Pipelines to automate the ML workflow (CI/CD for ML) and Amazon SageMaker Model Registry to catalog model versions and manage their approval status before deployment.","explain":"Pipelines is a workflow orchestration service: it chains steps such as data preparation, training, evaluation and registration so they run the same way every time. Model Registry is a catalog of model versions with metadata such as training metrics, lineage and an approval status (for example pending, approved or rejected). Together they give repeatable, auditable MLOps: a pipeline registers each new version, and only approved versions are deployed.","example":"A weekly pipeline retrains a churn model and registers version 12 as pending; after review it is marked approved and deployed automatically.","cues":["automate the ML workflow","track model versions","approval before deployment","repeatable retraining"],"confuse":[{"with":"SageMaker Model Monitor","diff":"Model Monitor detects drift in production; Pipelines and Model Registry automate and govern building and releasing models."}],"memory":"Pipelines builds it, Registry files and approves it.","refs":["Exam guide 1.3.5","https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines.html","https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry.html"],"slice":"s1"},{"id":"s1-inference-types-compare","domain":1,"task":"1.1","objective":"1.1.3","kind":"compare","tags":["new2026"],"front":"Real-time vs batch vs asynchronous vs serverless inference: how do you tell them apart?","answer":"Real-time: persistent endpoint, low latency, steady traffic. Serverless: no instances to manage, intermittent traffic, tolerates cold starts. Asynchronous: large payloads or long processing, queued. Batch: large dataset processed offline, no endpoint.","explain":"Inference is using a trained model to get predictions, and AWS offers different ways to serve it. In Amazon SageMaker AI these map to real-time endpoints, Serverless Inference, Asynchronous Inference and Batch Transform. The exam gives traffic pattern, payload size and latency need; you map those to the option. Look for words like immediately, spiky, large files, overnight.","example":"Fraud check at checkout: real-time. Internal tool used a few times a day: serverless. 500 MB video analysis: asynchronous. Scoring all 10 million customers every night: batch.","cues":["low latency","intermittent or unpredictable traffic","large payloads, long processing","entire dataset, no persistent endpoint"],"confuse":[{"with":"Bedrock batch inference","diff":"Amazon Bedrock also offers batch inference for FMs; same idea, different service."}],"memory":"Now (real-time), sometimes (serverless), big and slow (async), all at once (batch).","refs":["Exam guide 1.1.3","https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html"],"slice":"s1"},{"id":"s1-hierarchy-ai-ml-dl-genai-agentic","domain":1,"task":"1.1","objective":"1.1.2","kind":"compare","tags":["new2026"],"front":"AI vs ML vs deep learning vs generative AI vs agentic AI: how are they related and how do they differ?","answer":"They are nested: AI contains ML, ML contains deep learning, and generative AI is deep learning that creates new content. Agentic AI builds on generative AI to plan and take actions toward a goal.","explain":"AI is any machine intelligence, including hand-coded rules. ML learns from data. Deep learning is ML with many-layered neural networks. Generative AI uses large deep learning models (foundation models) to produce new text, images, audio or code. Agentic AI wraps a foundation model with tools, memory and planning so it can execute multi-step tasks. The exam asks you to classify a described system by its output: rules, a prediction, new content, or completed actions.","example":"Chess engine with hand-written rules: AI. Churn predictor: ML. Face recognition: deep learning. Blog post writer: GenAI. Assistant that researches, books and emails: agentic AI.","cues":["outputs a label or number","creates new content","takes actions autonomously","subset of"],"confuse":[{"with":"Foundation model","diff":"An FM is the large pre-trained model inside GenAI and agentic systems, not a separate layer of the hierarchy."}],"memory":"Nested dolls: AI, ML, deep learning, GenAI, and agentic AI as GenAI with hands.","refs":["Exam guide 1.1.2"],"slice":"s1"},{"id":"s1-bias-two-meanings","domain":1,"task":"1.1","objective":"1.1.1","kind":"compare","tags":["hot"],"front":"Statistical bias vs societal or data bias: how do you tell which one the question means?","answer":"Statistical bias (high bias) means the model is too simple and underfits; societal or data bias means the model treats some groups unfairly, usually because of unrepresentative training data.","explain":"The word bias appears in two contexts. In the bias-variance tradeoff, high bias equals underfitting and high variance equals overfitting. In responsible AI, bias means unfair skew against a demographic group, measured with fairness metrics and fixed with more representative data. Read the stem: talk of training and test accuracy means the statistical sense; talk of groups, demographics or fairness means the societal sense.","example":"Model scores 55 percent on training and test data: high bias (underfitting). Model approves fewer loans for one age group: fairness bias.","cues":["high bias, high variance","demographic group","underfitting","fairness"],"confuse":[{"with":"Variance","diff":"High variance means overfitting: great on training data, poor on new data."}],"memory":"Bias with variance = fit problem. Bias with people = fairness problem.","refs":["Exam guide 1.1.1"],"slice":"s1"},{"id":"s1-regression-classification-clustering","domain":1,"task":"1.2","objective":"1.2.3","kind":"compare","tags":[],"front":"Regression vs classification vs clustering: how do you tell them apart?","answer":"Regression predicts a continuous number, classification predicts a category from predefined labels (supervised), and clustering groups unlabeled data into similar groups without predefined labels (unsupervised).","explain":"Ask what the output looks like. A number on a scale (price, temperature, demand) means regression. A choice among known classes (spam or not, cat or dog, approve or deny) means classification; with two classes it is binary classification. Groups the business did not define in advance means clustering, for example k-means customer segmentation.","example":"Predict next month's revenue: regression. Predict if an email is spam: classification. Discover customer segments: clustering.","cues":["predict a numeric value","predict a category","group similar customers without labels"],"confuse":[{"with":"Anomaly detection","diff":"Anomaly detection flags rare outliers rather than assigning every item to a group."}],"memory":"How much = regression, which one = classification, who is alike = clustering.","refs":["Exam guide 1.2.3"],"slice":"s1"},{"id":"s1-traditional-ml-vs-fm","domain":1,"task":"1.2","objective":"1.2.6","kind":"compare","tags":["new2026"],"front":"Traditional ML model vs foundation model (FM): how do you decide?","answer":"Choose traditional ML for narrow, structured-data predictions that require explainability, regulatory auditability, low latency or low cost; choose an FM for broad language or content tasks with unstructured data and little labeled data.","explain":"A traditional ML model (for example gradient boosted trees, many small decision trees combined, such as XGBoost, on tabular data) is small, cheap to run, consistent and easier to explain, which regulators often require for decisions like credit approval. An FM is huge and general, great at summarizing, drafting, conversation and reasoning over text or images, but costs more per request, can hallucinate (produce confident but false output) and is harder to explain. Operational constraints such as strict latency budgets or edge devices also favor small traditional models.","example":"Loan approval with a legal duty to explain each decision: traditional ML. Summarizing customer emails: FM.","cues":["explainability requirements","regulated decision","tabular data","generate or summarize text"],"confuse":[{"with":"Rule-based code","diff":"If no prediction is needed at all, use deterministic code, not ML or an FM."}],"memory":"Small, explainable, structured: classic ML. Broad, creative, unstructured: FM.","refs":["Exam guide 1.2.6"],"slice":"s1"},{"id":"s1-speech-text-services-compare","domain":1,"task":"1.2","objective":"1.2.5","kind":"compare","tags":["hot"],"front":"Amazon Transcribe vs Polly vs Translate vs Comprehend vs Lex: how do you tell them apart?","answer":"Transcribe converts speech to text, Polly converts text to speech, Translate converts text between languages, Comprehend analyzes text for insights, and Lex runs conversations with chatbots and voice bots.","explain":"These single-purpose AI services are often chained: for a multilingual call center, Transcribe turns calls into text, Translate converts it to English, Comprehend scores sentiment, and Polly speaks replies. Lex adds conversational logic on top. Watch the input and output types in the stem: audio to text, text to audio, language to language, text to insight, or conversation.","example":"Analyze sentiment of Spanish phone calls: Transcribe, then Translate, then Comprehend.","cues":["speech to text","text to speech","translate","sentiment","chatbot"],"confuse":[{"with":"Amazon Textract","diff":"Textract reads documents (images to text); Transcribe reads audio (audio to text)."}],"memory":"Scribe writes, Polly talks, Translate converts, Comprehend understands, Lex chats.","refs":["Exam guide 1.2.5"],"slice":"s1"},{"id":"s2-foundation-model","domain":2,"task":"2.1","objective":"2.1.1","kind":"concept","tags":[],"front":"What is a foundation model (FM)?","answer":"A very large model pre-trained on broad, massive datasets that can be adapted to many different tasks through prompting, retrieval, or fine-tuning instead of training a model from scratch.","explain":"A model is a program that learned patterns from data. A foundation model learned from an enormous, general dataset (web text, books, images, code), so it is general purpose. You customize it for your business rather than building your own. On AWS you use FMs through Amazon Bedrock (a fully managed API, no servers to manage) or Amazon SageMaker JumpStart (a model hub that deploys the model to an endpoint you manage).","example":"One FM answers customer emails, summarizes contracts and writes product descriptions without separate models for each task.","cues":["general-purpose model","pre-trained on large datasets","adapt to many tasks","without training from scratch"],"confuse":[{"with":"Traditional ML model","diff":"Trained for one narrow task (for example, fraud score) on your own labeled data."},{"with":"LLM","diff":"An LLM is one kind of FM, focused on language; FMs can also handle images, audio or video."},{"with":"Amazon SageMaker JumpStart","diff":"Deploys FMs to your own SageMaker AI endpoint; Bedrock is serverless API access."}],"memory":"FM = Foundation that many houses (tasks) are built on.","refs":["Exam guide 2.1.1"],"slice":"s2"},{"id":"s2-llm-transformer","domain":2,"task":"2.1","objective":"2.1.1","kind":"concept","tags":[],"front":"What is a transformer-based large language model (LLM)?","answer":"A foundation model built on the transformer architecture and trained on huge amounts of text to predict the next token, which lets it understand and generate human language.","explain":"A neural network is a model made of many layers of simple math units that learn patterns from data; the transformer is the neural network design behind modern language models. Its self-attention mechanism lets every token weigh how relevant every other token is, so it keeps track of context across long passages. An LLM is trained to guess the next token (piece of text) given the previous ones, repeated one token at a time to write whole answers. The exam expects you to know LLMs generate text token by token and are a type of FM.","example":"Given 'The capital of France is', the LLM predicts ' Paris' as the most likely next token.","cues":["predicts the next token","transformer architecture","generates human-like text","self-attention"],"confuse":[{"with":"Diffusion model","diff":"Generates images by removing noise; an LLM generates text token by token."},{"with":"Amazon Comprehend","diff":"A pre-trained NLP service that analyzes text (sentiment, entities); it does not generate new text."}],"memory":"LLM = autocomplete at massive scale: it keeps guessing the next token.","refs":["Exam guide 2.1.1"],"slice":"s2"},{"id":"s2-token-tokenization","domain":2,"task":"2.1","objective":"2.1.1","kind":"concept","tags":["hot"],"front":"What is a token, and what is tokenization?","answer":"A token is the basic unit of text a model processes, often a word or part of a word; tokenization is splitting input text into those tokens. Model limits, latency and pricing are measured in tokens.","explain":"Models do not read letters or whole words; a tokenizer breaks text into pieces from a fixed vocabulary, and each piece is turned into numbers. Common words may be one token, while rare or long words split into several, so token count is usually higher than word count. The exam uses tokens as the unit for the context window, output length limits and per-token billing.","example":"'Unbelievable' might be split into 'Un', 'believ', 'able' (3 tokens).","cues":["word or subword unit","billed per token","input and output tokens","token limit"],"confuse":[{"with":"Chunk","diff":"A chunk is a larger passage of a document (many tokens) split off for retrieval."},{"with":"Embedding","diff":"An embedding is a vector of numbers representing meaning, not a text piece."}],"memory":"Tokens are the coins of GenAI: you count, pay and are limited by them.","refs":["Exam guide 2.1.1"],"slice":"s2"},{"id":"s2-context-window","domain":2,"task":"2.1","objective":"2.1.1","kind":"concept","tags":[],"front":"What is a model's context window?","answer":"The maximum number of tokens a model can consider at one time, covering the prompt, instructions, conversation history and included documents (and for many models the generated output).","explain":"Think of it as the model's short-term working memory for a single request. Anything outside the window is invisible to the model, so very long documents or chats must be shortened, chunked or summarized. When material does not fit, either choose a model with a larger context window or send only the relevant sections. Larger windows let you include more, but more tokens also means higher cost and latency.","example":"A model with a 128,000-token window cannot read a 400,000-token document collection in one request.","cues":["maximum input length","long documents do not fit","conversation history lost","model forgets earlier messages"],"confuse":[{"with":"Max output tokens","diff":"An inference setting (covered with inference parameters) that caps only the response length."},{"with":"Training data","diff":"What the model learned during training; the context window is what it sees per request."}],"memory":"Context window = the model's desk: only what fits on the desk gets read.","refs":["Exam guide 2.1.1"],"slice":"s2"},{"id":"s2-embeddings","domain":2,"task":"2.1","objective":"2.1.1","kind":"concept","tags":[],"front":"What are embeddings and vectors?","answer":"Embeddings are numerical vector representations of data such as text or images that capture meaning, so items with similar meaning have vectors close together and can be found by similarity search.","explain":"A vector is simply a list of numbers, like coordinates in a space with hundreds of dimensions. An embedding model converts a sentence or image into such a vector so that 'car' and 'automobile' land near each other. Measuring how close vectors are powers semantic search, recommendations and the retrieval step of RAG (retrieval-augmented generation: fetching relevant documents and adding them to the prompt). Cosine similarity is a common way to measure how closely two vectors point in the same direction. On AWS, Amazon Nova Multimodal Embeddings creates embeddings from text, images, documents, video and audio.","example":"The vectors for 'How do I reset my password?' and 'I forgot my login' are close, so a search returns the same help article.","cues":["numerical representation","semantic similarity","vector search","find similar items"],"confuse":[{"with":"Token","diff":"A token is a piece of text; an embedding is a vector representing the meaning of text."},{"with":"Keyword search","diff":"Matches exact words; embedding search matches meaning even with different words."}],"memory":"Embedding = GPS coordinates for meaning: nearby points mean similar things.","refs":["Exam guide 2.1.1","https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html"],"slice":"s2"},{"id":"s2-chunking","domain":2,"task":"2.1","objective":"2.1.1","kind":"concept","tags":[],"front":"What is chunking?","answer":"Chunking is splitting large documents into smaller passages before creating embeddings, so each piece fits model limits and can be retrieved precisely when relevant.","explain":"A whole manual is too big to embed or to paste into a prompt, and one vector for a 300-page document would blur all its topics together. Splitting it into chunks (for example by paragraph or a fixed number of tokens, often with some overlap) lets a search return only the relevant passage. Chunk size is a trade-off: too small loses context, too large adds noise and tokens. It is the first step of a retrieval pipeline.","example":"A 200-page HR policy is split into 500-token chunks, each embedded and stored for later search.","cues":["split documents into smaller pieces","fit within token limits","improve retrieval relevance"],"confuse":[{"with":"Tokenization","diff":"Splits text into tiny units for the model to read; chunking splits documents into passages for retrieval."}],"memory":"Chunking = cutting the book into index cards.","refs":["Exam guide 2.1.1"],"slice":"s2"},{"id":"s2-prompt-engineering-intro","domain":2,"task":"2.1","objective":"2.1.1","kind":"concept","tags":[],"front":"What is prompt engineering?","answer":"Designing and refining the input instructions given to a foundation model to get better, more relevant outputs, without changing the model's weights or retraining it.","explain":"A prompt is the text you send to the model: instructions, context, examples and the question. Prompt engineering improves results through clearer wording, format instructions, roles and examples. Weights are the internal numbers learned in training; prompt engineering leaves them untouched, which makes it the fastest and cheapest customization. Specific techniques (zero-shot, few-shot, chain-of-thought) are covered in the prompt engineering domain.","example":"Changing 'Summarize this' to 'Summarize this contract in 3 bullet points for a non-lawyer' gives a more useful answer.","cues":["without retraining","LEAST effort","improve instructions","no training data"],"confuse":[{"with":"Fine-tuning","diff":"Changes model weights with extra training on labeled data."},{"with":"Context engineering","diff":"Curates everything that fills the context window, not just the instruction wording."}],"memory":"Prompt engineering = ask better, do not rebuild.","refs":["Exam guide 2.1.1"],"slice":"s2"},{"id":"s2-multimodal-models","domain":2,"task":"2.1","objective":"2.1.1","kind":"concept","tags":["new2026"],"front":"What is a multimodal model?","answer":"A model that can accept and/or produce more than one type of data (modality), such as text, images, audio and video, for example the Amazon Nova multimodal models on Amazon Bedrock.","explain":"Modality means the kind of data: text, image, audio or video. A multimodal model can, for example, read a photo plus a question and answer in text, or take text and output an image. The Amazon Nova family includes multimodal understanding models (text, image and video i
