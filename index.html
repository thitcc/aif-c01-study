 score answers (LLM-as-a-judge), or use your own human workers. The results give documented evidence of quality and safety, which supports transparency. It is an offline assessment, not a runtime filter.","example":"Comparing three FMs on a customer-support dataset for accuracy and toxicity before picking one.","cues":["compare foundation models","toxicity and robustness","human evaluation","evidence for model selection"],"confuse":[{"with":"Amazon Bedrock Guardrails","diff":"Evaluations measure models before or between releases; Guardrails filters live traffic."},{"with":"Amazon SageMaker Clarify","diff":"Bedrock Evaluations assess foundation models and RAG; Clarify detects bias and explains predictions of classic tabular ML models."}],"memory":"Evaluate to choose; Guardrails to protect.","refs":["Exam guide 4.2.2","https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html","https://aws.amazon.com/ai/responsible-ai/","https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-availability-change.html"],"slice":"s6"},{"id":"s6-cmp-model-cards-service-cards-evaluations","domain":4,"task":"4.2","objective":"4.2.2","kind":"compare","tags":["new2026"],"front":"SageMaker Model Cards vs AWS AI Service Cards vs Amazon Bedrock Model Evaluations: which transparency tool is which?","answer":"SageMaker Model Cards document your own models; AWS AI Service Cards are AWS's documentation of its AI services; Bedrock Model Evaluations produce measured evidence to compare foundation models.","explain":"All three support transparency, so the exam uses them as distractors for each other. Ask who wrote it and what it contains. You write a Model Card about a model you built. AWS writes a Service Card about a service it built. An evaluation job produces scores from tests you run on candidate models.","example":"","cues":["document our model","limitations of an AWS service","compare foundation models"],"confuse":[],"memory":"Your paperwork, AWS's paperwork, test results.","refs":["Exam guide 4.2.2","https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html","https://aws.amazon.com/ai/responsible-ai/","https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html"],"slice":"s6"},{"id":"s6-open-source-licensing","domain":4,"task":"4.2","objective":"4.2.2","kind":"concept","tags":[],"front":"How do open-source models, open data and licensing relate to transparency?","answer":"Open-source models with published weights, documented training data and clear licenses allow inspection and verification, while licensing terms define legal use.","explain":"When a model's weights (the learned parameters), code and training data sources are published, others can inspect, test and reproduce it, which increases transparency. Data provenance (where the data came from) helps judge bias and IP risk. A license states what you may legally do, such as commercial use or modification. Exam answers favor models and data with clear provenance and licensing.","example":"Checking that a model's license allows commercial use before shipping a product built on it.","cues":["open source","data provenance","license terms","inspect the model"],"confuse":[{"with":"Proprietary API models","diff":"Proprietary models hide weights and data; transparency depends on the provider's documentation."}],"memory":"Open weights, known data, clear license.","refs":["Exam guide 4.2.2"],"slice":"s6"},{"id":"s6-human-centered-design-xai","domain":4,"task":"4.2","objective":"4.2.4","kind":"concept","tags":["new2026"],"front":"What are principles of human-centered design for explainable AI?","answer":"Design AI around its users: make decisions transparent with understandable explanations, provide user-feedback mechanisms, and keep humans able to review and override AI decisions.","explain":"Human-centered design means building for the needs and understanding of the people who use or are affected by the system. AI decision transparency means telling users that AI is involved and why it reached a result, in plain language, for example showing key factors or cited sources. User-feedback mechanisms, such as thumbs up or down or a report button, let users flag bad outputs so the team can improve the system. Human oversight keeps a person in control of high-impact decisions.","example":"A loan app shows the top three reasons for a decision and a button to request human review.","cues":["user feedback","explain decisions to users","disclose AI use","human oversight"],"confuse":[{"with":"Model Cards","diff":"Model Cards document the model for internal and audit readers; human-centered design shapes what end users see and can do."}],"memory":"Tell them why, let them talk back, keep a human in charge.","refs":["Exam guide 4.2.4"],"slice":"s6"},{"id":"s7-shared-responsibility-ai","domain":5,"task":"5.1","objective":"5.1.1","kind":"concept","tags":[],"front":"What is the AWS shared responsibility model, and how does it apply to an AI service such as Amazon Bedrock?","answer":"AWS is responsible for security OF the cloud (facilities, hardware, managed infrastructure); the customer is responsible for security IN the cloud: data, IAM access, encryption choices, network settings and Guardrails configuration.","explain":"The shared responsibility model splits security work between AWS and the customer. Even on a fully managed, serverless service like Amazon Bedrock, AWS runs and patches the infrastructure, but you decide who can call which model, how your data is encrypted and what content filters apply. The exam likes distractors that say AWS configures something automatically for you; that is usually wrong for IAM policies, keys and Guardrails.","example":"AWS secures the data centers and servers that host Claude on Bedrock; your team must still write the IAM policy that lets only the support app invoke it.","cues":["security of the cloud","security in the cloud","customer is responsible for","fully managed service"],"confuse":[{"with":"Generative AI Security Scoping Matrix","diff":"The scoping matrix classifies how much of the generative AI stack you own (Scopes 1-5); shared responsibility splits security duties between AWS and the customer."}],"memory":"AWS owns the building; you own what you put in it and who gets a key.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html"],"slice":"s7"},{"id":"s7-bedrock-data-privacy","domain":5,"task":"5.1","objective":"5.1.1","kind":"concept","tags":[],"front":"Can model providers see the prompts a company sends to Amazon Bedrock, and does Bedrock keep them?","answer":"No. Bedrock runs each provider's models in AWS-owned model deployment accounts that providers cannot access, so they never see customer prompts, completions or logs; by default Bedrock uses a zero data retention model.","explain":"In each Region, Amazon Bedrock copies a provider's model into a model deployment account owned and operated by the Bedrock team, so the provider (for example Anthropic) has no access to your inputs, outputs or Bedrock logs. Zero data retention means Bedrock does not store model inputs or outputs by default, with documented abuse-detection exceptions for some newer models that may retain data for up to 30 days. Customers can also choose a data retention mode per Region, including a zero-retention mode. Exam stems about keeping company data private from the model provider point here.","example":"A law firm worries that Anthropic could read its contract prompts; on Bedrock the model runs in an AWS-owned account the provider cannot access.","cues":["model provider cannot see data","data not shared with third parties","keep prompts private","data privacy"],"confuse":[{"with":"Model invocation logging","diff":"Invocation logging is something YOU enable to store your own prompts and responses in your S3 or CloudWatch Logs; it does not share them with providers."}],"memory":"Your prompts stay in an AWS room the model maker has no key to.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html","https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html","https://docs.aws.amazon.com/bedrock/latest/userguide/abuse-detection.html"],"slice":"s7"},{"id":"s7-iam-least-privilege","domain":5,"task":"5.1","objective":"5.1.1","kind":"concept","tags":[],"front":"What is AWS IAM, and what does least privilege mean for AI workloads?","answer":"AWS Identity and Access Management (IAM) controls who can do what on which AWS resources; least privilege grants only the specific actions and resources needed, for example invoking one approved Bedrock model.","explain":"IAM (Identity and Access Management) is the AWS service that authenticates users, roles and applications and authorizes their actions through JSON policies. A role is an identity that an application or service assumes to get temporary permissions, with no long-term password. Least privilege means granting the minimum permissions required. For AI, IAM policies can be scoped to specific SageMaker AI or Bedrock actions and even to a specific model ARN (Amazon Resource Name, the unique ID of an AWS resource).","example":"A policy allows invoking only the ARN of one approved Bedrock model, so calls to any other model are denied.","cues":["least privilege","only the required permissions","restrict access to specific models","IAM role"],"confuse":[{"with":"AWS KMS","diff":"KMS controls encryption keys; IAM controls who may perform actions (including who may use a key)."}],"memory":"Least privilege = give the intern a key to one room, not the master key.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html"],"slice":"s7"},{"id":"s7-kms-encryption-at-rest","domain":5,"task":"5.1","objective":"5.1.1","kind":"concept","tags":["hot"],"front":"What is AWS KMS, and what does it protect in an AI solution?","answer":"AWS Key Management Service (AWS KMS) creates and manages the cryptographic keys used to encrypt data at rest, such as training data in S3, model artifacts, knowledge base data and Bedrock logs.","explain":"Encryption at rest means data is stored in scrambled form so it is unreadable without a key. AWS KMS is the managed service that creates, stores, rotates and controls access to those keys, and many AWS services (S3, SageMaker AI, Bedrock) integrate with it. A customer managed key gives you control over the key policy and rotation, and every key use is recorded in AWS CloudTrail. On the exam, KMS is the answer for encrypting data at rest or for customer control of encryption keys.","example":"A bank encrypts its fine-tuning dataset in S3 and its custom Bedrock model with a customer managed KMS key it can disable at any time.","cues":["encrypt data at rest","customer managed keys","control key rotation","encryption keys"],"confuse":[{"with":"AWS Secrets Manager","diff":"Secrets Manager stores and rotates secrets such as API keys and passwords; KMS manages encryption keys."},{"with":"TLS","diff":"TLS protects data in transit over the network; KMS protects data at rest."}],"memory":"KMS = Keys Management for data at reSt.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/data-encryption.html"],"slice":"s7"},{"id":"s7-amazon-macie","domain":5,"task":"5.1","objective":"5.1.1","kind":"concept","tags":[],"front":"What does Amazon Macie do?","answer":"Amazon Macie uses machine learning and pattern matching to automatically discover, classify and protect sensitive data, such as PII, stored in Amazon S3.","explain":"PII (personally identifiable information) is data that identifies a person, such as names, emails, passport or credit card numbers. Macie scans S3 buckets, finds sensitive data and alerts you, and also reports bucket security issues such as public access. For AI, it is used before training or before loading documents into a knowledge base, so sensitive data does not end up inside a model or a retrieval index. It does not scan prompts or model outputs in real time.","example":"Before building a RAG index from 2 million support tickets in S3, a company runs Macie to find tickets containing credit card numbers.","cues":["discover PII in S3","sensitive data in S3 buckets","classify sensitive data","before training"],"confuse":[{"with":"Amazon Bedrock Guardrails","diff":"Guardrails sensitive information filters mask PII in live prompts and responses; Macie finds PII sitting in S3."},{"with":"Amazon Inspector","diff":"Inspector finds software vulnerabilities; Macie finds sensitive data."},{"with":"Amazon Comprehend","diff":"Comprehend detects PII in text you send to its API; Macie automatically discovers sensitive data across S3 buckets."}],"memory":"Macie finds the Mess of PII in your S3 buckets.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html"],"slice":"s7"},{"id":"s7-data-leakage-prevention","domain":5,"task":"5.1","objective":"5.1.4","kind":"concept","tags":["new2026"],"front":"What is data leakage prevention for a generative AI application, and which controls support it?","answer":"Data leakage prevention keeps sensitive or confidential data from being exposed through prompts, retrieved context or model outputs, using least-privilege data access, PII filtering and redaction such as Amazon Bedrock Guardrails, encryption and private connectivity.","explain":"Data leakage in generative AI means the application reveals information the user should not see, for example another customer's record returned by a RAG search or PII repeated in an answer. Controls work in layers: remove or mask sensitive data before it is indexed (Macie, masking), limit what the application can retrieve (IAM, document-level permissions), filter outputs (Amazon Bedrock Guardrails sensitive information filters) and keep traffic private (PrivateLink). Bedrock also isolates customer prompts and completions from model providers.","example":"An HR assistant only retrieves documents the signed-in employee is allowed to read, and a guardrail masks any Social Security numbers in answers.","cues":["prevent exposure of sensitive data","PII in responses","confidential data","leak"],"confuse":[{"with":"Data leakage in ML training (Domain 1)","diff":"In model evaluation, leakage can also mean test data accidentally used in training; here it means sensitive data exposed to the wrong person."}],"memory":"Stop the leak at every pipe: input, retrieval, output, network.","refs":["Exam guide 5.1.4","https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html"],"slice":"s7"},{"id":"s7-data-lineage-cataloging","domain":5,"task":"5.1","objective":"5.1.2","kind":"concept","tags":[],"front":"What are data lineage and data cataloging, and which AWS services support them?","answer":"Data lineage records where data came from and how it was transformed (Amazon SageMaker ML Lineage Tracking for ML workflows); a data catalog is a searchable inventory of datasets and metadata, such as the AWS Glue Data Catalog.","explain":"Lineage answers where this training data originated, which jobs changed it, and which models used it, so you can trace an error or a bias back to its source. Amazon SageMaker ML Lineage Tracking records the steps of an ML workflow, from data preparation to model deployment, so you can trace which data and jobs produced a model. A catalog stores metadata (schema, location, owner, classification) so people can find and govern datasets; the AWS Glue Data Catalog is the central metadata store, and AWS Lake Formation adds fine-grained access control on top of it. Exam stems about documenting data origins or traceability point here.","example":"An auditor asks which raw files produced the dataset that trained a credit model; lineage records show the S3 source, the Glue job that cleaned it and the training job that used it.","cues":["data origins","traceability","track lineage of ML workflow","metadata repository","data catalog"],"confuse":[{"with":"SageMaker Model Cards","diff":"Model Cards document a model in words; lineage and catalogs document where data came from and where it went."},{"with":"SageMaker Model Registry","diff":"Model Registry stores model versions and their approval status; ML Lineage Tracking records which data and jobs produced each model."},{"with":"AWS CloudTrail","diff":"CloudTrail records API activity, not the transformation history of a dataset."}],"memory":"Lineage = family tree of your data; catalog = its library index card.","refs":["Exam guide 5.1.2","https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html"],"slice":"s7"},{"id":"s7-source-citation","domain":5,"task":"5.1","objective":"5.1.2","kind":"concept","tags":["hot"],"front":"What is source citation in a generative AI application, and how does Amazon Bedrock support it?","answer":"Source citation means a response references the specific source documents or passages it was based on; Amazon Bedrock Knowledge Bases return citations to the retrieved source chunks so users and auditors can verify answers.","explain":"A citation is a pointer from a sentence in the answer to the document it came from, like a footnote. In RAG (Retrieval Augmented Generation), the app retrieves chunks (small passages) of your documents and the model answers from them; Bedrock Knowledge Bases can include citations to those specific chunks and their source location. Citations make answers verifiable, build user trust and support audits. It is different from data lineage, which traces the history of training data.","example":"A policy assistant answers a question about travel expenses and shows a link to page 3 of the Travel Policy PDF under the answer.","cues":["cite sources","show where the answer came from","verify origin","source attribution"],"confuse":[{"with":"Data lineage","diff":"Lineage traces how datasets were created and transformed; citation links one generated answer to the documents it used."},{"with":"Model invocation logging","diff":"Logging stores prompts and responses for later audit; citations are shown with each answer so it can be checked right away."}],"memory":"Citation = the footnote on every AI answer.","refs":["Exam guide 5.1.2","https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-retrieval.html"],"slice":"s7"},{"id":"s7-secure-data-engineering","domain":5,"task":"5.1","objective":"5.1.3","kind":"concept","tags":[],"front":"What are the best practices for secure data engineering in an AI pipeline?","answer":"Assess and maintain data quality, protect privacy with privacy-enhancing technologies, enforce least-privilege data access control, and protect data integrity with validation, versioning, checksums and encryption.","explain":"Data engineering is the work of collecting, cleaning and moving data for models. Data quality means the data is accurate, complete, consistent and representative, because a model learns whatever errors the data contains. Access control limits who can read each dataset (IAM, AWS Lake Formation). Data integrity means data is not altered accidentally or maliciously, supported by validation checks, versioning such as S3 Versioning, and logging of changes. AWS Glue DataBrew can profile and clean data for quality.","example":"A team profiles its training data with AWS Glue DataBrew, removes duplicate and malformed rows, and restricts the curated bucket to the ML role only.","cues":["data quality","data integrity","access control","tampering","representative data"],"confuse":[{"with":"Data poisoning","diff":"Poisoning is an attack that corrupts training data; integrity controls are the defense."}],"memory":"Clean, Private, Locked, Unchanged.","refs":["Exam guide 5.1.3"],"slice":"s7"},{"id":"s7-privacy-enhancing-technologies","domain":5,"task":"5.1","objective":"5.1.3","kind":"concept","tags":[],"front":"What are privacy-enhancing technologies (PETs) used with AI training data, and how do anonymization, pseudonymization and masking differ?","answer":"Techniques that let you use data while protecting individuals, such as anonymization, pseudonymization, data masking, tokenization, differential privacy and encryption.","explain":"Anonymization irreversibly removes identifiers so a person can no longer be identified. Pseudonymization replaces identifiers with a consistent substitute that can be re-linked only with separately protected information. Masking hides all or part of a value (for example XXXX-1234). Tokenization in the security sense swaps a sensitive value for a random token stored in a secure vault; this is different from LLM tokenization, which splits text into pieces. Differential privacy adds carefully calculated noise so results cannot reveal whether one person's data was included.","example":"Anonymized: the name column is deleted. Pseudonymized: Maria Silva becomes Customer-8841, with the mapping kept in a separate protected store. Masked: card number XXXX-XXXX-XXXX-4821.","cues":["privacy-preserving","cannot be re-identified","de-identify","replace identifiers","hide part of the value"],"confuse":[{"with":"LLM tokenization (Domain 2)","diff":"LLM tokenization splits text into tokens for a model; data tokenization replaces sensitive values with surrogate tokens."},{"with":"Encryption","diff":"Encryption hides data from people without the key; authorized users with the key still see the raw PII."}],"memory":"Anonymize = erase, Pseudonymize = nickname, Mask = cover, Differential privacy = blur with noise.","refs":["Exam guide 5.1.3"],"slice":"s7"},{"id":"s7-ai-security-considerations","domain":5,"task":"5.1","objective":"5.1.4","kind":"concept","tags":[],"front":"What do application security, threat detection, vulnerability management and infrastructure protection mean for an AI system?","answer":"Application security protects the app's code, APIs and inputs; threat detection watches for malicious activity; vulnerability management finds and patches software flaws with Amazon Inspector; infrastructure protection isolates networks with Amazon VPC, security groups and AWS PrivateLink.","explain":"Application security for AI means validating inputs, defending against prompt injection and protecting the APIs that call models. Threat detection means continuously analyzing logs such as AWS CloudTrail and Amazon CloudWatch for signs of attack, such as compromised credentials, unusual API calls or crypto-mining. Vulnerability management means scanning for known flaws in operating systems and packages (Amazon Inspector). Infrastructure protection means network isolation and private connectivity so models and data are not exposed to the internet.","example":"A RAG chatbot validates user input (application security), alarms on a spike of failed API calls (threat detection), has its containers scanned by Inspector (vulnerability management) and reaches Bedrock through a VPC endpoint (infrastructure protection).","cues":["threat detection","vulnerability management","infrastructure protection","application security","defense in depth"],"confuse":[{"with":"Amazon GuardDuty (not in the v1.1 service list, seen as a distractor)","diff":"GuardDuty is the AWS managed threat detection service that analyzes logs for malicious activity; Inspector scans software for vulnerabilities."},{"with":"Amazon Macie","diff":"Macie protects sensitive data in S3; it is not a threat detection or vulnerability scanner."}],"memory":"Protect the app, watch for attackers, patch the holes, wall the network.","refs":["Exam guide 5.1.4","https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html","https://docs.aws.amazon.com/bedrock/latest/userguide/usingVPC.html"],"slice":"s7"},{"id":"s7-prompt-injection-mitigation","domain":5,"task":"5.1","objective":"5.1.4","kind":"concept","tags":["hot"],"front":"How do you mitigate prompt injection in a generative AI application on AWS?","answer":"Use layered defenses: Amazon Bedrock Guardrails prompt attack filters, input validation, clear separation of system instructions from user and retrieved content, least-privilege permissions for any tools the model can call, and human approval for high-impact actions.","explain":"Prompt injection is when crafted text tries to override the model's instructions (see the prompt attack cards). No single control is perfect, so the exam expects defense in depth: filter and validate inputs, treat retrieved documents as untrusted data, limit what the application or agent is allowed to do with IAM so a hijacked model cannot cause damage, validate outputs, and log interactions for investigation.","example":"A support agent that can issue refunds is limited by IAM to refunds under 100 dollars, and a guardrail blocks inputs such as ignore your previous instructions.","cues":["ignore previous instructions","override system prompt","malicious input","mitigate prompt attacks"],"confuse":[{"with":"Amazon Bedrock Guardrails","diff":"Guardrails is the managed filter; the full mitigation also includes IAM, validation and human approval."}],"memory":"Filter the input, fence the tools, check the output.","refs":["Exam guide 5.1.4"],"slice":"s7"},{"id":"s7-output-filtering-toxicity","domain":5,"task":"5.1","objective":"5.1.4","kind":"concept","tags":["new2026","hot"],"front":"What are output filtering and validation, and why do they matter for toxicity?","answer":"Output filtering and validation check a model's response before it reaches users, blocking toxic, harmful or sensitive content and verifying format and facts; Amazon Bedrock Guardrails is the managed option.","explain":"Toxicity means hateful, insulting, violent, sexual or otherwise harmful language. Because foundation models can generate it even from harmless prompts, responses should be screened by content filters, denied-topic rules and PII filters (Amazon Bedrock Guardrails), and validated by application code, for example checking that JSON matches a schema or that a number falls in an allowed range. Blocked or flagged outputs can be logged for review.","example":"A retail chatbot's guardrail blocks an insulting reply, and the app rejects any answer that quotes a price not found in the product catalog.","cues":["toxic content","harmful output","validate model responses","filter responses"],"confuse":[{"with":"Model invocation logging","diff":"Logging records what was said after the fact; output filtering stops it before users see it."},{"with":"Amazon Comprehend toxicity detection","diff":"Comprehend is an API that scores any text for toxicity; Guardrails is the filter attached to Bedrock model calls."}],"memory":"Nothing leaves the kitchen without a taste test.","refs":["Exam guide 5.1.4"],"slice":"s7"},{"id":"s7-cloudtrail","domain":5,"task":"5.2","objective":"5.2.1","kind":"concept","tags":[],"front":"What does AWS CloudTrail record?","answer":"AWS CloudTrail records API calls and account activity across AWS: who made the call, which action, on which resource, when and from where, providing an audit trail for governance and compliance.","explain":"Almost everything in AWS is an API call (Application Programming Interface request), whether from the console, CLI or code. CloudTrail logs these events, for example who created a guardrail, changed an IAM policy or invoked a Bedrock model. It is the go-to answer for who did what and when. For the full text of prompts and model responses you need Amazon Bedrock model invocation logging instead.","example":"Security asks who deleted the production guardrail last night; CloudTrail shows the IAM role, the time and the source IP address.","cues":["who made the API call","audit trail","track user activity","which user changed"],"confuse":[{"with":"AWS Config","diff":"Config records resource configuration state and evaluates compliance rules; CloudTrail records the API calls that made the changes."},{"with":"Bedrock model invocation logging","diff":"Invocation logging stores prompt and response content; CloudTrail stores API call metadata."}],"memory":"CloudTrail = the trail of footprints: who, what, when.","refs":["Exam guide 5.2.1"],"slice":"s7"},{"id":"s7-bedrock-invocation-logging","domain":5,"task":"5.1","objective":"5.1.4","kind":"concept","tags":["new2026"],"front":"What is Amazon Bedrock model invocation logging?","answer":"An Amazon Bedrock feature that captures the full request data, response data and metadata of model invocations and delivers them to Amazon S3 and/or Amazon CloudWatch Logs for auditing and analysis.","explain":"It is disabled by default, so you must turn it on and choose a destination (an S3 bucket or CloudWatch Logs log group in the same account and Region). Once enabled it records what users asked and what the model answered, which supports audit trail requirements, abuse investigation and quality review. Because logs may contain sensitive data, protect them with KMS encryption and IAM. It records what happened; it does not block anything.","example":"A regulated insurer enables invocation logging to S3 so it can show regulators every prompt and answer from its claims assistant.","cues":["log prompts and responses","record model inputs and outputs","audit AI interactions","S3 or CloudWatch Logs"],"confuse":[{"with":"AWS CloudTrail","diff":"CloudTrail logs the API call itself (who, when); invocation logging logs the content of the prompt and response."},{"with":"Amazon Bedrock Guardrails","diff":"Guardrails prevent unwanted content in real time; logging only records."}],"memory":"Invocation logging = the transcript; CloudTrail = the visitor log.","refs":["Exam guide 5.1.4","https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html"],"slice":"s7"},{"id":"s7-aws-config","domain":5,"task":"5.2","objective":"5.2.1","kind":"concept","tags":[],"front":"What does AWS Config do?","answer":"AWS Config continuously records the configuration of your AWS resources and evaluates them against rules, flagging non-compliant resources, for example an unencrypted S3 bucket or a SageMaker AI endpoint without encryption.","explain":"A configuration is a resource's settings, such as whether encryption or public access is enabled. AWS Config keeps a history of those settings over time and uses Config rules (AWS managed or custom) to check them against your policies, optionally with automatic remediation. It answers what does this resource look like now, what did it look like before, and is it compliant.","example":"A rule flags any S3 bucket holding training data that does not have default encryption turned on.","cues":["configuration changes","compliance rules","resource configuration history","continuously evaluate"],"confuse":[{"with":"AWS CloudTrail","diff":"CloudTrail tells you who changed it; Config tells you what the configuration is and whether it is compliant."},{"with":"AWS Trusted Advisor","diff":"Trusted Advisor gives AWS best-practice recommendations; Config checks your own custom rules."}],"memory":"Config = configuration camera plus rulebook.","refs":["Exam guide 5.2.1"],"slice":"s7"},{"id":"s7-hallucination-grounding","domain":5,"task":"5.1","objective":"5.1.5","kind":"concept","tags":["hot","new2026"],"front":"What is grounding, and how does RAG grounding reduce hallucinations?","answer":"Grounding ties a model's answer to trusted source data; RAG grounding retrieves relevant documents, for example with Amazon Bedrock Knowledge Bases, and instructs the model to answer only from them with source citations.","explain":"A hallucination is a confident but false or unsupported answer from a model. RAG (Retrieval Augmented Generation) first searches your approved documents and adds the relevant passages to the prompt, so the model answers from facts instead of from memory alone. Citations show which source each answer came from, letting users verify it. Grounding reduces but does not eliminate hallucinations, so it is combined with output validation, grounding checks and human review.","example":"A benefits assistant answers how many vacation days new hires get by retrieving the HR policy PDF and citing section 4.2.","cues":["reduce hallucinations","answer based on company documents","cite sources","factually accurate"],"confuse":[{"with":"Fine-tuning","diff":"Fine-tuning changes model weights for style or domain behavior; RAG grounding supplies current facts at query time without retraining."},{"with":"Lower temperature","diff":"Lower temperature makes output less random but does not give the model missing facts."}],"memory":"Grounded = the answer has its feet on your documents.","refs":["Exam guide 5.1.5"],"slice":"s7"},{"id":"s7-hallucination-detection-methods","domain":5,"task":"5.1","objective":"5.1.5","kind":"concept","tags":["new2026","hot"],"front":"Which methods can detect hallucinations or catch inaccurate model outputs?","answer":"Grounding checks against source text, output validation against trusted systems or rules, confidence scoring with thresholds, Automated Reasoning checks, LLM-as-a-judge evaluation and human review.","explain":"Detection means catching a wrong answer before it causes harm. Contextual grounding checks compare the answer with the retrieved source. Output validation checks facts, formats or values against a trusted source such as a database or schema. Confidence scoring gives each output a likelihood of being correct, and a threshold sends doubtful ones to a person. Automated Reasoning checks prove answers against formal rules. LLM-as-a-judge uses a second model to grade answers, usually in evaluation rather than in every live request.","example":"An order bot's answer says a package shipped on May 3; the app checks the order database, sees no shipment, and replaces the answer with a handoff to an agent.","cues":["detect hallucinations","validate outputs","confidence score","human review","verify accuracy"],"confuse":[{"with":"RAG grounding","diff":"RAG grounding prevents hallucinations by giving the model facts; detection methods catch the ones that still get through."}],"memory":"Compare, Check, Score, Prove, Judge, Human.","refs":["Exam guide 5.1.5","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html"],"slice":"s7"},{"id":"s7-contextual-grounding-check","domain":5,"task":"5.1","objective":"5.1.5","kind":"concept","tags":["new2026","hot"],"front":"What is the contextual grounding check in Amazon Bedrock Guardrails?","answer":"A Guardrails policy that detects hallucinations by scoring whether a response is grounded in the provided reference source and relevant to the user query, and blocks responses scoring below configured thresholds.","explain":"The check needs three things: a grounding source (for example retrieved RAG passages), the user query, and the model response. It produces two confidence scores: grounding (is every claim supported by the source) and relevance (does it answer the question). You set thresholds from 0 to 0.99; responses below them are blocked or flagged. AWS documents it for summarization, paraphrasing and question answering, not for open conversational chatbots.","example":"Source: Tokyo is the capital of Japan. Question: capital of Japan? Answer: London is flagged as ungrounded; a correct but off-topic answer is flagged as irrelevant.","cues":["detect hallucinations","response not supported by source","grounding and relevance","threshold"],"confuse":[{"with":"Automated Reasoning checks","diff":"Automated Reasoning validates answers against formal policy rules with logic; contextual grounding compares answers with retrieved text using confidence scores."}],"memory":"Two scores, two questions: is it true to the source, and is it on topic?","refs":["Exam guide 5.1.5","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html"],"slice":"s7"},{"id":"s7-automated-reasoning-checks","domain":5,"task":"5.1","objective":"5.1.5","kind":"concept","tags":["new2026","hot"],"front":"What are Automated Reasoning checks in Amazon Bedrock Guardrails?","answer":"A Guardrails capability that uses formal logic to mathematically validate model responses against rules you define, detecting incorrect or incomplete statements and explaining why a response is valid or invalid.","explain":"Formal logic here means translating a policy (for example mortgage eligibility rules) into precise logical rules that can be checked like a proof. Unlike content filters that simply block or allow, Automated Reasoning checks give structured, verifiable feedback that can be used to correct the answer. AWS positions them for regulated industries and complex rule sets such as HR, insurance or lending where auditable, provably consistent answers are needed.","example":"An airline chatbot says a refund is allowed; Automated Reasoning checks prove it contradicts the rule that basic fares are non-refundable.","cues":["mathematically verify","formal logic","provably correct","complex policy rules","regulated industry"],"confuse":[{"with":"Contextual grounding check","diff":"Grounding checks compare the answer with source text via scores; Automated Reasoning checks prove it against defined logical rules."}],"memory":"Automated Reasoning = a math teacher grading the answer against the rulebook.","refs":["Exam guide 5.1.5","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html"],"slice":"s7"},{"id":"s7-data-governance-strategies","domain":5,"task":"5.2","objective":"5.2.2","kind":"concept","tags":[],"front":"What are the main data governance strategies for AI workloads?","answer":"Manage data across its lifecycle, define retention and deletion periods, keep data in required Regions for residency, and log, monitor and observe data access and usage.","explain":"Data lifecycle is the path from collection to storage, use, archiving and deletion; S3 Lifecycle rules can move old data to Amazon S3 Glacier and delete it after a set time. Retention is how long data must or may be kept, driven by law and policy. Data residency (or sovereignty) means data must stay in a specific country or region; on AWS you choose the AWS Region where data is stored and processed, and you avoid features that copy or route data to other Regions. Logging and monitoring (CloudTrail, CloudWatch, invocation logging) show who used which data and how.","example":"A European bank keeps training data in the Frankfurt Region, archives it to S3 Glacier after 1 year and deletes it after 7 years.","cues":["data residency","retention period","data lifecycle","keep data in a specific country"],"confuse":[{"with":"Bedrock data retention settings","diff":"Bedrock lets you configure whether prompts and outputs are retained per Region; this is one control inside the wider retention strategy."}],"memory":"Where it lives, how long it lives, and who is watching it.","refs":["Exam guide 5.2.2","https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html"],"slice":"s7"},{"id":"s7-scoping-matrix","domain":5,"task":"5.2","objective":"5.2.3","kind":"concept","tags":[],"front":"What is the Generative AI Security Scoping Matrix, and what are its five scopes?","answer":"An AWS framework that classifies generative AI use by how much you own: Scope 1 consumer app, Scope 2 enterprise app, Scope 3 pre-trained models, Scope 4 fine-tuned models, Scope 5 self-trained models.","explain":"Scopes 1 and 2 are buying: using a public consumer app, or a third-party enterprise app with generative AI built in under a business agreement. Scopes 3 to 5 are building: your own app calling an existing foundation model through an API (for example Claude on Amazon Bedrock with RAG), fine-tuning an existing model with your data, or training a model from scratch. The higher the scope, the more security, governance and legal responsibility you carry. AWS's web page now also calls it the AI Security Scoping Matrix.","example":"Employees using a public chat website to brainstorm = Scope 1; a chatbot using RAG with Claude through Bedrock APIs = Scope 3.","cues":["Generative AI Security Scoping Matrix","which scope","consumer app","self-trained"],"confuse":[{"with":"AWS shared responsibility model","diff":"Shared responsibility splits duties between AWS and customer; the scoping matrix classifies how much of the generative AI stack you own."}],"memory":"Buy, buy, build, build more, build it all: Consumer, Enterprise, Pre-trained, Fine-tuned, Self-trained (CEPFS).","refs":["Exam guide 5.2.3","https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/"],"slice":"s7"},{"id":"s7-governance-processes","domain":5,"task":"5.2","objective":"5.2.3","kind":"concept","tags":[],"front":"What processes does an organization follow to govern AI, and which compliance standards apply?","answer":"Written AI policies, a regular review cadence, defined review strategies, frameworks such as the Generative AI Security Scoping Matrix, transparency standards and team training, aligned with ISO and SOC standards and algorithm accountability laws.","explain":"Governance is the set of rules and routines that keep AI use safe, legal and accountable. Review cadence means how often models and data are re-reviewed, for example quarterly or after major changes; review strategies define who reviews (for example a cross-functional board of legal, security and data science), what triggers a review and which checklist is used. Transparency standards require documenting and disclosing how AI is used (Model Cards, disclosures to users). ISO (International Organization for Standardization) publishes certifiable standards such as ISO 27001 for information security and ISO/IEC 42001 for AI management systems; SOC (System and Organization Controls) reports are independent audits of controls. Algorithm accountability laws require organizations to explain and take responsibility for automated decisions, and training ensures staff know the policies.","example":"A company creates an AI review board that approves each new use case, re-reviews production models every quarter and requires annual responsible AI training.","cues":["governance framework","review cadence","transparency","team training","algorithm accountability"],"confuse":[{"with":"AWS Artifact","diff":"Artifact provides AWS's own compliance reports and certificates (including ISO/IEC 42001); your governance process is still your responsibility."}],"memory":"Policy, Pace, People, Proof.","refs":["Exam guide 5.2.3","https://aws.amazon.com/compliance/iso-42001-faqs/"],"slice":"s7"},{"id":"s7-scenario-macie-pii-s3","domain":5,"task":"5.1","objective":"5.1.1","kind":"scenario","tags":[],"front":"A company must be alerted continuously whenever new objects containing credit card numbers land in the Amazon S3 buckets that hold its model training data. Which AWS service should it use?","answer":"Amazon Macie, which automatically discovers, classifies and reports sensitive data such as PII and credit card numbers in Amazon S3.","explain":"Macie scans S3 objects with machine learning and pattern matching and produces findings by bucket and object, which can trigger alerts. Finding sensitive data before training or indexing prevents a model or retrieval system from exposing it later. Comprehend can detect PII in text you send to it, but Macie is the managed answer for discovering sensitive data across S3 buckets.","example":"","cues":["PII in S3","credit card numbers in buckets","discover sensitive data","minimal manual effort"],"confuse":[{"with":"Amazon Comprehend","diff":"Comprehend detects PII in text passed to its API; Macie discovers sensitive data across S3 buckets."},{"with":"Amazon Inspector","diff":"Inspector finds software vulnerabilities, not sensitive data."}],"memory":"S3 + PII = Macie.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html"],"slice":"s7"},{"id":"s7-scenario-iam-model-scope","domain":5,"task":"5.1","objective":"5.1.1","kind":"scenario","tags":[],"front":"A company allows developers to use Amazon Bedrock but must ensure they can invoke only one approved foundation model. What should the company do?","answer":"Attach an IAM policy that allows the Bedrock invoke actions only on that model's ARN (least privilege).","explain":"IAM policies can name specific resources, and each Bedrock model has an ARN (Amazon Resource Name). Allowing invocation only for that ARN blocks every other model. Guardrails filter content, not which model is called, so they are the wrong tool here.","example":"","cues":["only approved models","restrict access","least privilege","specific model"],"confuse":[{"with":"Amazon Bedrock Guardrails","diff":"Guardrails filter prompts and responses; they do not restrict which model an identity may invoke."}],"memory":"Who can call what = IAM.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html"],"slice":"s7"},{"id":"s7-scenario-privatelink","domain":5,"task":"5.1","objective":"5.1.1","kind":"scenario","tags":[],"front":"A financial company's application in a VPC calls Amazon Bedrock. Security requires that this traffic never travels over the public internet. What should they use?","answer":"AWS PrivateLink: create an interface VPC endpoint for Amazon Bedrock so traffic stays on the AWS network.","explain":"A VPC (Virtual Private Cloud) is your isolated private network in AWS. An interface VPC endpoint powered by AWS PrivateLink gives the VPC a private entry point to an AWS service, so requests do not need an internet gateway or public IP addresses. The same pattern applies to SageMaker AI. Encryption protects the content, but PrivateLink answers the keep it off the internet requirement.","example":"","cues":["not traverse the public internet","private connectivity","from within a VPC","VPC endpoint"],"confuse":[{"with":"Amazon CloudFront","diff":"CloudFront is a content delivery network for caching content near users, not private access to AWS APIs."},{"with":"AWS KMS","diff":"KMS encrypts data; it does not change the network path."}],"memory":"PrivateLink = a private tunnel from your VPC to the service.","refs":["Exam guide 5.1.1","https://docs.aws.amazon.com/bedrock/latest/userguide/usingVPC.html"],"slice":"s7"},{"id":"s7-scenario-secrets-manager","domain":5,"task":"5.1","objective":"5.1.1","kind":"scenario","tags":[],"front":"An AI agent running in AWS Lambda must call a third-party weather API that requires an API key. The key must not be hard-coded and should be rotated. Which service should store it?","answer":"AWS Secrets Manager, which stores, encrypts and rotates secrets such as API keys and database credentials and returns them at runtime.","explain":"A secret is a credential such as a password or API key. Hard-coding it in code or prompts risks leakage. Secrets Manager encrypts secrets with AWS KMS, controls access with IAM, supports automatic rotation and logs retrievals in CloudTrail.","example":"","cues":["API key","database credentials","rotate secrets","do not hard-code"],"confuse":[{"with":"AWS KMS","diff":"KMS manages encryption keys; Secrets Manager stores the application secrets themselves (and uses KMS to encrypt them)."}],"memory":"Secrets go in the Secrets Manager vault, never in the prompt or code.","refs":["Exam guide 5.1.1"],"slice":"s7"},{"id":"s7-scenario-invocation-logging","domain":5,"task":"5.1","objective":"5.1.4","kind":"scenario","tags":["new2026"],"front":"A team wants to analyze which prompts caused poor answers from its Amazon Bedrock application last month, using the full request and response text in Amazon CloudWatch Logs. What must the team have enabled beforehand?","answer":"Amazon Bedrock model invocation logging, delivering request and response data to Amazon CloudWatch Logs or Amazon S3.","explain":"Invocation logging captures the input and output content and metadata of each model call. It is off by default, so without enabling it in advance there is no record of past prompts to analyze. CloudTrail alone would show that a model was invoked and by whom, but not the text exchanged. Because logs may contain sensitive data, encrypt them with KMS and restrict access with IAM.","example":"","cues":["full request and response text","record every prompt and response","audit trail for AI interactions","model inputs and outputs"],"confuse":[{"with":"AWS CloudTrail","diff":"CloudTrail = API call metadata; invocation logging = conversation content."}],"memory":"Need the words? Invocation logging.","refs":["Exam guide 5.1.4","https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html"],"slice":"s7"},{"id":"s7-scenario-comprehend-toxicity","domain":5,"task":"5.1","objective":"5.1.4","kind":"scenario","tags":["hot"],"front":"A gaming company wants to automatically screen player chat messages and the prompts users send to its generative AI assistant for hate speech, threats and abuse, and also redact PII, with adjustable thresholds. Which AWS service provides these trust and safety features?","answer":"Amazon Comprehend trust and safety features: toxicity detection, prompt safety classification and PII detection and redaction.","explain":"Amazon Comprehend is a natural language processing (NLP) service that analyzes text. Its trust and safety features score text for toxicity (hate speech, threats, abuse), classify whether a prompt has malicious intent, and detect and redact PII, with thresholds you can customize. It works on any text, such as chats, forum posts, and generative AI prompts and outputs, not only Bedrock traffic.","example":"","cues":["toxicity detection","moderate text content","hate speech","prompt safety","user-generated content"],"confuse":[{"with":"Amazon Bedrock Guardrails","diff":"Guardrails is a managed filter configured on Bedrock model calls; Comprehend is a text analysis API usable on any text."},{"with":"Amazon Macie","diff":"Macie finds PII stored in S3 buckets, not in live chat text."},{"with":"Amazon Rekognition","diff":"Rekognition moderates images and video, not text."}],"memory":"Comprehend reads the text and says: toxic, risky or has PII.","refs":["Exam guide 5.1.4","https://docs.aws.amazon.com/comprehend/latest/dg/trust-safety.html"],"slice":"s7"},{"id":"s7-scenario-cloudtrail-audit","domain":5,"task":"5.2","objective":"5.2.1","kind":"scenario","tags":[],"front":"A security team needs to know which IAM user changed an Amazon SageMaker AI endpoint configuration and when it happened. Which AWS service provides this information?","answer":"AWS CloudTrail, which records API calls with the identity, time, source and parameters of each request.","explain":"Updating an endpoint is an API call, so CloudTrail captures who made it. AWS Config could show the configuration before and after the change, but the who and when of the call is CloudTrail. CloudWatch focuses on metrics, logs and alarms rather than identity-based audit.","example":"","cues":["which user","when it happened","API activity","audit"],"confuse":[{"with":"AWS Config","diff":"Config shows what the configuration was and whether it complies; CloudTrail shows who changed it."}],"memory":"Who did it? Follow the CloudTrail.","refs":["Exam guide 5.2.1"],"slice":"s7"},{"id":"s7-scenario-artifact","domain":5,"task":"5.2","objective":"5.2.1","kind":"scenario","tags":[],"front":"A compliance officer needs AWS's SOC 2 report and ISO certificates to show auditors that the infrastructure running the company's AI workload meets these standards. Where can they get them?","answer":"AWS Artifact, the self-service portal for on-demand access to AWS security and compliance reports and agreements.","explain":"AWS Artifact provides AWS's own third-party audit reports and certificates (SOC, ISO, PCI and others, including the AWS ISO/IEC 42001 certificate for AI management systems) and lets you review and accept agreements such as the HIPAA Business Associate Addendum (BAA), a contract required for handling US health data. These reports prove AWS's side of shared responsibility; your own configuration must still be compliant.","example":"","cues":["compliance reports","SOC report","ISO certification","proof that AWS is compliant"],"confuse":[{"with":"AWS Audit Manager (legacy for this exam)","diff":"Audit Manager collects evidence about your own AWS usage; Artifact gives AWS's compliance reports."},{"with":"AWS Config","diff":"Config evaluates your resource configurations; it does not provide audit reports."}],"memory":"Artifact = AWS's certificate archive.","refs":["Exam guide 5.2.1","https://aws.amazon.com/compliance/iso-42001-faqs/"],"slice":"s7"},{"id":"s7-scenario-inspector","domain":5,"task":"5.1","objective":"5.1.4","kind":"scenario","tags":[],"front":"A company deploys custom inference containers from Amazon ECR and runs preprocessing on Amazon EC2 and AWS Lambda. It needs continuous scanning for known software vulnerabilities. Which service should it use?","answer":"Amazon Inspector, which automatically and continuously scans EC2 instances, container images in Amazon ECR and Lambda functions for software vulnerabilities and unintended network exposure.","explain":"Amazon ECR (Elastic Container Registry) stores container images, which are packaged applications. Vulnerability management means finding and fixing known security flaws, published as CVEs (Common Vulnerabilities and Exposures), in operating systems and software packages. Inspector discovers workloads and rescans when new vulnerabilities are published, ranking findings by risk. It is part of infrastructure and application security for AI systems.","example":"","cues":["software vulnerabilities","CVE","scan container images","vulnerability management"],"confuse":[{"with":"Amazon Macie","diff":"Macie finds sensitive data in S3; Inspector finds vulnerable software."},{"with":"AWS Trusted Advisor","diff":"Trusted Advisor gives account-level best-practice checks, not per-package vulnerability scanning."}],"memory":"Inspector inspects software for holes.","refs":["Exam guide 5.1.4"],"slice":"s7"},{"id":"s7-scenario-pii-leakage-output","domain":5,"task":"5.1","objective":"5.1.4","kind":"scenario","tags":["new2026","hot"],"front":"A customer service assistant built on Amazon Bedrock sometimes repeats customers' phone numbers and email addresses in its responses. The company wants to redact this PII automatically without retraining the model. What should it use?","answer":"Amazon Bedrock Guardrails with a sensitive information filter configured to mask or block PII in model responses.","explain":"This is data leakage prevention through output filtering. Guardrails sensitive information filters detect PII types and can mask or block them in inputs and outputs, applied at runtime with no model retraining. Macie would not help because the PII is in live responses, not in S3.","example":"","cues":["redact PII in responses","without retraining","sensitive information","data leakage"],"confuse":[{"with":"Amazon Macie","diff":"Macie discovers PII stored in S3, not in live model output."}],"memory":"PII in live chat = Guardrails; PII at rest in S3 = Macie.","refs":["Exam guide 5.1.4"],"slice":"s7"},{"id":"s7-scenario-confidence-human-review","domain":5,"task":"5.1","objective":"5.1.5","kind":"scenario","tags":["new2026"],"front":"An insurance company uses a model to extract claim details. It wants low-confidence results to be checked by an employee before they are processed, while high-confidence results continue automatically. What approach meets this requirement?","answer":"Use confidence scoring with a threshold and route results below it to human review (human-in-the-loop), while higher-confidence results proceed automatically.","explain":"A confidence score is the model's or check's estimate of how likely an output is correct. Setting a threshold creates a triage: clear cases are automated, doubtful ones go to people. This reduces the impact of hallucinations and errors without reviewing everything manually. Output validation rules, such as checking dates and policy numbers against source systems, add another layer.","example":"","cues":["low confidence","human review","threshold","before processing"],"confuse":[{"with":"Amazon Augmented AI (A2I, legacy for this exam)","diff":"A2I is the managed AWS human review workflow service often seen in older questions (not in the v1.1 service list); the concept of routing low-confidence results to humans is the same."}],"memory":"Confident? Go. Unsure? Human.","refs":["Exam guide 5.1.5"],"slice":"s7"},{"id":"s7-scenario-scoping-matrix-scope","domain":5,"task":"5.2","objective":"5.2.3","kind":"scenario","tags":[],"front":"A company fine-tunes a foundation model in Amazon Bedrock with its own medical records to summarize patient notes in doctors' preferred style. Which scope of the Generative AI Security Scoping Matrix is this?","answer":"Scope 4: fine-tuned models, because the company customizes an existing third-party foundation model with its own data.","explain":"The scope decides which security and governance controls apply. Calling the model without changing it would be Scope 3; building a model from scratch would be Scope 5. At Scope 4 the company is also responsible for the fine-tuning data, for example avoiding unnecessary PII, and for access to the new custom model.","example":"","cues":["fine-tunes","Scoping Matrix","which scope"],"confuse":[{"with":"Scope 3: pre-trained models","diff":"Scope 3 uses an FM as-is via API (RAG is still Scope 3); Scope 4 changes the model with fine-tuning."}],"memory":"Fine-tuned = four.","refs":["Exam guide 5.2.3","https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/"],"slice":"s7"},{"id":"s7-compare-guardrails-logging-cloudtrail","domain":5,"task":"5.1","objective":"5.1.4","kind":"compare","tags":["new2026","hot"],"front":"Amazon Bedrock Guardrails vs model invocation logging vs AWS CloudTrail: how do you tell them apart?","answer":"Guardrails prevent unwanted content in real time; model invocation logging records the full prompts and responses; CloudTrail records who called which API and when.","explain":"All three appear in AI security questions. Prevent means stop it before the user sees it (Guardrails). Record content means keep the actual text for audits or investigations (invocation logging to S3 or CloudWatch Logs). Record activity means an audit of identities and actions (CloudTrail). A complete audit trail for AI interactions usually combines the last two.","example":"Block a toxic answer: Guardrails. Show an auditor what the bot told a customer: invocation logging. Find who disabled the guardrail: CloudTrail.","cues":["prevent vs record","audit trail","what was asked and answered","who invoked"],"confuse":[],"memory":"Guard, Transcript, Footprints.","refs":["Exam guide 5.1.4","https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html"],"slice":"s7"},{"id":"s7-compare-config-cloudtrail-cloudwatch","domain":5,"task":"5.2","objective":"5.2.1","kind":"compare","tags":[],"front":"AWS Config vs AWS CloudTrail vs Amazon CloudWatch: how do you tell them apart?","answer":"Config records resource configurations and checks compliance with rules; CloudTrail records API calls (who did what, when); CloudWatch collects metrics and logs, sets alarms and monitors performance and health.","explain":"These three are often offered together. Config answers is this resource set up correctly and how did its settings change. CloudTrail answers who made this change. CloudWatch answers how is it running right now, for example Bedrock invocation counts, latency, errors or a SageMaker AI endpoint's CPU usage, and can trigger alarms.","example":"An endpoint's latency spikes: CloudWatch alarm. A bucket loses encryption: Config rule. Who removed it: CloudTrail.","cues":["compliance of resource configurations","API activity","metrics and alarms","monitoring"],"confuse":[],"memory":"Config = settings, CloudTrail = actions, CloudWatch = health.","refs":["Exam guide 5.2.1"],"slice":"s7"},{"id":"s7-compare-kms-vs-tls","domain":5,"task":"5.1","objective":"5.1.4","kind":"compare","tags":["hot"],"front":"Encryption at rest vs encryption in transit: what is the difference and which AWS mechanism is used for each?","answer":"Encryption at rest protects stored data, typically with keys managed in AWS KMS; encryption in transit protects data moving over a network using TLS (HTTPS).","explain":"At rest covers S3 objects, databases, model artifacts, vector stores and logs. In transit covers API calls from your app to Bedrock, traffic between services and user connections. AWS APIs such as Bedrock require TLS (TLS 1.2 minimum, TLS 1.3 recommended). Exam answers for full data protection usually include both. PrivateLink changes the network path but is not itself encryption.","example":"Training data in S3 encrypted with a KMS key (at rest); the app calls Bedrock over HTTPS (in transit).","cues":["encryption at rest","encryption in transit","TLS","HTTPS"],"confuse":[],"memory":"Rest = KMS on disk; Transit = TLS on the wire.","refs":["Exam guide 5.1.4","https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html"],"slice":"s7"},{"id":"s7-compare-trusted-advisor-well-architected-audit-manager","domain":5,"task":"5.2","objective":"5.2.1","kind":"compare","tags":[],"front":"AWS Trusted Advisor vs AWS Well-Architected Tool: how do you tell them apart?","answer":"Trusted Advisor runs automated best-practice checks on your account (cost optimization, security, performance, fault tolerance, service limits, operational excellence); the Well-Architected Tool guides a question-based review of a workload against the Well-Architected Framework.","explain":"Trusted Advisor is automatic and account-wide, for example flagging open security groups or idle resources. The Well-Architected Tool is a structured self-assessment of one workload across the framework's pillars, including lenses for areas such as machine learning. Both are in scope for v1.1; AWS Audit Manager often appears next to them as a distractor.","example":"Idle EC2 instances flagged: Trusted Advisor. Architecture review of a new RAG app: Well-Architected Tool.","cues":["best practice recommendations","workload review","Well-Architected Framework","automated checks"],"confuse":[{"with":"AWS Audit Manager (not in v1.1 scope, seen as a distractor)","diff":"Audit Manager collects evidence of your own compliance; it does not give best-practice checks or workload reviews."},{"with":"AWS Artifact","diff":"Artifact provides AWS's own compliance reports, not recommendations about your account."}],"memory":"Advisor checks automatically; the Well-Architected Tool reviews with you.","refs":["Exam guide 5.2.1"],"slice":"s7"},{"id":"fill-cmp-clarify-monitor-a2i-groundtruth-guardrails","domain":4,"task":"4.1","objective":"4.1.7","kind":"compare","tags":["hot","legacy"],"front":"SageMaker Clarify vs SageMaker Model Monitor vs Amazon A2I vs SageMaker Ground Truth vs Amazon Bedrock Guardrails: how do you pick the right one?","answer":"By verb: detect bias or explain predictions = Clarify; drift in a deployed model = Model Monitor; human review of low-confidence predictions = A2I; human labeling for training data = Ground Truth; filter or mask GenAI content = Guardrails.","explain":"All five sound like responsible AI tools, so the exam uses them as distractors for each other. Clarify analyzes bias before training (in the data) and after training (in predictions) and explains predictions with feature attributions, meaning how much each input influenced a result. Model Monitor compares a live endpoint with a baseline (statistics captured from the training data) to catch drift, meaning live data or accuracy gradually moving away from what the model saw in training, in data quality, model quality, bias or feature attributions; A2I (Amazon Augmented AI) adds a human review loop at inference time, while Ground Truth uses human labelers before training. Guardrails applies real-time policies to the prompts and responses of generative AI apps. Clarify, Model Monitor, Ground Truth and A2I are now closed to new customers, but on the exam each is still the answer for its job.","example":"Loan model: Clarify finds the training data under-represents young applicants; months later Model Monitor flags bias drift in live predictions.","cues":["detect bias in training data or explain a prediction","drift after deployment","send low-confidence predictions to human reviewers","label raw data to create a training set","block or mask harmful content in prompts and responses"],"confuse":[{"with":"Amazon SageMaker Model Cards","diff":"Model Cards document a model's intended use and risks; they do not measure bias or drift."},{"with":"Human-in-the-loop evaluation","diff":"People rating FM outputs during evaluation, not A2I reviewing individual production predictions."}],"memory":"Clarify explains, Monitor watches, A2I asks a human, Ground Truth labels, Guardrails blocks.","refs":["Exam guide 4.1.7","https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-configure-processing-jobs.html","https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor.html","https://docs.aws.amazon.com/sagemaker/latest/dg/a2i-use-augmented-ai-a2i-human-review-loops.html","https://docs.aws.amazon.com/sagemaker/latest/dg/sms.html","https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html"],"slice":"fill"},{"id":"fill-cmp-governance-security-services","domain":5,"task":"5.2","objective":"5.2.1","kind":"compare","tags":["legacy"],"front":"CloudTrail vs Config vs Inspector vs Artifact vs Trusted Advisor vs Macie vs CloudWatch vs Audit Manager: which is which?","answer":"CloudTrail: who called which API, when. Config: resource configuration history and compliance rules. Inspector: vulnerability scans. Artifact: download AWS compliance reports. Trusted Advisor: best-practice checks. Macie: find PII in S3. CloudWatch: metrics, logs, alarms. Audit Manager: audit evidence collection.","explain":"These services all sound like governance tools, so learn one cue each. CloudTrail is the audit log of actions (API calls) in your account; AWS Config records how each resource is configured over time and evaluates it against rules; Amazon Inspector scans Amazon EC2 instances, container images in Amazon ECR and AWS Lambda functions for software vulnerabilities. AWS Artifact is where you download AWS's own SOC, ISO and PCI reports and accept agreements; Trusted Advisor gives automated recommendations on cost, security, performance and service limits; Macie uses ML and pattern matching to discover sensitive data such as PII (personally identifiable information) in Amazon S3; CloudWatch collects operational metrics and logs and raises alarms. AWS Audit Manager automated evidence collection for your own audits, but it is no longer open to new customers and is not in the v1.1 scope, so treat it as a distractor.","example":"An auditor asks who deleted a training bucket (CloudTrail), whether all buckets are still encrypted (Config), and for AWS's SOC 2 report (Artifact).","cues":["who made the API call","resource drifted out of compliance","software vulnerabilities in EC2, containers or Lambda","download a SOC or ISO report","sensitive data or PII in S3"],"confuse":[{"with":"AWS CloudTrail","diff":"CloudTrail answers who did what and when; Config answers what the resource looks like now and before, and whether it complies."},{"with":"Amazon Macie","diff":"Macie finds sensitive data in S3; Inspector finds software vulnerabilities in compute workloads."}],"memory":"Trail = who, Config = what state, Inspector = holes, Artifact = AWS paperwork, Advisor = tips, Macie = PII, Watch = metrics.","refs":["Exam guide 5.2.1","https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html","https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html","https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html","https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html","https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor.html","https://docs.aws.amazon.com/audit-manager/latest/userguide/what-is.html"],"slice":"fill"},{"id":"fill-cmp-comprehend-kendra-textract-rekognition-quick","domain":1,"task":"1.2","objective":"1.2.4","kind":"compare","tags":["hot","legacy","new2026"],"front":"Amazon Comprehend vs Amazon Kendra vs Amazon Textract vs Amazon Rekognition vs Amazon Quick: which fits which need?","answer":"Comprehend: insights from text (sentiment, entities, PII). Kendra: ML enterprise search returning ranked documents and passages. Textract: extract text, forms and tables from scanned documents. Rekognition: analyze images and video. Quick: AI assistant and BI for business users over company data.","explain":"Look at the input and at who the user is. Text you already have and want to understand (sentiment, key phrases, entities, PII, toxicity) goes to Comprehend, an NLP (natural language processing) service; a scanned image or PDF you first need to read goes to Textract. Images or video (objects, faces, unsafe content) go to Rekognition, a computer vision service. Employees searching many document repositories for ranked passages is Kendra, which closed to new customers in 2026 (AWS points to Amazon Bedrock Knowledge Bases) but can still appear on the exam; business users asking natural-language questions over dashboards and company data is Amazon Quick, which evolved from Amazon QuickSight.","example":"Insurance claims: Textract reads the scanned form, Comprehend finds PII in the notes, Rekognition checks the damage photos.","cues":["sentiment of customer reviews","search across wikis and SharePoint with ranked results","scanned forms and tables","detect faces or unsafe images","business users ask questions of dashboards"],"confuse":[{"with":"Amazon Bedrock Knowledge Bases","diff":"Knowledge Bases generate an answer with citations (RAG); Kendra returns ranked documents and passages."},{"with":"Amazon Transcribe","diff":"Transcribe turns audio into text; Textract turns document images into text."}],"memory":"Comprehend understands, Kendra finds, Textract extracts, Rekognition sees, Quick answers the business.","refs":["Exam guide 1.2.4","https://docs.aws.amazon.com/kendra/latest/dg/what-is-kendra.html","https://docs.aws.amazon.com/quick/latest/userguide/what-is.html"],"slice":"fill"},{"id":"fill-cmp-speech-services-nova-sonic","domain":2,"task":"2.3","objective":"2.3.1","kind":"compare","tags":["hot","new2026"],"front":"Amazon Transcribe vs Amazon Polly vs Amazon Translate vs Amazon Lex vs Amazon Nova Sonic: which fits a voice or language need?","answer":"Transcribe: speech to text. Polly: text to speech. Translate: text between languages. Lex: intent-based chatbot or voice bot with slots. Nova Sonic: one speech-to-speech foundation model for natural, real-time spoken conversations.","explain":"The classic voice-bot pattern chains services: Transcribe turns the caller's audio into text, Lex or an LLM decides the reply, and Polly speaks it back. Amazon Nova Sonic replaces that chain with a single foundation model that listens and speaks over a bidirectional stream (audio flowing both ways at once), adapts its tone to the speaker and handles interruptions without losing context. Lex is structured: you define intents (what the user wants) and slots (details to collect, such as a date). Choose Nova Sonic when the stem says single model, real-time spoken conversation or natural turn-taking.","example":"A travel company's phone agent that chats naturally and lets callers interrupt it: Nova Sonic. A bot that only books a table by collecting date and party size: Lex.","cues":["single model, speech in and speech out","real-time spoken conversation","natural turn-taking or interruptions","intents and slots","convert call recordings to text"],"confuse":[{"with":"Transcribe + LLM + Polly chain","diff":"Works, but adds components and latency; Nova Sonic handles speech in and speech out in one model."},{"with":"Amazon Lex","diff":"Lex follows configured intents and slots; Nova Sonic is a generative model for open-ended conversation."}],"memory":"Scribe writes, Polly talks, Translate converts, Lex follows a script, Sonic converses.","refs":["Exam guide 2.3.1","https://docs.aws.amazon.com/nova/latest/userguide/speech.html"],"slice":"fill"},{"id":"fill-cmp-fm-evaluation-metrics","domain":3,"task":"3.4","objective":"3.4.2","kind":"compare","tags":["hot","new2026"],"front":"ROUGE vs BLEU vs BERTScore vs perplexity vs LLM-as-a-judge vs F1: which metric fits which evaluation?","answer":"ROUGE: recall of reference n-grams, for summaries. BLEU: n-gram precision, for translation. BERTScore: semantic similarity via embeddings. Perplexity: how well a model predicts text, lower is better. LLM-as-a-judge: a second LLM scores responses. F1: classification.","explain":"ROUGE, BLEU and BERTScore compare generated text with a human-written reference answer; an n-gram is a run of n consecutive words. ROUGE is recall-oriented (how much of the reference appears in the output), BLEU is precision-oriented (how much of the output appears in the reference), and BERTScore compares meaning using embeddings (numeric vectors of meaning), so paraphrases still score well. Perplexity needs no reference and measures fluency, while LLM-as-a-judge uses an evaluator model to grade responses at scale on criteria such as correctness or helpfulness, as Amazon Bedrock evaluation jobs can do. F1 is the harmonic mean of precision and recall for classification with fixed labels, not for free text.","example":"Summaries of call notes: ROUGE. English to Spanish product pages: BLEU. Grading 10,000 chatbot answers for helpfulness without references: LLM-as-a-judge.","cues":["summarization","translation quality","paraphrase or semantic similarity","no reference answers, grade at scale","classification precision and recall"],"confuse":[{"with":"Human-in-the-loop evaluation","diff":"People rate outputs for subjective qualities like brand tone; slower and costlier than LLM-as-a-judge."}],"memory":"ROUGE = Recap (recall), BLEU = Bilingual (precision), BERT = meaning, Perplexity = surprise, Judge = second LLM grades, F1 = labels.","refs":["Exam guide 3.4.2","https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html"],"slice":"fill"},{"id":"fill-cmp-inference-parameters","domain":3,"task":"3.1","objective":"3.1.2","kind":"compare","tags":["hot"],"front":"Temperature vs Top P vs Top K vs maximum length vs stop sequences: what does each inference parameter control?","answer":"Temperature: randomness, lower is more consistent. Top P: sample only from tokens within cumulative probability P. Top K: sample only from the K most likely tokens. Max length: caps response tokens, cost and latency. Stop sequence: text that ends generation.","explain":"An inference parameter is a setting sent with each request that changes the output without retraining the model. The model assigns a probability to every possible next token (word piece); temperature reshapes that whole distribution, while Top P and Top K shrink the candidate list, by cumulative probability or by a fixed count, before one is picked. Maximum length (max tokens) limits how many output tokens are produced, which also limits cost and response time, and a stop sequence is a string such as a delimiter that ends the response when it appears. Exam cues: more creative or varied means raise temperature, consistent or deterministic means lower it, shorter or cheaper answers means lower max tokens.","example":"Next-word candidates horses 0.7, zebras 0.2, unicorns 0.1: Top K = 2 keeps horses and zebras; Top P = 0.7 keeps only horses; a high temperature makes unicorns more likely.","cues":["more creative or varied output","consistent or deterministic output","shorter or cheaper responses","stop at a delimiter"],"confuse":[{"with":"Fine-tuning","diff":"Fine-tuning changes model weights; inference parameters only change how each response is generated."}],"memory":"Temperature = mood, Top P = percent, Top K = count, Max tokens = length, Stop = brake.","refs":["Exam guide 3.1.2","https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html"],"slice":"fill"},{"id":"fill-cmp-dev-agent-tools-by-persona","domain":2,"task":"2.3","objective":"2.3.1","kind":"compare","tags":["new2026","hot","legacy"],"front":"Kiro vs Amazon Q Developer vs Strands Agents vs Amazon Bedrock AgentCore vs Amazon Bedrock Agents vs Amazon Quick: how do you pick by persona?","answer":"Developer writing software: Kiro (Q Developer is the older assistant). Developer coding an agent: Strands Agents. Platform team deploying and securing agents: Bedrock AgentCore. Console-configured agent: Bedrock Agents. Business user: Amazon Quick.","explain":"Kiro is an agentic IDE and CLI that turns a request into specs (requirements, design, tasks) and then code; AWS recommends it over Amazon Q Developer, whose IDE plugins end support on April 30, 2027. Strands Agents is an open-source SDK (code library) for writing agents from a model plus tools. Amazon Bedrock AgentCore is a managed platform to run agents from any framework in production, with Runtime, Memory, Gateway, Identity, Policy and Observability. Amazon Bedrock Agents (now called Classic and closed to new customers) configures an agent in the console with action groups and knowledge bases, and on the exam action groups still point to it. Amazon Quick is the ready-made AI assistant and BI (business intelligence) service for business users.","example":"A team writes a support agent with Strands, runs it on AgentCore Runtime, builds the surrounding web app in Kiro, and sales staff use Quick for their own questions.","cues":["spec-driven development","open-source SDK to build agents","any framework, secure, production scale","action groups","business users, no code"],"confuse":[{"with":"AWS Transform","diff":"Transform provides ready-made agents to migrate and modernize legacy workloads, not to write new features or host your agents."}],"memory":"Kiro codes, Strands writes the agent, AgentCore runs it, Bedrock Agents configures one, Quick serves the business.","refs":["Exam guide 2.3.1","https://kiro.dev/docs/","https://kiro.dev/docs/cli/","https://strandsagents.com/","https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html","https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html","https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/what-is.html","https://docs.aws.amazon.com/quick/latest/userguide/what-is.html"],"slice":"fill"},{"id":"fill-cmp-fm-customization-decision","domain":3,"task":"3.1","objective":"3.1.5","kind":"compare","tags":["hot","new2026"],"front":"Prompt engineering vs RAG vs fine-tuning vs continued pre-training vs distillation vs pre-training from scratch: which customization fits the requirement?","answer":"Change format or behavior cheaply: prompt engineering. Add current or private facts with citations: RAG. Change style or task from labeled examples: fine-tuning. Learn domain vocabulary from unlabeled text: continued pre-training. Cut inference cost and latency: distillation. From scratch: rarely.","explain":"Prompt engineering (in-context learning: instructions and examples inside the prompt) and RAG (Retrieval Augmented Generation: fetching relevant documents at query time) need no training and leave the model's weights, its learned parameters, unchanged. Fine-tuning trains on labeled prompt-response pairs; continued pre-training trains on large amounts of unlabeled domain text; disti
